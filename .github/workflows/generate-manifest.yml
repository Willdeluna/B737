name: Generate images manifest

# Re-build images/manifest.json automatically whenever images change.
# This means uploads via the editor (which commit image files to the repo)
# get a fresh manifest without anyone having to run the python script
# locally.
on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'generate_manifest.py'
      - '.github/workflows/generate-manifest.yml'
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Allow the workflow to push the regenerated manifest back to the repo
permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate manifest
        run: python3 generate_manifest.py

      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/manifest.json
          if git diff --cached --quiet; then
            echo "Manifest unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "Auto-update images/manifest.json [skip ci]"
          # Retry the push a few times with rebase to handle concurrent
          # commits (e.g. the editor's state.json auto-sync may land
          # between our checkout and push).
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push attempt $i failed, pulling latest and retrying..."
            git pull --rebase
            sleep 2
          done
          echo "Push failed after 5 attempts"
          exit 1
