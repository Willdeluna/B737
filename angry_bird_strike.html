<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ANGRY BIRD STRIKE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', 'Lucida Console', Monaco, monospace; color: #fff; touch-action: none; font-weight: bold; letter-spacing: 1px; }
  #game-wrap { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; image-rendering: pixelated; image-rendering: crisp-edges; }
  /* CRT scanlines overlay */
  #game-wrap::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px); z-index: 25; mix-blend-mode: multiply; }
  /* Subtle vignette */
  #game-wrap::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.4) 100%); z-index: 24; }
  #hud { position: absolute; top: 0; left: 0; right: 0; padding: 10px 12px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; z-index: 30; flex-wrap: wrap; gap: 4px; }
  .hud-block { background: #000; border: 3px solid #fff; padding: 4px 10px; font-size: 13px; font-weight: bold; color: #fff; text-shadow: 2px 2px 0 #000; letter-spacing: 2px; text-transform: uppercase; box-shadow: 4px 4px 0 rgba(0,0,0,0.6); }
  .hud-block strong { color: #ffdd00; }
  #strikes { border-color: #ff3333; background: #330000; } #strikes strong { color: #ff6666; }
  #target-progress { border-color: #33ff77; background: #003311; } #target-progress strong { color: #66ff99; }
  #birds-left { border-color: #ff8833; background: #331100; }
  #overlay { position: absolute; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 40; padding: 20px; text-align: center; }
  #overlay.hidden { display: none; }
  /* Retro starfield bg on overlay */
  #overlay::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(2px 2px at 20px 30px, #fff, transparent), radial-gradient(1px 1px at 60px 80px, #fff, transparent), radial-gradient(1px 1px at 130px 50px, #ffd, transparent), radial-gradient(2px 2px at 200px 120px, #fff, transparent), radial-gradient(1px 1px at 250px 30px, #fff, transparent), radial-gradient(1px 1px at 320px 90px, #aaf, transparent); background-size: 350px 200px; background-repeat: repeat; opacity: 0.4; pointer-events: none; }
  #overlay > * { position: relative; z-index: 1; }
  #overlay h1 { font-size: clamp(28px, 8vw, 48px); color: #ffdd00; letter-spacing: 4px; margin-bottom: 12px; text-shadow: 4px 4px 0 #aa3300, 8px 8px 0 #000; font-weight: 900; text-transform: uppercase; }
  #overlay h2 { font-size: clamp(12px, 3vw, 16px); color: #66ddff; margin-bottom: 24px; text-shadow: 2px 2px 0 #000; letter-spacing: 3px; text-transform: uppercase; }
  #overlay p { font-size: clamp(12px, 2.8vw, 14px); color: #fff; line-height: 1.8; max-width: 440px; margin-bottom: 24px; text-shadow: 2px 2px 0 #000; letter-spacing: 1px; }
  .key { color: #ffdd00; font-weight: bold; }
  button { background: #ff6600; border: 4px solid #fff; color: #fff; padding: 14px 36px; font-family: inherit; font-size: 18px; font-weight: 900; letter-spacing: 4px; cursor: pointer; text-shadow: 2px 2px 0 #000; box-shadow: 0 6px 0 #aa3300, 0 10px 16px rgba(0,0,0,0.6); text-transform: uppercase; transition: none; }
  button:active { background: #ff8800; transform: translateY(4px); box-shadow: 0 2px 0 #aa3300, 0 4px 8px rgba(0,0,0,0.6); }
  #stars-display { display: flex; justify-content: center; gap: 18px; margin: 24px 0 18px 0; padding: 10px; }
  .star { width: 64px; height: 64px; display: block; overflow: visible; opacity: 0.35; transform: scale(0.6); transition: opacity 0.4s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); background: transparent; border: none; outline: none; image-rendering: pixelated; }
  .star path { transition: filter 0.4s, fill 0.4s; fill: #444; stroke: #222; stroke-width: 2; }
  .star.lit { opacity: 1; transform: scale(1); }
  .star.lit path { fill: #ffdd00; stroke: #cc6600; filter: drop-shadow(0 0 6px #ffdd00) drop-shadow(0 0 14px #ff8800); }
  #stats { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 10px; color: rgba(255, 255, 255, 0.85); z-index: 10; pointer-events: none; text-shadow: 2px 2px 0 #000; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; }
  #level-up { position: absolute; top: 32%; left: 0; right: 0; text-align: center; pointer-events: none; font-size: clamp(28px, 7vw, 48px); color: #ffdd00; font-weight: 900; text-shadow: 4px 4px 0 #aa3300, 8px 8px 0 #000; opacity: 0; z-index: 15; transition: opacity 0.3s, transform 0.4s; transform: scale(0.5); letter-spacing: 6px; text-transform: uppercase; }
  #level-up.show { opacity: 1; transform: scale(1); }
  #combo-display { position: absolute; top: 42%; left: 0; right: 0; text-align: center; pointer-events: none; font-size: clamp(20px, 5vw, 32px); color: #ff8800; font-weight: 900; text-shadow: 3px 3px 0 #000; opacity: 0; z-index: 14; transition: opacity 0.2s, transform 0.3s; transform: scale(0.5); letter-spacing: 4px; }
  #combo-display.show { opacity: 1; transform: scale(1); }
  #sound-toggle { position: absolute; bottom: 36px; right: 14px; background: #000; border: 3px solid #fff; color: #fff; width: 40px; height: 40px; cursor: pointer; font-size: 16px; z-index: 31; padding: 0; box-shadow: 3px 3px 0 rgba(0,0,0,0.6); }
  #sound-toggle:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(0,0,0,0.6); }
  #bird-queue { position: absolute; bottom: 16px; left: 14px; display: flex; gap: 5px; z-index: 30; pointer-events: none; padding: 5px 7px; background: #000; border: 3px solid #fff; box-shadow: 3px 3px 0 rgba(0,0,0,0.6); }
  .bird-icon { width: 18px; height: 18px; background: #ff3333; border: 2px solid #660000; image-rendering: pixelated; transition: opacity 0.3s, transform 0.3s; box-shadow: inset 2px 2px 0 #ff8888, inset -2px -2px 0 #aa1111; }
  .bird-icon.used { opacity: 0.2; transform: scale(0.7); background: #444; box-shadow: none; }
  #high-score-row { color: #66ddff; font-size: 11px; margin-top: -8px; margin-bottom: 8px; letter-spacing: 2px; text-shadow: 2px 2px 0 #000; }
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="hud-block">SCORE <strong id="score">0</strong></div>
    <div class="hud-block">STAGE <strong id="level">1</strong></div>
    <div class="hud-block" id="target-progress">HITS <strong id="targets">0</strong>/<strong id="targets-needed">5</strong></div>
    <div class="hud-block" id="strikes">STRK <strong id="strike-count">0</strong>/5</div>
  </div>
  <div id="bird-queue"></div>
  <button id="sound-toggle">🔊</button>
  <div id="stats">DRAG &middot; AIM &middot; FIRE &middot; CHAIN COMBOS &middot; AVOID ENGINES</div>
  <div id="level-up"></div>
  <div id="combo-display"></div>
  <div id="overlay">
    <h1>ANGRY BIRD STRIKE</h1>
    <h2>FLIGHT SAFETY EDITION</h2>
    <p><span class="key">5 BIRDS</span> PER STAGE TO HIT SKY TARGETS!<br><br><span style="color:#ff3333">AVOID PLANE ENGINES</span><br>BUILD COMBOS FOR HIGHER SCORE<br><span style="color:#ff3333">5 STRIKES = GAME OVER</span></p>
    <button id="start-btn">PRESS START</button>
  </div>
</div>

<script>
(() => {
  'use strict';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('start-btn');
  const soundToggle = document.getElementById('sound-toggle');
  const scoreEl = document.getElementById('score');
  const strikeEl = document.getElementById('strike-count');
  const levelEl = document.getElementById('level');
  const targetsEl = document.getElementById('targets');
  const targetsNeededEl = document.getElementById('targets-needed');
  const levelUpEl = document.getElementById('level-up');
  const comboEl = document.getElementById('combo-display');
  const birdQueueEl = document.getElementById('bird-queue');

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
  }
  window.addEventListener('resize', resize);

  // ===== AUDIO =====
  let audioCtx = null;
  let soundOn = true;
  function getAudio() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    return audioCtx;
  }
  function beep(freq, dur, type, vol) { if (!soundOn) return; const ac = getAudio(); if (!ac) return; try { const osc = ac.createOscillator(); const gain = ac.createGain(); osc.type = type || 'sine'; osc.frequency.value = freq; gain.gain.setValueAtTime(vol || 0.15, ac.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur); osc.connect(gain).connect(ac.destination); osc.start(); osc.stop(ac.currentTime + dur); } catch(e){} }
  function sweep(f1, f2, dur, type, vol) { if (!soundOn) return; const ac = getAudio(); if (!ac) return; try { const osc = ac.createOscillator(); const gain = ac.createGain(); osc.type = type || 'sine'; osc.frequency.setValueAtTime(f1, ac.currentTime); osc.frequency.exponentialRampToValueAtTime(f2, ac.currentTime + dur); gain.gain.setValueAtTime(vol || 0.15, ac.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur); osc.connect(gain).connect(ac.destination); osc.start(); osc.stop(ac.currentTime + dur); } catch(e){} }
  function noise(dur, vol) { if (!soundOn) return; const ac = getAudio(); if (!ac) return; try { const bufSize = Math.floor(ac.sampleRate * dur); const buf = ac.createBuffer(1, bufSize, ac.sampleRate); const data = buf.getChannelData(0); for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1; const src = ac.createBufferSource(); src.buffer = buf; const gain = ac.createGain(); gain.gain.setValueAtTime(vol || 0.15, ac.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur); src.connect(gain).connect(ac.destination); src.start(); } catch(e){} }
  const sounds = {
    // Slingshot stretch: pulsing low square wave
    stretch: () => beep(150 + Math.random() * 40, 0.06, 'square', 0.06),
    // Bird launch: classic "pew!" - fast descending square
    launch: () => { sweep(1400, 350, 0.12, 'square', 0.16); },
    // Balloon pop: classic coin pickup - two-tone blip
    pop: () => { beep(988, 0.05, 'square', 0.18); setTimeout(() => beep(1319, 0.08, 'square', 0.18), 40); },
    // Hot air balloon: deeper double blip with noise
    bigPop: () => { beep(523, 0.06, 'square', 0.2); setTimeout(() => beep(392, 0.08, 'square', 0.2), 50); noise(0.1, 0.1); },
    // Blimp: deep boom
    blimpHit: () => { sweep(160, 50, 0.4, 'triangle', 0.25); noise(0.2, 0.15); },
    // Star: classic Mario 1-UP arpeggio
    starHit: () => { [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => beep(f, 0.07, 'square', 0.18), i * 35)); },
    // Kite: triangle squeak
    kiteHit: () => { beep(800, 0.04, 'square', 0.15); setTimeout(() => beep(1200, 0.06, 'square', 0.15), 30); },
    // Combo: rising pitch by combo level
    combo: (n) => { const note = 440 * Math.pow(1.122, Math.min(n, 12)); beep(note, 0.08, 'square', 0.16); },
    // Quota met: short triumphant blip
    quotaMet: () => { [659, 880, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.08, 'square', 0.16), i * 50)); },
    // Engine hit: classic "you died" descending square notes + bass thump
    engineHit: () => {
      beep(220, 0.1, 'square', 0.22);
      setTimeout(() => beep(196, 0.1, 'square', 0.22), 100);
      setTimeout(() => beep(174, 0.12, 'square', 0.22), 200);
      setTimeout(() => sweep(146, 50, 0.4, 'sawtooth', 0.22), 320);
      noise(0.25, 0.12);
    },
    // Level complete: triumphant ascending fanfare
    levelUp: () => {
      const seq = [523, 659, 784, 1047, 0, 1047, 1175, 1319];
      seq.forEach((f, i) => { if (f === 0) return; setTimeout(() => beep(f, 0.12, 'square', 0.16), i * 90); });
    },
    // Star reveal during 3-star animation
    star: () => { [659, 988, 1319].forEach((f, i) => setTimeout(() => beep(f, 0.08, 'square', 0.18), i * 30)); },
    // Game over: descending wail (classic "wamp wamp")
    gameOver: () => { [392, 349, 311, 277, 247, 220, 196].forEach((f, i) => setTimeout(() => beep(f, 0.2, 'square', 0.2), i * 130)); },
  };
  soundToggle.addEventListener('click', () => { soundOn = !soundOn; soundToggle.textContent = soundOn ? '🔊' : '🔇'; });

  // ===== STATE MACHINE =====
  // Phases: 'menu' | 'playing' | 'transitioning' | 'levelComplete' | 'levelFailed' | 'gameOver'
  const BIRDS_PER_LEVEL = 5;
  const STRIKES_LIMIT = 5;
  const MAX_PARTICLES = 200;
  const MAX_FEATHERS = 100;
  const MAX_SMOKE = 120;
  const MAX_FLOAT_SCORES = 15;

  const state = {
    phase: 'menu',
    score: 0,
    highScore: 0,
    strikes: 0,
    level: 1,
    levelScore: 0,
    birdsLeft: BIRDS_PER_LEVEL,
    targetsHit: 0,
    targetsNeeded: 5,
    combo: 0,
    maxCombo: 0,
    quotaMet: false,
    bird: null,
    slingshot: { x: 0, y: 0 },
    aiming: false,
    planes: [],
    targets: [],
    particles: [],
    feathers: [],
    smoke: [],
    floatScores: [],
    spawnTimer: 0,
    targetSpawnTimer: 0,
    shakeT: 0,
    shakeAmt: 0,
    invulnT: 0,
    transitionTimer: 0,    // counts down for safe transitions
    transitionTo: null,    // what to transition to
  };

  const GRAVITY = 0.45;
  const MAX_PULL = 150;
  const LAUNCH_MULT = 0.22;

  function layout() {
    state.slingshot.x = W * 0.13;
    state.slingshot.y = H * 0.80;
    if (state.phase === 'menu' || (state.bird && !state.bird.launched)) resetBird();
  }

  // ===== DIFFICULTY (much harder progression) =====
  function getDifficulty() {
    const lvl = state.level;
    return {
      // More planes faster
      maxPlanes: Math.min(3 + Math.floor(lvl * 1.0), 12),
      planeSpeedMin: 1.0 + lvl * 0.18,
      planeSpeedMax: 1.8 + lvl * 0.30,
      spawnRate: Math.max(90 - lvl * 8, 30),
      // Targets
      targetSpawnRate: Math.max(80 - lvl * 3, 40),
      maxTargets: Math.min(8 + lvl * 2, 24),
      targetSpeed: 0.5 + lvl * 0.07,
      // Required targets (much steeper curve for difficulty)
      targetsNeeded: 4 + Math.floor(lvl * 1.6),
      // Blimp HP increases at high levels
      blimpHP: 2 + Math.floor(lvl / 5),
    };
  }

  function resetBird() {
    state.bird = {
      x: state.slingshot.x, y: state.slingshot.y - 30,
      vx: 0, vy: 0, r: 18,
      launched: false, dead: false, settled: false,
      rot: 0, trail: [], lifetime: 0, flap: 0,
    };
    state.invulnT = 30;
  }

  const PLANES = [
    { body: '#f5f5fa', stripe: '#ee3333', accent: '#1a3a5a', tail: '#ee3333' },
    { body: '#f8f0d8', stripe: '#1a4488', accent: '#ffaa00', tail: '#1a4488' },
    { body: '#e8e8f0', stripe: '#22aa44', accent: '#ffffff', tail: '#22aa44' },
    { body: '#f4f4f0', stripe: '#7733bb', accent: '#ffd700', tail: '#7733bb' },
    { body: '#ece4dc', stripe: '#ff5500', accent: '#1a1a1a', tail: '#ff5500' },
    { body: '#e0e8f0', stripe: '#cc0066', accent: '#ffffff', tail: '#cc0066' },
  ];

  function spawnPlane() {
    const diff = getDifficulty();
    if (state.planes.length >= diff.maxPlanes) return;
    const dir = Math.random() < 0.5 ? -1 : 1;
    const y = 40 + Math.random() * (H * 0.65);
    const baseSpeed = diff.planeSpeedMin + Math.random() * (diff.planeSpeedMax - diff.planeSpeedMin);
    const speed = baseSpeed * dir;
    const livery = PLANES[Math.floor(Math.random() * PLANES.length)];
    const scale = 0.8 + Math.random() * 0.4;
    state.planes.push({
      x: dir < 0 ? W + 250 : -250,
      y, vx: speed, scale, livery,
      length: 200 * scale,
      contrailT: 0,
      windowFlicker: Math.random() * 100,
      engines: null,
    });
  }

  function spawnTarget() {
    const diff = getDifficulty();
    if (state.targets.length >= diff.maxTargets) return;
    const lvl = state.level;
    const roll = Math.random();
    let type;
    if (lvl >= 3 && roll < 0.10) type = 'blimp';
    else if (roll < 0.20) type = 'star';
    else if (roll < 0.36) type = 'hotair';
    else if (roll < 0.60) type = 'kite';
    else type = 'balloon';
    if (type === 'balloon') spawnBalloon();
    else if (type === 'hotair') spawnHotAir();
    else if (type === 'blimp') spawnBlimp();
    else if (type === 'kite') spawnKite();
    else if (type === 'star') spawnStar();
  }

  function spawnBalloon() {
    const diff = getDifficulty();
    const cluster = Math.random() < 0.35 ? 2 + Math.floor(Math.random() * 2) : 1;
    for (let i = 0; i < cluster; i++) {
      if (state.targets.length >= diff.maxTargets) break;
      state.targets.push({
        type: 'balloon',
        x: W * 0.30 + Math.random() * W * 0.65 + i * 28,
        y: H + 30 + i * 22,
        vx: 0, vy: -(diff.targetSpeed * 1.8 + 0.8 + Math.random() * 0.6),
        r: 14 + Math.random() * 4,
        color: ['#ff3333','#ffd700','#33ff77','#33aaff','#ff77ff','#ff8833','#9944ff'][Math.floor(Math.random()*7)],
        wobble: Math.random() * Math.PI * 2,
        points: 50, hp: 1, age: 0,
      });
    }
  }
  function spawnHotAir() {
    const diff = getDifficulty();
    state.targets.push({
      type: 'hotair',
      x: W * 0.35 + Math.random() * W * 0.60,
      y: H + 60,
      vx: (Math.random() - 0.5) * 0.3,
      vy: -(diff.targetSpeed * 0.6 + Math.random() * 0.3),
      r: 28,
      color: ['#ff4488','#4488ff','#88ff44','#ff8844','#cc44ff'][Math.floor(Math.random()*5)],
      color2: ['#ffdd44','#fff','#ff4444','#44ff88','#fff'][Math.floor(Math.random()*5)],
      wobble: Math.random() * Math.PI * 2,
      points: 150, hp: 1, age: 0,
    });
  }
  function spawnBlimp() {
    const diff = getDifficulty();
    const dir = Math.random() < 0.5 ? -1 : 1;
    state.targets.push({
      type: 'blimp',
      x: dir < 0 ? W + 100 : -100,
      y: 80 + Math.random() * 200,
      vx: dir * (0.4 + Math.random() * 0.3),
      vy: 0, r: 30, w: 90, h: 30,
      points: 250 + (diff.blimpHP - 2) * 100,
      hp: diff.blimpHP, maxHp: diff.blimpHP,
      wobble: Math.random() * Math.PI * 2, age: 0,
    });
  }
  function spawnKite() {
    const diff = getDifficulty();
    const dir = Math.random() < 0.5 ? -1 : 1;
    state.targets.push({
      type: 'kite',
      x: dir < 0 ? W + 50 : -50,
      y: 80 + Math.random() * (H * 0.45),
      vx: dir * (0.8 + diff.targetSpeed * 0.3 + Math.random() * 0.4),
      vy: 0, r: 19,
      color: ['#ff44aa','#44ffff','#ffff44','#aa44ff','#44ff88'][Math.floor(Math.random()*5)],
      wobble: Math.random() * Math.PI * 2,
      bob: Math.random() * Math.PI * 2,
      points: 100, hp: 1, age: 0,
    });
  }
  function spawnStar() {
    state.targets.push({
      type: 'star',
      x: W * 0.25 + Math.random() * W * 0.70,
      y: 60 + Math.random() * (H * 0.55),
      vx: (Math.random() - 0.5) * 0.6,
      vy: -0.15 - Math.random() * 0.15,  // stars now slowly drift up (so they expire)
      r: 17, bob: Math.random() * Math.PI * 2,
      sparkleT: 0, points: 300, hp: 1, age: 0,
    });
  }

  function addParticles(x, y, count, color, opts) {
    opts = opts || {};
    const room = MAX_PARTICLES - state.particles.length;
    count = Math.min(count, Math.max(0, room));
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = (opts.speed || 1) + Math.random() * (opts.speedRange || 3);
      state.particles.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: (opts.life || 30) + Math.random() * 20,
        color: color || '#ffd700',
        size: (opts.size || 2) + Math.random() * 2,
        glow: opts.glow,
      });
    }
  }
  function addFeathers(x, y, count) {
    const room = MAX_FEATHERS - state.feathers.length;
    count = Math.min(count, Math.max(0, room));
    for (let i = 0; i < count; i++) {
      state.feathers.push({
        x: x + (Math.random() - 0.5) * 8,
        y: y + (Math.random() - 0.5) * 8,
        vx: (Math.random() - 0.5) * 5,
        vy: (Math.random() - 0.5) * 3 - 1,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.25,
        life: 100 + Math.random() * 80,
        size: 4 + Math.random() * 4,
        color: ['#ff4444','#ffaaaa','#cc2222','#ffffff','#660000','#ff8888'][Math.floor(Math.random()*6)],
      });
    }
  }
  function addFloatScore(x, y, val) {
    if (state.floatScores.length >= MAX_FLOAT_SCORES) state.floatScores.shift();
    state.floatScores.push({ x, y, val, life: 60, vy: -1.5 });
  }

  // ===== INPUT =====
  function getPoint(e) {
    if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }
  function onDown(e) {
    if (state.phase !== 'playing') return;
    if (!state.bird || state.bird.launched) return;
    const p = getPoint(e);
    const dx = p.x - state.bird.x, dy = p.y - state.bird.y;
    if (dx*dx + dy*dy < 80*80) { state.aiming = true; e.preventDefault(); }
  }
  let lastStretchT = 0;
  function onMove(e) {
    if (!state.aiming) return;
    const p = getPoint(e);
    let dx = p.x - state.slingshot.x, dy = p.y - state.slingshot.y;
    const dist = Math.hypot(dx, dy);
    if (dist > MAX_PULL) { dx = (dx / dist) * MAX_PULL; dy = (dy / dist) * MAX_PULL; }
    state.bird.x = state.slingshot.x + dx;
    state.bird.y = state.slingshot.y + dy;
    if (dist > 30 && performance.now() - lastStretchT > 200) { lastStretchT = performance.now(); sounds.stretch(); }
    e.preventDefault();
  }
  function onUp(e) {
    if (!state.aiming) return;
    state.aiming = false;
    const dx = state.slingshot.x - state.bird.x;
    const dy = state.slingshot.y - state.bird.y;
    if (Math.hypot(dx, dy) > 15) {
      state.bird.vx = dx * LAUNCH_MULT;
      state.bird.vy = dy * LAUNCH_MULT;
      state.bird.launched = true;
      sounds.launch();
      state.birdsLeft--;
      updateHUD();
    } else { resetBird(); }
    e.preventDefault();
  }
  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: false });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  canvas.addEventListener('touchend', onUp, { passive: false });

  // ===== STATE MACHINE TRANSITIONS =====
  function setTransition(toPhase, delayFrames) {
    if (state.phase === 'transitioning') return;
    state.phase = 'transitioning';
    state.transitionTo = toPhase;
    state.transitionTimer = delayFrames || 60;
  }
  function doTransition() {
    const to = state.transitionTo;
    state.transitionTo = null;
    if (to === 'levelComplete') showLevelComplete();
    else if (to === 'levelFailed') levelFailed();
    else if (to === 'gameOver') gameOver();
    else if (to === 'nextBird') { resetBird(); state.phase = 'playing'; }
  }

  // Called when current bird's flight is fully resolved
  function onBirdSettled() {
    if (state.bird) state.bird.settled = true;
    if (state.phase !== 'playing') return;
    // Reset combo on bird settle
    state.combo = 0;

    if (state.strikes >= STRIKES_LIMIT) {
      setTransition('gameOver', 60);
      return;
    }
    if (state.birdsLeft <= 0) {
      // All birds used - decide win/lose
      if (state.targetsHit >= state.targetsNeeded) {
        setTransition('levelComplete', 60);
      } else {
        setTransition('levelFailed', 90);
      }
      return;
    }
    // Still have birds - continue
    resetBird();
  }

  // ===== UPDATE =====
  function update() {
    if (state.phase === 'menu') return;

    // Handle transition timer
    if (state.phase === 'transitioning') {
      state.transitionTimer--;
      if (state.transitionTimer <= 0) doTransition();
      // keep updating world during transition for visual continuity
    }

    if (state.phase !== 'playing' && state.phase !== 'transitioning') return;

    const diff = getDifficulty();
    if (state.invulnT > 0) state.invulnT--;

    // Only spawn during active play
    if (state.phase === 'playing') {
      state.spawnTimer--;
      if (state.spawnTimer <= 0) {
        spawnPlane();
        if (state.level >= 2 && Math.random() < 0.45) spawnPlane();
        if (state.level >= 4 && Math.random() < 0.40) spawnPlane();
        if (state.level >= 7 && Math.random() < 0.30) spawnPlane();
        state.spawnTimer = diff.spawnRate + Math.random() * 30;
      }
      state.targetSpawnTimer--;
      if (state.targetSpawnTimer <= 0) {
        spawnTarget();
        if (Math.random() < 0.45) spawnTarget();
        state.targetSpawnTimer = diff.targetSpawnRate + Math.random() * 30;
      }
    }

    // Bird physics
    const b = state.bird;
    if (b && b.launched && !b.settled) {
      b.lifetime++;
      b.flap = (b.flap + 0.4) % (Math.PI * 2);
      if (!b.dead) {
        b.vy += GRAVITY;
        b.x += b.vx;
        b.y += b.vy;
        b.rot = Math.atan2(b.vy, b.vx);
        b.trail.push({ x: b.x, y: b.y, life: 25 });
        if (b.trail.length > 30) b.trail.shift();
      }

      // Bird ending conditions
      const groundY = H * 0.87;
      let ended = false;
      if (b.dead) {
        // dead-bird grace: wait a bit for effects then settle
        if (b.lifetime > 80) ended = true;
      } else {
        if (b.y > groundY + 15 && b.vy > 0) { addParticles(b.x, groundY, 12, '#8a6a3a'); ended = true; }
        else if (b.x > W + 80 || b.x < -80 || b.y > H + 80) ended = true;
        else if (b.lifetime > 600) ended = true;  // safety
      }
      if (ended) onBirdSettled();
    }
    if (b && b.trail) {
      for (let i = b.trail.length - 1; i >= 0; i--) {
        b.trail[i].life--;
        if (b.trail[i].life <= 0) b.trail.splice(i, 1);
      }
    }

    // Planes
    for (let i = state.planes.length - 1; i >= 0; i--) {
      const p = state.planes[i];
      p.x += p.vx;
      p.contrailT++;
      p.windowFlicker += 0.5;
      const s = p.scale;
      const flip = p.vx < 0 ? -1 : 1;
      p.engines = [
        { x: p.x + (-18 * flip) * s, y: p.y + 14 * s, r: 11 * s },
        { x: p.x + (22 * flip) * s, y: p.y + 14 * s, r: 11 * s },
      ];
      if (p.contrailT % 4 === 0 && state.smoke.length < MAX_SMOKE) {
        for (const eng of p.engines) {
          if (state.smoke.length >= MAX_SMOKE) break;
          state.smoke.push({
            x: eng.x - (p.vx > 0 ? 1 : -1) * 12 * s,
            y: eng.y, vx: -p.vx * 0.1, vy: 0,
            r: 3 * s, life: 50 + Math.random() * 30, maxLife: 80, dark: false,
          });
        }
      }
      if (p.x < -350 || p.x > W + 350) state.planes.splice(i, 1);
    }

    // Smoke
    for (let i = state.smoke.length - 1; i >= 0; i--) {
      const s = state.smoke[i];
      s.x += s.vx; s.y += s.vy; s.r += 0.18; s.life--;
      if (s.life <= 0) state.smoke.splice(i, 1);
    }

    // Targets
    for (let i = state.targets.length - 1; i >= 0; i--) {
      const t = state.targets[i];
      t.age = (t.age || 0) + 1;
      t.x += t.vx; t.y += t.vy;
      if (t.wobble !== undefined) {
        t.wobble += 0.05;
        if (t.type === 'balloon' || t.type === 'hotair' || t.type === 'blimp') t.x += Math.sin(t.wobble) * 0.3;
      }
      if (t.bob !== undefined) {
        t.bob += 0.08;
        if (t.type === 'kite') t.y += Math.sin(t.bob) * 0.5;
        else if (t.type === 'star') t.y += Math.sin(t.bob) * 0.3;
      }
      if (t.type === 'star') t.sparkleT++;
      // remove if off-screen or hp gone or too old (safety cap)
      if (t.hp <= 0 || t.age > 1200 ||
          t.y < -100 || t.y > H + 100 || t.x < -200 || t.x > W + 200) {
        state.targets.splice(i, 1);
      }
    }

    // Particles
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life--;
      if (p.life <= 0) state.particles.splice(i, 1);
    }
    // Feathers
    for (let i = state.feathers.length - 1; i >= 0; i--) {
      const f = state.feathers[i];
      f.x += f.vx; f.y += f.vy; f.vy += 0.02; f.vx *= 0.99; f.rot += f.vr; f.life--;
      if (f.life <= 0) state.feathers.splice(i, 1);
    }
    // Float scores
    for (let i = state.floatScores.length - 1; i >= 0; i--) {
      const s = state.floatScores[i];
      s.y += s.vy; s.vy *= 0.95; s.life--;
      if (s.life <= 0) state.floatScores.splice(i, 1);
    }

    // Collisions
    if (b && b.launched && !b.dead && !b.settled) {
      // Engines
      if (state.invulnT <= 0) {
        for (const p of state.planes) {
          if (!p.engines) continue;
          let hit = false;
          for (const e of p.engines) {
            const dx = b.x - e.x, dy = b.y - e.y;
            if (dx*dx + dy*dy < (e.r + b.r) * (e.r + b.r)) {
              birdStrike(e, p);
              hit = true; break;
            }
          }
          if (hit) return;
          const flip = p.vx < 0 ? -1 : 1;
          const localX = (b.x - p.x) * flip;
          const localY = b.y - p.y;
          if (Math.abs(localX) < 65 * p.scale && Math.abs(localY) < 13 * p.scale) {
            birdStrike({ x: b.x, y: b.y, r: 10 }, p);
            return;
          }
        }
      }
      // Targets
      for (let ti = 0; ti < state.targets.length; ti++) {
        const t = state.targets[ti];
        if (t.hp <= 0) continue;
        let hit = false;
        if (t.type === 'blimp') {
          if (Math.abs(b.x - t.x) < t.w / 2 + b.r && Math.abs(b.y - t.y) < t.h / 2 + b.r) hit = true;
        } else {
          const dx = b.x - t.x, dy = b.y - t.y;
          if (dx*dx + dy*dy < (t.r + b.r) * (t.r + b.r)) hit = true;
        }
        if (!hit) continue;
        t.hp--;
        if (t.hp <= 0) {
          // Combo multiplier
          state.combo++;
          if (state.combo > state.maxCombo) state.maxCombo = state.combo;
          const multiplier = Math.min(state.combo, 5);
          const basePoints = t.points || 50;
          const points = basePoints * multiplier;
          state.score += points;
          state.levelScore += points;
          state.targetsHit++;
          updateHUD();
          addFloatScore(t.x, t.y, points);
          if (state.combo >= 2) {
            showCombo(state.combo, multiplier);
            sounds.combo(state.combo);
          }
          if (t.type === 'balloon') { addParticles(t.x, t.y, 18, t.color); addParticles(t.x, t.y, 4, '#fff'); sounds.pop(); }
          else if (t.type === 'hotair') { addParticles(t.x, t.y, 25, t.color); addParticles(t.x, t.y, 8, '#ff4400'); sounds.bigPop(); }
          else if (t.type === 'blimp') { addParticles(t.x, t.y, 30, '#ddddee'); addParticles(t.x, t.y, 8, '#ff4444'); sounds.blimpHit(); state.shakeT = 8; state.shakeAmt = 4; }
          else if (t.type === 'kite') { addParticles(t.x, t.y, 14, t.color); sounds.kiteHit(); }
          else if (t.type === 'star') { addParticles(t.x, t.y, 25, '#ffdd00', { glow: true }); addParticles(t.x, t.y, 10, '#fff'); sounds.starHit(); }
          if (t.type === 'blimp' || t.type === 'hotair') { b.vx *= 0.7; b.vy *= 0.7; }
          checkQuotaMet();
        } else {
          state.score += 50;
          state.levelScore += 50;
          updateHUD();
          addFloatScore(t.x, t.y, 50);
          addParticles(t.x, t.y, 10, '#ccc');
          sounds.kiteHit();
          b.vx *= 0.6; b.vy *= 0.6;
        }
      }
    }

    if (state.shakeT > 0) state.shakeT--;
  }

  function checkQuotaMet() {
    if (state.targetsHit >= state.targetsNeeded && !state.quotaMet) {
      state.quotaMet = true;
      sounds.quotaMet();
      // Visual flash
      levelUpEl.textContent = 'QUOTA MET!';
      levelUpEl.classList.add('show');
      setTimeout(() => levelUpEl.classList.remove('show'), 900);
    }
  }

  let comboHideTimer = null;
  function showCombo(combo, multiplier) {
    comboEl.textContent = 'COMBO X' + multiplier + (combo >= 5 ? ' MAX!' : '!');
    comboEl.classList.add('show');
    if (comboHideTimer) clearTimeout(comboHideTimer);
    comboHideTimer = setTimeout(() => comboEl.classList.remove('show'), 700);
  }

  function birdStrike(engine, plane) {
    if (!state.bird || state.bird.dead) return;
    state.bird.dead = true;
    state.bird.lifetime = 0;  // reset so the dead-bird grace counter starts
    state.strikes++;
    updateHUD();
    sounds.engineHit();
    const behindDir = -Math.sign(plane.vx || 1);
    addFeathers(engine.x + behindDir * 10, engine.y, 22);
    addParticles(engine.x, engine.y, 18, '#555555');
    for (let i = 0; i < 10 && state.smoke.length < MAX_SMOKE; i++) {
      state.smoke.push({
        x: engine.x + behindDir * (10 + i * 4),
        y: engine.y + (Math.random() - 0.5) * 6,
        vx: behindDir * 0.5, vy: (Math.random() - 0.5) * 0.3,
        r: 5 + Math.random() * 4,
        life: 60 + Math.random() * 30, maxLife: 90, dark: true,
      });
    }
    state.shakeT = 22; state.shakeAmt = 12;
  }

  // ===== DRAW =====
  function draw() {
    let sx = 0, sy = 0;
    if (state.shakeT > 0) {
      const a = (state.shakeT / 22) * state.shakeAmt;
      sx = (Math.random() - 0.5) * a;
      sy = (Math.random() - 0.5) * a;
    }
    ctx.setTransform(DPR, 0, 0, DPR, sx * DPR, sy * DPR);
    drawSky();
    drawDistantMountains();
    drawClouds();
    drawGround();
    state.smoke.forEach(drawSmoke);
    state.targets.forEach(drawTarget);
    state.planes.forEach(drawPlane);
    drawSlingshot();
    if (state.bird && state.bird.trail) {
      for (const t of state.bird.trail) {
        ctx.globalAlpha = (t.life / 25) * 0.5;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(t.x, t.y, 5 * (t.life / 25), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    if (state.bird && !state.bird.dead) drawBird(state.bird);
    if (state.aiming && state.bird && !state.bird.launched) drawAimGuide();
    for (const p of state.particles) {
      ctx.globalAlpha = Math.min(1, p.life / 30);
      if (p.glow) {
        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 3);
        grad.addColorStop(0, p.color);
        grad.addColorStop(1, p.color + '00');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    state.feathers.forEach(drawFeather);
    state.floatScores.forEach(drawFloatScore);
  }

  // ===== SCENERY =====
  function drawSky() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#5fa8e0');
    grad.addColorStop(0.35, '#8fc8ee');
    grad.addColorStop(0.7, '#c8e4f0');
    grad.addColorStop(0.85, '#d8e8a0');
    grad.addColorStop(1, '#8fbc4a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    const sunX = W * 0.85, sunY = H * 0.18;
    const sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 120);
    sunGrad.addColorStop(0, 'rgba(255, 240, 200, 0.7)');
    sunGrad.addColorStop(0.3, 'rgba(255, 220, 140, 0.3)');
    sunGrad.addColorStop(1, 'rgba(255, 220, 140, 0)');
    ctx.fillStyle = sunGrad;
    ctx.fillRect(sunX - 130, sunY - 130, 260, 260);
    ctx.fillStyle = 'rgba(255, 250, 220, 0.9)';
    ctx.beginPath();
    ctx.arc(sunX, sunY, 32, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawDistantMountains() {
    const gy = H * 0.87;
    ctx.fillStyle = 'rgba(120, 130, 170, 0.55)';
    ctx.beginPath(); ctx.moveTo(0, gy);
    for (let x = 0; x < W; x += 25) {
      ctx.lineTo(x, gy - 60 - Math.sin(x * 0.012) * 35 - Math.sin(x * 0.05) * 12);
    }
    ctx.lineTo(W, gy); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(90, 130, 110, 0.7)';
    ctx.beginPath(); ctx.moveTo(0, gy);
    for (let x = 0; x < W; x += 18) {
      ctx.lineTo(x, gy - 35 - Math.sin(x * 0.018 + 1.5) * 20 - Math.sin(x * 0.07) * 8);
    }
    ctx.lineTo(W, gy); ctx.closePath(); ctx.fill();
  }

  const clouds = [];
  function initClouds() {
    clouds.length = 0;
    for (let i = 0; i < 7; i++) {
      clouds.push({
        x: Math.random() * 2000, y: 30 + Math.random() * 200,
        size: 35 + Math.random() * 30,
        speed: 0.08 + Math.random() * 0.18,
        opacity: 0.7 + Math.random() * 0.3,
      });
    }
  }
  initClouds();
  function drawClouds() {
    for (const c of clouds) {
      c.x -= c.speed;
      if (c.x < -200) c.x = W + 200;
      drawCloudShape(c.x, c.y, c.size, c.opacity);
    }
  }
  function drawCloudShape(x, y, size, opacity) {
    ctx.fillStyle = `rgba(180, 190, 210, ${opacity * 0.4})`;
    ctx.beginPath();
    ctx.arc(x, y + 4, size * 0.7, 0, Math.PI * 2);
    ctx.arc(x - size * 0.5, y + 9, size * 0.5, 0, Math.PI * 2);
    ctx.arc(x + size * 0.5, y + 7, size * 0.55, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `rgba(255, 255, 255, ${opacity * 0.95})`;
    ctx.beginPath();
    ctx.arc(x, y, size * 0.7, 0, Math.PI * 2);
    ctx.arc(x - size * 0.5, y + 5, size * 0.5, 0, Math.PI * 2);
    ctx.arc(x + size * 0.5, y + 3, size * 0.55, 0, Math.PI * 2);
    ctx.arc(x + size * 0.2, y - size * 0.3, size * 0.45, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawGround() {
    const gy = H * 0.87;
    const grad = ctx.createLinearGradient(0, gy, 0, H);
    grad.addColorStop(0, '#7ab83a');
    grad.addColorStop(0.3, '#5a9a2a');
    grad.addColorStop(1, '#3a6a1a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, gy, W, H - gy);
    ctx.strokeStyle = '#4a8825';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < W; i += 7) {
      ctx.beginPath();
      ctx.moveTo(i, gy);
      ctx.lineTo(i + 2, gy - 4);
      ctx.stroke();
    }
    for (let i = 30; i < W; i += 60) {
      const fx = i + Math.sin(i) * 10;
      const fy = gy + 5 + Math.sin(i * 0.3) * 3;
      const colors = ['#ff66aa', '#ffdd44', '#ffffff', '#ff8866'];
      ctx.fillStyle = colors[i % 4];
      ctx.beginPath(); ctx.arc(fx, fy, 1.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.strokeStyle = '#3a5a1a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
  }

  function drawSlingshot() {
    const sx = state.slingshot.x, sy = state.slingshot.y;
    const grad = ctx.createLinearGradient(sx - 6, 0, sx + 6, 0);
    grad.addColorStop(0, '#6b4520'); grad.addColorStop(0.5, '#8a5a30'); grad.addColorStop(1, '#4a3010');
    ctx.strokeStyle = grad; ctx.lineWidth = 11; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(sx, sy + 52); ctx.lineTo(sx, sy + 20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx, sy + 20); ctx.lineTo(sx - 13, sy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx, sy + 20); ctx.lineTo(sx + 13, sy); ctx.stroke();
    ctx.strokeStyle = 'rgba(60, 30, 10, 0.6)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(sx - 2, sy + 45); ctx.lineTo(sx - 2, sy + 22); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx + 2, sy + 45); ctx.lineTo(sx + 2, sy + 22); ctx.stroke();
    if (state.bird && !state.bird.launched) {
      ctx.strokeStyle = '#2a1a0a'; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(sx + 13, sy); ctx.lineTo(state.bird.x + 4, state.bird.y);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(sx, sy + 56, 18, 4, 0, 0, Math.PI * 2); ctx.fill();
  }

  function drawBird(b) {
    ctx.save();
    ctx.translate(b.x, b.y); ctx.rotate(b.rot);
    const wingY = b.launched ? Math.sin(b.flap) * 2 : 0;
    ctx.fillStyle = '#aa1111';
    ctx.strokeStyle = '#660000'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-b.r + 2, -4); ctx.lineTo(-b.r - 13, -11);
    ctx.lineTo(-b.r - 11, 0); ctx.lineTo(-b.r - 13, 11);
    ctx.lineTo(-b.r + 2, 4); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#cc3333'; ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(-b.r - 2, -7); ctx.lineTo(-b.r - 11, -8);
    ctx.moveTo(-b.r - 2, 0); ctx.lineTo(-b.r - 10, 0);
    ctx.moveTo(-b.r - 2, 7); ctx.lineTo(-b.r - 11, 8);
    ctx.stroke();
    const grad = ctx.createRadialGradient(-5, -5, 2, 0, 0, b.r);
    grad.addColorStop(0, '#ff9999'); grad.addColorStop(0.5, '#ee4444');
    grad.addColorStop(0.9, '#cc1111'); grad.addColorStop(1, '#881111');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#550000'; ctx.lineWidth = 1.5; ctx.stroke();
    const belly = ctx.createRadialGradient(2, 4, 1, 2, 4, b.r * 0.6);

  function drawAimGuide() {
    const b = state.bird;
    const vx = (state.slingshot.x - b.x) * LAUNCH_MULT;
    const vy = (state.slingshot.y - b.y) * LAUNCH_MULT;
    let px = b.x, py = b.y, pvx = vx, pvy = vy;
    for (let i = 0; i < 45; i++) {

      if (i % 2 === 0) {
        ctx.globalAlpha = Math.max(0, 1 - i * 0.025);
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(px, py, 3 - i * 0.04, 0, Math.PI * 2);
        ctx.fill();

  function drawSmoke(s) {
    const alpha = (s.life / s.maxLife) * 0.45;

  function drawStarShape(ctx, cx, cy, inner, outer, points) {
    ctx.beginPath();
    for (let i = 0; i < points * 2; i++) {
      const angle = (i * Math.PI) / points - Math.PI / 2;
      const r = i % 2 === 0 ? outer : inner;
      const x = cx + Math.cos(angle) * r;
      const y = cy + Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  }

  function drawKite(t) {
    const wobble = Math.sin(t.wobble) * 0.12;
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.rotate(wobble + (t.vx < 0 ? -0.18 : 0.18));
    ctx.strokeStyle = t.color; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, t.r);
    let prevX = 0, prevY = t.r;

      const nx = Math.sin(t.wobble + i * 0.5) * 5;
      const ny = t.r + i * 7;
      ctx.quadraticCurveTo(prevX + nx, prevY + (ny - prevY) * 0.5, nx, ny);
      prevX = nx; prevY = ny;

    [t.r + 14, t.r + 28, t.r + 42].forEach((y, i) => {
      const nx = Math.sin(t.wobble + (i+1) * 0.5) * 5;
      ctx.fillStyle = shade(t.color, 30);
      ctx.beginPath(); ctx.ellipse(nx - 3.5, y, 2.5, 1.8, -0.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(nx + 3.5, y, 2.5, 1.8, 0.4, 0, Math.PI * 2); ctx.fill();
    });
    const colors = [t.color, shade(t.color, 30), shade(t.color, -15), shade(t.color, 50)];
    const quads = [
      [[0, -t.r], [t.r * 0.7, 0], [0, 0]],
      [[t.r * 0.7, 0], [0, t.r], [0, 0]],
      [[0, t.r], [-t.r * 0.7, 0], [0, 0]],
      [[-t.r * 0.7, 0], [0, -t.r], [0, 0]],

    ctx.beginPath(); ctx.moveTo(64, -6.5); ctx.lineTo(64, 2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.ellipse(58, -5, 6, 1.5, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = shade(c.body, -25);
    ctx.beginPath(); ctx.moveTo(22, 7); ctx.lineTo(-5, 34); ctx.lineTo(-22, 34); ctx.lineTo(-5, 7); ctx.closePath(); ctx.fill();
    const wingGrad = ctx.createLinearGradient(0, 4, 0, 32);
    wingGrad.addColorStop(0, shade(c.body, 5)); wingGrad.addColorStop(1, shade(c.body, -20));
    ctx.fillStyle = wingGrad;
    ctx.beginPath(); ctx.moveTo(22, 5); ctx.lineTo(-2, 32); ctx.lineTo(-20, 32); ctx.lineTo(-9, 5); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = shade(c.body, -50); ctx.lineWidth = 0.8; ctx.stroke();
    ctx.fillStyle = c.stripe;
    ctx.beginPath(); ctx.moveTo(-2, 32); ctx.lineTo(-20, 32); ctx.lineTo(-17, 35); ctx.lineTo(-3, 35); ctx.closePath(); ctx.fill();
    drawEngine(-18, 14);
    drawEngine(24, 14);
    ctx.restore();
    if (p.engines) {
      for (const e of p.engines) {
        const pulseT = performance.now() * 0.003;
        const pulse = 0.45 + Math.sin(pulseT) * 0.22;
        const grad = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r * 2.5);
        grad.addColorStop(0, 'rgba(255, 50, 50, ' + (pulse * 0.55) + ')');
        grad.addColorStop(0.5, 'rgba(255, 50, 50, ' + (pulse * 0.15) + ')');
        grad.addColorStop(1, 'rgba(255, 50, 50, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 2.5, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function drawEngine(x, y) {
    ctx.fillStyle = '#555'; ctx.fillRect(x - 1.8, y - 9, 3.6, 7);
    const eg = ctx.createLinearGradient(x, y - 10, x, y + 10);
    eg.addColorStop(0, '#888'); eg.addColorStop(0.3, '#666');
    eg.addColorStop(0.6, '#444'); eg.addColorStop(1, '#1a1a1a');
    ctx.fillStyle = eg;
    ctx.beginPath(); ctx.ellipse(x, y, 16, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#999';
    ctx.beginPath(); ctx.ellipse(x + 12, y, 7, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(x + 12, y, 5, 6, 0, 0, Math.PI * 2); ctx.fill();
    const t = performance.now() * 0.10;
    ctx.save(); ctx.translate(x + 12, y); ctx.rotate(t);
    ctx.globalAlpha = 0.6;
    ctx.strokeStyle = '#888'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
    for (let i = 0; i < 8; i++) {
      ctx.rotate(Math.PI / 4);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(5, 0); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#aaa';
    ctx.beginPath(); ctx.arc(0, 0, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#0a0a0a';
    ctx.beginPath(); ctx.ellipse(x - 14, y, 3.5, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(x, y - 7, 11, 1.5, 0, 0, Math.PI); ctx.stroke();
  }

  function drawFeather(f) {
    ctx.save();
    ctx.translate(f.x, f.y); ctx.rotate(f.rot);
    ctx.globalAlpha = Math.min(1, f.life / 60);
    const grad = ctx.createLinearGradient(-f.size, 0, f.size, 0);
    grad.addColorStop(0, shade(f.color, 20));
    grad.addColorStop(1, shade(f.color, -20));
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(0, 0, f.size, f.size * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore(); ctx.globalAlpha = 1;
  }

  function drawFloatScore(s) {
    const alpha = Math.min(1, s.life / 30);
    ctx.globalAlpha = alpha;
    ctx.font = 'bold 20px Trebuchet MS';
    ctx.textAlign = 'center';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
    ctx.strokeText('+' + s.val, s.x, s.y);
    ctx.fillStyle = '#ffdd00';
    ctx.fillText('+' + s.val, s.x, s.y);
    ctx.globalAlpha = 1;
  }

  function shade(hex, percent) {
    const num = parseInt(hex.replace('#', ''), 16);
    const r = (num >> 16) + percent;
    const g = ((num >> 8) & 0xff) + percent;
    const b = (num & 0xff) + percent;
    const clamp = v => Math.max(0, Math.min(255, v));
    return '#' + ((clamp(r) << 16) | (clamp(g) << 8) | clamp(b)).toString(16).padStart(6, '0');
  }

  // ===== UI =====
  function updateHUD() {
    scoreEl.textContent = state.score;
    strikeEl.textContent = state.strikes;
    levelEl.textContent = state.level;
    targetsEl.textContent = state.targetsHit;
    targetsNeededEl.textContent = state.targetsNeeded;
    let html = '';
    for (let i = 0; i < BIRDS_PER_LEVEL; i++) {
      html += '<div class="bird-icon ' + (i >= state.birdsLeft ? 'used' : '') + '"></div>';
    }
    birdQueueEl.innerHTML = html;
  }

  function calculateStars() {
    // 1 star: just meet quota (auto since this is only called on success)
    // 2 stars: hit ~2x quota worth in score (some combos, some bonus targets)
    // 3 stars: hit ~5x quota worth (heavy combos, lots of bonus targets, all birds productive)
    const t2 = state.targetsNeeded * 250;
    const t3 = state.targetsNeeded * 600;
    if (state.levelScore >= t3) return 3;
    if (state.levelScore >= t2) return 2;
    return 1;
  }
  function getStarThresholds() {
    return { t2: state.targetsNeeded * 250, t3: state.targetsNeeded * 600 };
  }

  function starSVG() {
    return '<svg class="star" viewBox="-2 -2 28 28" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M12 2 L14.6 9 L22 9.5 L16.3 14.5 L18.2 22 L12 17.8 L5.8 22 L7.7 14.5 L2 9.5 L9.4 9 Z" ' +
      'stroke-width="1.5" stroke-linejoin="round"/></svg>';
  }

  function showLevelComplete() {
    state.phase = 'levelComplete';
    if (state.score > state.highScore) state.highScore = state.score;
    sounds.levelUp();
    const stars = calculateStars();
    const thresh = getStarThresholds();
    overlay.classList.remove('hidden');
    overlay.querySelector('h1').textContent = 'WAVE CLEARED!';
    overlay.querySelector('h2').textContent = 'STAGE ' + state.level + ' COMPLETE';
    overlay.querySelector('p').innerHTML =
      '<div id="stars-display">' + starSVG() + starSVG() + starSVG() + '</div>' +
      '<div style="font-size:11px;color:#888;margin-bottom:8px;letter-spacing:2px">' +
      '★★ AT ' + thresh.t2 + ' &middot; ★★★ AT ' + thresh.t3 + '</div>' +
      'STAGE SCORE: <span style="color:#ffdd00;font-size:1.4em">' + state.levelScore + '</span><br>' +
      'MAX COMBO: <span style="color:#ff8800">x' + Math.min(state.maxCombo, 5) + '</span><br>' +
      'TOTAL: <span style="color:#fff">' + state.score + '</span><br>' +
      '<span style="color:#66ddff;font-size:11px">HI-SCORE: ' + state.highScore + '</span>';
    startBtn.textContent = 'NEXT WAVE';
    startBtn.onclick = () => {
      state.level++;
      startNextLevel();
    };
    const starEls = overlay.querySelectorAll('.star');
    setTimeout(() => {
      for (let i = 0; i < stars; i++) {
        setTimeout(() => {
          starEls[i].classList.add('lit');
          sounds.star();
        }, i * 500);
      }
    }, 400);
  }

  function levelFailed() {
    state.phase = 'levelFailed';
    if (state.score > state.highScore) state.highScore = state.score;
    sounds.gameOver();
    overlay.classList.remove('hidden');
    overlay.querySelector('h1').textContent = 'OUT OF BIRDS';
    overlay.querySelector('h2').textContent = 'STAGE ' + state.level + ' FAILED';
    overlay.querySelector('p').innerHTML =
      'NEEDED ' + state.targetsNeeded + ' &middot; HIT ' + state.targetsHit + '<br><br>' +
      'SCORE: <span style="color:#ffdd00;font-size:1.3em">' + state.score + '</span><br>' +
      '<span style="color:#66ddff;font-size:11px">HI-SCORE: ' + state.highScore + '</span>';
    startBtn.textContent = 'RETRY';
    startBtn.onclick = () => startNextLevel();
  }

  function gameOver() {
    state.phase = 'gameOver';
    if (state.score > state.highScore) state.highScore = state.score;
    sounds.gameOver();
    overlay.classList.remove('hidden');
    overlay.querySelector('h1').textContent = 'GAME OVER';
    overlay.querySelector('h2').textContent = '5 STRIKES';
    overlay.querySelector('p').innerHTML =
      'THE FAA IS GOING TO HAVE WORDS<br><br>' +
      'FINAL SCORE: <span style="color:#ffdd00;font-size:1.4em">' + state.score + '</span><br>' +
      'REACHED STAGE <span style="color:#ffaa44">' + state.level + '</span><br>' +
      '<span style="color:#66ddff;font-size:11px">HI-SCORE: ' + state.highScore + '</span>';
    startBtn.textContent = 'INSERT COIN';
    startBtn.onclick = () => {
      overlay.querySelector('h1').textContent = 'ANGRY BIRD STRIKE';
      overlay.querySelector('h2').textContent = 'FLIGHT SAFETY EDITION';
      overlay.querySelector('p').innerHTML = '<span class="key">5 BIRDS</span> PER STAGE TO HIT SKY TARGETS!<br><br><span style="color:#ff3333">AVOID PLANE ENGINES</span><br>BUILD COMBOS FOR HIGHER SCORE<br><span style="color:#ff3333">5 STRIKES = GAME OVER</span>';
      startGame();
    };
  }

  function startGame() {
    state.score = 0;
    state.strikes = 0;
    state.level = 1;
    startNextLevel();
  }

  function startNextLevel() {
    state.phase = 'playing';
    state.levelScore = 0;
    state.birdsLeft = BIRDS_PER_LEVEL;
    state.targetsHit = 0;
    state.combo = 0;
    state.maxCombo = 0;
    state.quotaMet = false;
    const diff = getDifficulty();
    state.targetsNeeded = diff.targetsNeeded;
    state.planes.length = 0;
    state.targets.length = 0;
    state.particles.length = 0;
    state.feathers.length = 0;
    state.smoke.length = 0;
    state.floatScores.length = 0;
    state.spawnTimer = 60;
    state.targetSpawnTimer = 15;
    state.transitionTimer = 0;
    state.transitionTo = null;
    state.shakeT = 0;
    resetBird();
    updateHUD();
    overlay.classList.add('hidden');
    levelUpEl.textContent = 'STAGE ' + state.level;
    levelUpEl.classList.add('show');
    setTimeout(() => levelUpEl.classList.remove('show'), 1200);
  }

  startBtn.addEventListener('click', () => {
    getAudio();
    startGame();
  });

  function loop() {
    try {
      update();
      draw();
    } catch (err) {
      console.error('Game loop error:', err);
    }
    requestAnimationFrame(loop);
  }

  resize();
  loop();
})();
</script>
</body>
</html>
