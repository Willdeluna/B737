<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATAcademy — B737NG ATA Chapter Quizzes</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#000;
    --amber:#fe7002;
    --amber-soft:#ff9f1c;
    --amber-dim:#7a3a06;
    --amber-glow:rgba(254,112,2,.35);
    --ink:#ffd9b3;
    --muted:#a86a2f;
    --line:rgba(254,112,2,.28);
    --panel:rgba(255,159,28,.05);
    --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Consolas,"DejaVu Sans Mono",monospace;
    --disp:"Arial Black","Helvetica Neue",Arial,sans-serif;
  }
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:var(--mono);
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%,rgba(254,112,2,.14),transparent 60%),
      radial-gradient(ellipse 60% 40% at 50% 120%,rgba(254,112,2,.06),transparent 60%);
    padding:clamp(18px,4vw,46px) clamp(14px,4vw,40px) 60px;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.16) 2px 3px);
    mix-blend-mode:multiply;opacity:.5;
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:49;
    background:radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.55) 100%);
  }
  .wrap{max-width:1080px;margin:0 auto;position:relative;z-index:1}

  header{text-align:center;margin-bottom:clamp(20px,4vw,38px)}
  .logo{
    width:min(440px,78vw);height:auto;display:block;margin:0 auto;
    filter:drop-shadow(0 0 26px var(--amber-glow));
    animation:logoIn .8s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes logoIn{from{opacity:0;transform:translateY(-12px) scale(.97)}to{opacity:1;transform:none}}
  .tagline{
    margin-top:14px;font-size:12px;letter-spacing:.32em;text-transform:uppercase;
    color:var(--amber-soft);font-weight:700;animation:fade .9s .2s both;
  }
  .annunciator{
    display:inline-flex;align-items:center;gap:9px;margin-top:14px;
    border:1px solid var(--line);border-radius:999px;padding:6px 15px;
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
    background:var(--panel);animation:fade .9s .35s both;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);
    box-shadow:0 0 8px var(--amber);animation:blink 2.4s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.32}}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .filterbar{
    display:flex;align-items:center;margin:clamp(18px,4vw,30px) auto 22px;
    max-width:480px;border:1px solid var(--line);border-radius:12px;
    background:var(--panel);overflow:hidden;animation:fade .9s .45s both;
  }
  .filterbar .pfx{padding:0 12px;color:var(--amber);font-size:13px;font-weight:700;letter-spacing:.1em}
  #filter{
    flex:1;background:transparent;border:none;outline:none;color:var(--ink);
    font-family:var(--mono);font-size:14px;padding:13px 12px 13px 0;letter-spacing:.04em;
  }
  #filter::placeholder{color:var(--muted);opacity:.8}
  #filter:focus{caret-color:var(--amber)}
  .filterbar:focus-within{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber),0 0 22px var(--amber-glow)}
  .clearx{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 14px;line-height:1;display:none}
  .clearx:hover{color:var(--amber)}

  .grid{
    display:grid;gap:clamp(10px,1.6vw,16px);
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  }
  .tile{
    position:relative;display:block;text-decoration:none;color:inherit;
    border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;
    background:linear-gradient(160deg,rgba(255,159,28,.06),rgba(255,159,28,.015));
    overflow:hidden;isolation:isolate;
    transition:transform .18s cubic-bezier(.16,1,.3,1),border-color .18s,box-shadow .18s,background .18s;
    animation:tileIn .5s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes tileIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .tile::before{
    content:"";position:absolute;inset:0;z-index:-1;
    background:linear-gradient(115deg,transparent 30%,rgba(254,112,2,.16) 50%,transparent 70%);
    transform:translateX(-120%);transition:transform .55s ease;
  }
  .tile:hover,.tile:focus-visible{
    transform:translateY(-4px);border-color:var(--amber);
    background:linear-gradient(160deg,rgba(254,112,2,.16),rgba(255,159,28,.04));
    box-shadow:0 10px 28px rgba(0,0,0,.6),0 0 22px var(--amber-glow);outline:none;
  }
  .tile:hover::before,.tile:focus-visible::before{transform:translateX(120%)}
  .tile:active{transform:translateY(-1px)}
  .tile .ata{font-size:10px;letter-spacing:.26em;color:var(--muted);font-weight:700;text-transform:uppercase}
  .tile .num{
    font-family:var(--disp);font-size:clamp(40px,7vw,52px);line-height:.95;font-weight:900;
    color:var(--amber);letter-spacing:-.02em;margin:2px 0 8px;
    text-shadow:0 0 18px rgba(254,112,2,.25);
  }
  .tile .name{font-size:13px;font-weight:700;color:var(--ink);line-height:1.25;min-height:2.4em;letter-spacing:.01em}
  .tile .go{
    margin-top:12px;display:flex;align-items:center;justify-content:space-between;
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    border-top:1px solid var(--line);padding-top:9px;transition:color .18s;
  }
  .tile:hover .go,.tile:focus-visible .go{color:var(--amber-soft)}
  .tile .arrow{transition:transform .2s}
  .tile:hover .arrow,.tile:focus-visible .arrow{transform:translateX(4px)}

  .tile .stars{display:flex;align-items:center;gap:6px;margin-top:11px}
  .tile .st{font-size:24px;line-height:1;color:rgba(254,112,2,.16)}
  .tile .st.on{color:var(--amber);text-shadow:0 0 12px var(--amber-glow)}
  .tile .stars .cap{margin-left:auto;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

  .noresult{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0;font-size:13px;letter-spacing:.08em}

  /* Angry Bird Strike — fun-zone banner after the grid */
  .gamecard{
    display:flex;align-items:center;gap:16px;margin-top:clamp(18px,3vw,28px);
    text-decoration:none;color:inherit;border:1px solid rgba(255,80,60,.4);border-radius:16px;
    padding:18px 20px;overflow:hidden;position:relative;isolation:isolate;
    background:linear-gradient(120deg,rgba(255,60,40,.16),rgba(254,112,2,.06));
    transition:transform .18s cubic-bezier(.16,1,.3,1),border-color .18s,box-shadow .18s;
    animation:fade 1s .75s both;
  }
  .gamecard::before{content:"";position:absolute;inset:0;z-index:-1;
    background:linear-gradient(115deg,transparent 30%,rgba(255,80,60,.18) 50%,transparent 70%);
    transform:translateX(-120%);transition:transform .6s ease}
  .gamecard:hover,.gamecard:focus-visible{transform:translateY(-3px);border-color:#ff503c;
    box-shadow:0 10px 28px rgba(0,0,0,.6),0 0 26px rgba(255,80,60,.3);outline:none}
  .gamecard:hover::before,.gamecard:focus-visible::before{transform:translateX(120%)}
  .gamecard .gicon{font-size:40px;line-height:1;flex:0 0 auto;filter:drop-shadow(0 0 12px rgba(255,80,60,.5))}
  .gamecard .gtxt{flex:1;min-width:0}
  .gamecard .gk{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:#ff7a5c;font-weight:700}
  .gamecard .gt{font-family:var(--disp);font-size:clamp(20px,4vw,26px);font-weight:900;color:#ffd9b3;letter-spacing:.01em;margin:3px 0 2px}
  .gamecard .gs{font-size:11px;color:var(--muted);letter-spacing:.04em}
  .gamecard .ggo{flex:0 0 auto;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#ff7a5c;font-weight:700}
  .gamecard:hover .ggo .arrow,.gamecard:focus-visible .ggo .arrow{transform:translateX(4px)}
  .gamecard .ggo .arrow{display:inline-block;transition:transform .2s}
  @media(max-width:480px){.gamecard .gs{display:none}.gamecard .ggo span:not(.arrow){display:none}}

  footer{
    text-align:center;margin-top:36px;font-size:11px;letter-spacing:.14em;
    color:var(--muted);text-transform:uppercase;animation:fade 1s .8s both;
  }
  footer .sep{color:var(--amber-dim);margin:0 8px}

  @media (max-width:420px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
    .tile .name{min-height:0}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    const dots = [0,1,2].map(i => `<span class="st${i < s ? " on" : ""}">&#9733;</span>`).join("");
    const cap = best > 0 ? `Best ${best}` : "New";
    return `<div class="stars" title="${best>0?`Best score: ${best} correct`:"Not attempted yet"}">${dots}<span class="cap">${cap}</span></div>`;
  }

  const grid = document.getElementById("grid");
  const filter = document.getElementById("filter");
  const clearBtn = document.getElementById("clearBtn");
  const liveCount = document.getElementById("liveCount");
  const footCount = document.getElementById("footCount");

  function tileHTML(c, i){
    return `<a class="tile" href="${LINK(c.n)}" style="animation-delay:${(0.5 + i*0.035).toFixed(3)}s">
      <div class="ata">ATA Chapter</div>
      <div class="num">${c.n}</div>
      <div class="name">${c.name}</div>
      ${starsHTML(c.n)}
      <div class="go"><span>Start Quiz</span><span class="arrow">&rarr;</span></div>
    </a>`;
  }

  function render(list){
    grid.innerHTML = list.length
      ? list.map(tileHTML).join("")
      : `<div class="noresult">No chapters match that filter.</div>`;
  }

  function applyFilter(){
    const q = filter.value.trim().toLowerCase();
    clearBtn.style.display = q ? "block" : "none";
    const list = q ? CHAPTERS.filter(c => (c.n + " " + c.name).toLowerCase().includes(q)) : CHAPTERS;
    render(list);
    const n = list.length;
    liveCount.textContent = `${n} chapter${n===1?"":"s"} ${q ? "match" : "online"}`;
    footCount.textContent = n;
  }

  filter.addEventListener("input", applyFilter);
  clearBtn.addEventListener("click", () => { filter.value=""; applyFilter(); filter.focus(); });

  render(CHAPTERS);
  footCount.textContent = CHAPTERS.length;
  liveCount.textContent = `${CHAPTERS.length} chapters online`;

  // Refresh stars when returning to this page (e.g. back button after a quiz),
  // including when the page is restored from the browser's back-forward cache.
  window.addEventListener("pageshow", () => { applyFilter(); });
</script>
</body>
</html>
