<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>B737NG Circuit Breaker Finder</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    font-family: Arial, sans-serif;
    background: #000; color: orange;
  }
  h1 { margin: 0 0 12px; text-align: center; font-size: 1.5rem; letter-spacing: 2px; }
  .subhead { text-align: center; color: #ffb84d; font-style: italic; margin-bottom: 18px; font-size: 0.95rem; }

  .controls {
    display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: center; align-items: center;
    margin-bottom: 18px;
  }
  #searchBox {
    flex: 1 1 360px; max-width: 600px;
    padding: 12px; font-size: 1rem;
    background: #111; color: orange;
    border: 1px solid orange; border-radius: 8px;
  }
  #searchBox::placeholder { color: #ffb84d; opacity: 0.7; }
  #panelFilter, #clearBtn {
    padding: 10px 14px; font-size: 0.95rem;
    background: #111; color: orange;
    border: 1px solid orange; border-radius: 8px;
    cursor: pointer;
  }
  #clearBtn:hover, #panelFilter:hover { background: #1a1a1a; }

  #countLabel {
    color: #ffd27f; text-align: center;
    margin-bottom: 12px; font-size: 0.9rem;
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
    gap: 18px;
  }
  @media (max-width: 1100px) {
    .layout { grid-template-columns: 1fr; }
  }

  .panel-section {
    border: 1px solid orange;
    border-radius: 10px;
    background: #0b0b0b;
    padding: 14px;
  }
  .panel-section h2 {
    margin: 0 0 12px;
    font-size: 1.1rem;
    letter-spacing: 1.5px;
    color: orange;
    display: flex; justify-content: space-between; align-items: center;
  }
  .enlarge-btn {
    font-size: 0.85rem;
    background: #1a1100; color: orange;
    border: 1px solid orange; border-radius: 5px;
    padding: 5px 10px; cursor: pointer;
    font-weight: normal; letter-spacing: 0;
  }
  .enlarge-btn:hover { background: #2a1a00; }

  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  thead th {
    text-align: left; padding: 8px 6px;
    background: #1a1100; color: orange;
    border-bottom: 1px solid orange;
    position: sticky; top: 0; z-index: 1;
  }
  tbody td {
    padding: 6px;
    border-bottom: 1px solid rgba(255,165,0,0.18);
    color: #ffe4b3;
    vertical-align: top;
  }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #1a1100; }
  tbody tr.active { background: #2a1a00; }

  .panel-tag {
    display: inline-block;
    padding: 2px 6px;
    background: #2a1a00;
    border: 1px solid orange;
    border-radius: 4px;
    color: orange;
    font-weight: bold;
    font-size: 0.78rem;
    white-space: nowrap;
  }
  .pos-tag {
    display: inline-block;
    padding: 2px 6px;
    background: #0b0b0b;
    border: 1px solid #ffb84d;
    border-radius: 4px;
    color: #ffd27f;
    font-weight: bold;
    font-size: 0.78rem;
    white-space: nowrap;
  }
  .cb-num {
    color: #ffd27f;
    font-family: 'Courier New', monospace;
    font-size: 0.82rem;
  }
  .cb-name { color: #ffe4b3; }
  .dal-tag {
    color: #ffb84d;
    font-size: 0.72rem;
    font-style: italic;
  }
  .no-results, .no-diagram {
    text-align: center; padding: 30px;
    color: #ffb84d;
  }
  .no-diagram {
    font-style: italic;
    border: 1px dashed rgba(255,165,0,0.4);
    border-radius: 8px;
  }

  .panel-display { cursor: zoom-in; }
  .panel-display svg { width: 100%; height: auto; display: block; }

  /* HIGHLIGHT: red ring with pulse animation */
  .panel-display svg circle.highlight,
  #modal svg circle.highlight {
    fill: #ff2020 !important;
    stroke: #ffff00;
    stroke-width: 3;
    animation: cbpulse 1.2s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  @keyframes cbpulse {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #ff2020); }
    50%      { transform: scale(1.6); filter: drop-shadow(0 0 12px #ff5050); }
  }

  /* Callout label that appears next to highlighted CB */
  .highlight-callout {
    fill: #fff;
    font-size: 14px;
    font-weight: bold;
    font-family: Arial, sans-serif;
    text-anchor: middle;
    paint-order: stroke;
    stroke: #000;
    stroke-width: 4px;
    stroke-linejoin: round;
  }
  .highlight-callout-bg {
    fill: rgba(255, 32, 32, 0.95);
    stroke: #ffff00;
    stroke-width: 1.5;
    rx: 4;
  }

  .table-wrap {
    max-height: 75vh;
    overflow-y: auto;
    border: 1px solid rgba(255,165,0,0.35);
    border-radius: 6px;
  }

  .tabs {
    display: flex; flex-wrap: wrap; gap: 4px;
    margin-bottom: 10px;
  }
  .tab {
    padding: 6px 10px;
    background: #111; color: orange;
    border: 1px solid orange; border-radius: 5px;
    cursor: pointer; font-size: 0.85rem;
    font-weight: bold;
  }
  .tab.active { background: #2a1a00; }
  .tab:hover { background: #1a1100; }

  /* Modal for enlarged view */
  #modal {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 1000;
    flex-direction: column;
    padding: 16px;
  }
  #modal.open { display: flex; }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    color: orange;
    margin-bottom: 10px;
    flex-wrap: wrap; gap: 10px;
  }
  .modal-title {
    font-size: 1.2rem; font-weight: bold; letter-spacing: 1.5px;
  }
  .modal-controls { display: flex; gap: 6px; flex-wrap: wrap; }
  .modal-btn {
    padding: 6px 12px;
    background: #1a1100; color: orange;
    border: 1px solid orange; border-radius: 5px;
    cursor: pointer; font-size: 0.85rem; font-weight: bold;
  }
  .modal-btn:hover { background: #2a1a00; }
  #modalContent {
    flex: 1;
    overflow: auto;
    border: 1px solid orange; border-radius: 8px;
    background: #0b0b0b;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 10px;
  }
  #modalContent svg {
    display: block;
    width: var(--zoom-w, 100%);
    max-width: none;
    height: auto;
    transition: width 0.15s ease;
  }
  .modal-hint {
    color: #ffb84d;
    font-size: 0.8rem;
    font-style: italic;
    text-align: center;
    margin-top: 6px;
  }
</style>
</head>
<body>
  <h1>B737NG CIRCUIT BREAKER FINDER</h1>
  <div class="subhead">Search by name, number, panel, or location &mdash; Boeing 737-600/700/800/900</div>

  <div class="controls">
    <input id="searchBox" type="text" placeholder="Search e.g. 'voice rcdr', 'C00107', 'P18-2 D7'..."/>
    <select id="panelFilter">
      <option value="">All panels</option>
    </select>
    <button id="clearBtn" type="button">Clear</button>
  </div>
  <div id="countLabel">Loading...</div>

  <div class="layout">
    <div class="panel-section">
      <h2>Search Results</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Panel</th>
              <th>Position</th>
              <th>CB Number</th>
              <th>Name</th>
            </tr>
          </thead>
          <tbody id="resultsBody"></tbody>
        </table>
      </div>
    </div>

    <div class="panel-section">
      <h2>
        <span>Panel Diagram</span>
        <button class="enlarge-btn" id="enlargeBtn" type="button">&#x26F6; Enlarge</button>
      </h2>
      <div class="tabs" id="panelTabs"></div>
      <div class="panel-display" id="panelDisplay" title="Click to enlarge"></div>
    </div>
  </div>

  <!-- Enlarged view modal -->
  <div id="modal" role="dialog" aria-label="Enlarged panel view">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Panel</div>
      <div class="modal-controls">
        <button class="modal-btn" id="zoomOutBtn" type="button">&minus; Zoom out</button>
        <button class="modal-btn" id="zoomFitBtn" type="button">Fit</button>
        <button class="modal-btn" id="zoomInBtn" type="button">+ Zoom in</button>
        <button class="modal-btn" id="closeModalBtn" type="button">&times; Close</button>
      </div>
    </div>
    <div id="modalContent"></div>
    <div class="modal-hint">Tip: pinch / scroll inside the panel to pan. Click a result row to highlight the CB.</div>
  </div>

const PANEL_ORDER = ['P6-1','P6-2','P6-3','P6-4','P6-11','P6-12','P18-1','P18-2','P18-3','M01720'];

// Geometry of generated SVGs (used to locate the dot for a given position)
const GEOM = { COL_X0: 90, COL_DX: 50, ROW_Y0: 105, ROW_DY: 93 };

// Populate panel filter dropdown
const allPanels = [...new Set(CB_DATA.map(r => r.panel))].sort();
const sel = document.getElementById('panelFilter');
for (const p of allPanels) {
  const o = document.createElement('option'); o.value = p; o.textContent = p;
  sel.appendChild(o);
}

// Build panel switcher tabs (only panels we have diagrams for)
const tabsDiv = document.getElementById('panelTabs');
PANEL_ORDER.forEach((p, i) => {
  const t = document.createElement('button');
  t.className = 'tab' + (i === 0 ? ' active' : '');
  t.textContent = p; t.dataset.panel = p;
  t.onclick = () => showPanel(p);
  tabsDiv.appendChild(t);
});

const display = document.getElementById('panelDisplay');
let currentPanel = 'P6-1';
let currentHighlightedPos = null;
let currentHighlightedName = '';

function showPanel(panelId) {
  currentPanel = panelId;
  document.querySelectorAll('#panelTabs .tab').forEach(t => {
    t.classList.toggle('active', t.dataset.panel === panelId);
  });
  if (PANEL_SVGS[panelId]) {
    display.innerHTML = PANEL_SVGS[panelId];
  } else {
    display.innerHTML = '<div class="no-diagram">No diagram available for ' + panelId + ' yet.<br/>The CB is still searchable in the table.</div>';
  }
  // Reapply current highlight if it belongs to this panel
  if (currentHighlightedPos) applyHighlight(display, currentHighlightedPos, currentHighlightedName);
}
showPanel('P6-1');

function applyHighlight(container, pos, name) {
  // Clear previous
  container.querySelectorAll('circle.highlight, .callout-group').forEach(el => {
    if (el.classList.contains('highlight')) el.classList.remove('highlight');
    else el.remove();
  });
  if (!pos || pos === '------') return;
  const m = pos.match(/^([A-Z])(\d+)$/);
  if (!m) return;
  const rowLetter = m[1], colNum = parseInt(m[2], 10);
  const cx = GEOM.COL_X0 + (colNum - 1) * GEOM.COL_DX;
  const cy = GEOM.ROW_Y0 + (rowLetter.charCodeAt(0) - 65) * GEOM.ROW_DY;
  const svg = container.querySelector('svg');
  if (!svg) return;
  // Find nearest circle within ~30px
  const circles = svg.querySelectorAll('circle');
  let best = null, bestDist = Infinity;
  for (const c of circles) {
    const dx = parseFloat(c.getAttribute('cx')) - cx;
    const dy = parseFloat(c.getAttribute('cy')) - cy;
    const d = dx*dx + dy*dy;
    if (d < bestDist) { bestDist = d; best = c; }
  }
  if (!best || bestDist > 900) return;
  best.classList.add('highlight');

  // Add a callout label above the highlighted CB
  const bestCx = parseFloat(best.getAttribute('cx'));
  const bestCy = parseFloat(best.getAttribute('cy'));
  const ns = 'http://www.w3.org/2000/svg';
  const g = document.createElementNS(ns, 'g');
  g.setAttribute('class', 'callout-group');
  // Place callout below the CB so it doesn't block the labels above (which describe other CBs)
  const labelY = bestCy + 28;
  const labelText = (pos + '  ' + (name || '')).substring(0, 40);
  // Create the text first so we can measure its actual rendered width
  const txt = document.createElementNS(ns, 'text');
  txt.setAttribute('x', bestCx);
  txt.setAttribute('y', labelY + 1);
  txt.setAttribute('class', 'highlight-callout');
  txt.textContent = labelText;
  // Add text to SVG temporarily to measure it
  svg.appendChild(txt);
  let textW = 0;
  try { textW = txt.getBBox().width; } catch (e) { textW = labelText.length * 9; }
  svg.removeChild(txt);
  // Background rect — measured text width plus horizontal padding
  const padX = 12;
  const w = Math.max(60, textW + padX * 2);
  // Clamp horizontal position so the callout stays inside the SVG viewBox
  const vb = (svg.getAttribute('viewBox') || '0 0 1000 600').split(/\s+/).map(parseFloat);
  const vbX = vb[0] || 0;
  const vbW = vb[2] || 1000;
  const margin = 4;
  let rectX = bestCx - w/2;
  if (rectX < vbX + margin) rectX = vbX + margin;
  if (rectX + w > vbX + vbW - margin) rectX = vbX + vbW - margin - w;
  const textCx = rectX + w/2;
  txt.setAttribute('x', textCx);
  const rect = document.createElementNS(ns, 'rect');
  rect.setAttribute('x', rectX);
  rect.setAttribute('y', labelY - 12);
  rect.setAttribute('width', w);
  rect.setAttribute('height', 18);
  rect.setAttribute('class', 'highlight-callout-bg');
  rect.setAttribute('rx', 4);
  g.appendChild(rect);
  g.appendChild(txt);
  svg.appendChild(g);

  // Scroll the highlighted dot into view if in modal
  if (container.id === 'modalContent') {
    setTimeout(() => {
      try {
        const r = best.getBoundingClientRect();
        const cr = container.getBoundingClientRect();
        if (r.top < cr.top + 50 || r.bottom > cr.bottom - 50 ||
            r.left < cr.left + 50 || r.right > cr.right - 50) {
          best.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' });
        }
      } catch (e) {}
    }, 50);
  }
}

function highlightPosition(panelId, pos, name) {
  currentHighlightedPos = pos;
  currentHighlightedName = name || '';
  if (panelId !== currentPanel) showPanel(panelId);
  else applyHighlight(display, pos, name);
  // If modal is open, also update it
  if (document.getElementById('modal').classList.contains('open') && modalPanel === panelId) {
    applyHighlight(document.getElementById('modalContent'), pos, name);
  }
}

function renderResults(rows, autoHighlightFirst) {
  const body = document.getElementById('resultsBody');
  body.innerHTML = '';
  document.getElementById('countLabel').textContent =
    rows.length + ' breaker' + (rows.length === 1 ? '' : 's') + ' shown' +
    (rows.length < CB_DATA.length ? ' (filtered from ' + CB_DATA.length + ')' : '');

  if (!rows.length) {
    body.innerHTML = '<tr><td colspan="4" class="no-results">No matches. Try a different term.</td></tr>';
    return;
  }
  const frag = document.createDocumentFragment();
  for (const r of rows) {
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td><span class="panel-tag">' + r.panel + '</span></td>' +
      '<td><span class="pos-tag">' + r.pos + '</span></td>' +
      '<td><span class="cb-num">' + r.num + '</span></td>' +
      '<td><div class="cb-name">' + escapeHtml(r.name) + '</div>' +
      '<div class="dal-tag">' + escapeHtml(r.dal) + ' • ATA ' + r.ata + '</div></td>';
    tr.onclick = () => {
      document.querySelectorAll('#resultsBody tr.active').forEach(x => x.classList.remove('active'));
      tr.classList.add('active');
      highlightPosition(r.panel, r.pos, r.num + ' ' + r.name);
    };
    frag.appendChild(tr);
  }
  body.appendChild(frag);

  if (autoHighlightFirst && rows.length > 0) {
    const r = rows[0];
    body.firstChild.classList.add('active');
    highlightPosition(r.panel, r.pos, r.num + ' ' + r.name);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function filter() {
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const panelOnly = document.getElementById('panelFilter').value;
  let rows = CB_DATA;
  if (panelOnly) rows = rows.filter(r => r.panel === panelOnly);
  if (q) {
    const terms = q.split(/\s+/).filter(Boolean);
    rows = rows.filter(r => {
      const hay = (r.num + ' ' + r.name + ' ' + r.panel + ' ' + r.pos + ' ' + r.dal + ' ata' + r.ata).toLowerCase();
      return terms.every(t => hay.includes(t));
    });
  }
  rows = rows.slice().sort((a, b) => {
    if (a.panel !== b.panel) return a.panel.localeCompare(b.panel);
    const ar = a.pos.charAt(0), br = b.pos.charAt(0);
    if (ar !== br) return ar.localeCompare(br);
    return parseInt(a.pos.slice(1), 10) - parseInt(b.pos.slice(1), 10);
  });
  renderResults(rows, q.length > 0);
}

document.getElementById('searchBox').addEventListener('input', filter);
document.getElementById('panelFilter').addEventListener('change', filter);
document.getElementById('clearBtn').addEventListener('click', () => {
  document.getElementById('searchBox').value = '';
  document.getElementById('panelFilter').value = '';
  filter();
});

// ===== Modal / enlarge =====
const modal = document.getElementById('modal');
const modalContent = document.getElementById('modalContent');
const modalTitle = document.getElementById('modalTitle');
let modalPanel = null;
let modalZoom = 1.0;  // 1.0 = fit-to-width; >1 = zoomed in

function openModal(panelId) {
  if (!PANEL_SVGS[panelId]) return;
  modalPanel = panelId;
  modalTitle.textContent = panelId + ' — enlarged view';
  modalContent.innerHTML = PANEL_SVGS[panelId];
  modalZoom = 1.0;
  applyModalZoom();
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
  // Re-apply current highlight in modal
  if (currentHighlightedPos && currentPanel === panelId) {
    applyHighlight(modalContent, currentHighlightedPos, currentHighlightedName);
  }
}
function closeModal() {
  modal.classList.remove('open');
  document.body.style.overflow = '';
}
function applyModalZoom() {
  // Width-based zoom: 100% = fit-to-container, then increase as percentage
  const pct = Math.round(modalZoom * 100);
  modalContent.style.setProperty('--zoom-w', pct + '%');
}

document.getElementById('enlargeBtn').addEventListener('click', () => openModal(currentPanel));
display.addEventListener('click', () => openModal(currentPanel));
document.getElementById('closeModalBtn').addEventListener('click', closeModal);
document.getElementById('zoomInBtn').addEventListener('click', () => {
  modalZoom = Math.min(modalZoom + 0.25, 4);
  applyModalZoom();
});
document.getElementById('zoomOutBtn').addEventListener('click', () => {
  modalZoom = Math.max(modalZoom - 0.25, 0.5);
  applyModalZoom();
});
document.getElementById('zoomFitBtn').addEventListener('click', () => {
  modalZoom = 1.0;
  applyModalZoom();
});
// Close on Escape, click outside diagram, or wheel zoom over diagram
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
});
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
modalContent.addEventListener('wheel', e => {
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.1 : -0.1;
    modalZoom = Math.max(0.5, Math.min(4, modalZoom + delta));
    applyModalZoom();
  }
}, { passive: false });

filter();
</script>
</body>
