<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEF Item Reference</title>
<style>
:root{ --amber:#fe7002; --amber-dim:#a84a02; --amber-soft:#ffb066; --bg:#000; --panel:#0a0a0a; --line:#fe7002; }
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--amber);font-family:Arial,Helvetica,sans-serif;}
body{position:relative;min-height:100vh;}
/* CRT scanline overlay */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 2px,rgba(0,0,0,0.18) 3px,rgba(0,0,0,0) 4px);}
.wrap{padding:14px 16px 60px;}
header{display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:space-between;
  border:2px solid var(--line);background:linear-gradient(90deg,#120800,#000);padding:12px 16px;margin-bottom:14px;
  box-shadow:0 0 14px rgba(254,112,2,.25);}
h1{font-size:20px;margin:0;letter-spacing:2px;text-shadow:0 0 8px rgba(254,112,2,.6);}
h1 .sub{display:block;font-size:11px;color:var(--amber-dim);letter-spacing:3px;margin-top:3px;}
.count{font-size:13px;color:var(--amber-soft);white-space:nowrap;}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;}
#search{flex:1;min-width:240px;background:#000;border:2px solid var(--line);color:var(--amber);
  font-family:inherit;font-size:15px;padding:10px 14px;outline:none;letter-spacing:1px;
  box-shadow:inset 0 0 10px rgba(254,112,2,.15);}
#search::placeholder{color:var(--amber-dim);}
#search:focus{box-shadow:0 0 10px rgba(254,112,2,.5),inset 0 0 10px rgba(254,112,2,.2);}
.btn{background:#000;border:2px solid var(--line);color:var(--amber);font-family:inherit;font-size:12px;
  font-weight:bold;letter-spacing:1px;padding:9px 14px;cursor:pointer;text-transform:uppercase;transition:.12s;}
.btn:hover{background:var(--amber);color:#000;box-shadow:0 0 12px rgba(254,112,2,.6);}
table{width:100%;border-collapse:collapse;}
thead th{position:sticky;top:0;z-index:5;background:#160a00;color:var(--amber);border:2px solid var(--line);
  padding:10px 12px;text-align:left;font-size:13px;letter-spacing:1px;text-transform:uppercase;}
tbody td{border:1px solid var(--amber-dim);padding:10px 12px;vertical-align:top;font-size:13px;line-height:1.5;}
tbody tr:nth-child(even){background:#070300;}
tbody tr:hover{background:#1c0e00;}
.code{font-family:"Courier New",monospace;font-weight:bold;font-size:14px;color:var(--amber-soft);white-space:nowrap;
  text-shadow:0 0 6px rgba(254,112,2,.4);}
.desc{font-weight:bold;}
.col-code{width:110px;}
.col-desc{width:26%;}
.notes{white-space:pre-wrap;color:#ffcc99;}
.notes.empty,.muted{color:#5a3000;font-style:italic;}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.cellwrap{cursor:pointer;}
.cellwrap.open .clamp{-webkit-line-clamp:unset;}
.tag{display:inline-block;font-size:10px;color:var(--amber-dim);border:1px solid var(--amber-dim);
  padding:1px 5px;margin-top:5px;letter-spacing:1px;}
mark{background:var(--amber);color:#000;padding:0 1px;}
.noresults{text-align:center;padding:40px;color:var(--amber-dim);letter-spacing:2px;}
footer{position:fixed;bottom:0;left:0;right:0;background:#0a0500;border-top:2px solid var(--line);
  font-size:11px;color:var(--amber-dim);padding:6px 16px;letter-spacing:1px;z-index:50;}
@media(max-width:760px){ .col-desc{width:auto;} thead{display:none;}
  tbody td{display:block;border:none;border-bottom:1px solid var(--amber-dim);}
  tbody tr{display:block;border:2px solid var(--line);margin-bottom:12px;}
  td::before{content:attr(data-label);display:block;font-size:10px;color:var(--amber-dim);
    letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>NEF ITEM REFERENCE<span class="sub">NON-ESSENTIAL FURNISHINGS &middot; ACTIVE LIST</span></h1>
    <div class="count" id="count"></div>
  </header>
  <div class="controls">
    <input id="search" type="text" placeholder="SEARCH ITEM #, DESCRIPTION, NOTES OR REMARKS..." autocomplete="off">
    <button class="btn" id="expandAll">Expand All</button>
    <button class="btn" id="collapseAll">Collapse All</button>
    <button class="btn" id="clearBtn">Clear</button>
  </div>
  <table>
    <thead><tr>
      <th class="col-code">Deferral Item #</th>
      <th class="col-desc">NEF Item Description</th>
      <th>NEF Item Notes</th>
      <th>Deferral Remarks</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="noresults" id="noresults" style="display:none;">NO MATCHING ITEMS</div>
</div>
<footer>Delta Air Lines Confidential Information &middot; Offline reference &middot; <span id="fcount"></span> items loaded</footer>

<script>
const DATA = [{"n":"08-20-01","d":"Aircraft Leveling Indication System","o":"Aircraft leveling indication system includes, but is not limited to, lateral and longitudinal inclinometers and a plumb bob leveling scale, plump bob, plumb bob string, grid plate and grid plate. All parts of the aircraft leveling indication system must be working to jack the aircraft and required for alternate fueling procedures.","r":"All parts of the aircraft leveling indication system must be secured. A319, A320, A321,A330, 350 aircraft not covered by the NEF, they are covered in the MEL."},{"n":"11-10-01","d":"Interior Trim or Light Plates Faded or Worn","o":"Planning should be advised and set up for repair on next convenient over night maintenance.","r":"Can not apply this NEF to trim or light plates for Emergency markings. Signage or Lettering must be legible."},{"n":"11-10-02","d":"Cold Soak Fuel Frost Perimeter Marking Degraded -B737 Limited Effectivity","o":"Applicable to all 737-700 and 737-900 aircraft. Also applicable to the 737-800 post AA 1120-01158 aircraft. This item does not deviate from FAA exemption no. 14236 to 14 CFR 121.629(b). This item only covers the degrading of the cold soak fuel frost area perimeter line and the perimeter must still be clearly visible from the cabin so the exemption can still be used.","r":"Ensure that the remaining lines/degraded lines still outline the perimeter of the affected cold-soak fuel frost area. You must be able to clearly see the perimeter of the cold soak fuel frost area from the cabin to use this item."},{"n":"11-20-06","d":"Non-Required Exterior Placards - Degraded but Legible","o":"Discrepant FAA/AD required placards/markings MUST be addressed per TOPP 40-40-05 in conjunction with technical instructions of EA 10-495655-14.","r":"Before deferral, you MUST: \\r\\nContact the MCC for approval\\r\\nVerify the placard/marking is NOT FAA/AD required. \\r\\n(Ref TOPP 40-40-05 under Special MCO Procedures, FAA Required Placards/Markings for step-by-step instructions to determine if the placard/marking is required.)\\r\\n\\r\\nIf you identify an error was made and the plane has been dispatched, immediately contact the MCC and your CASS monitor to report the error. (Find your CASS monitor: TechOps Home Page, under SAFETY, SECURITY & COMPLIANCE, Compliance Links on the left, CAS Monitor List bottom right of the page.) You may also want to file an ASAP report under SAFETY, SECURITY & COMPLIANCE, TechOps Maintenance ASAP)"},{"n":"11-20-07","d":"Non-Required Exterior Placards - Missing or Illegible","o":"Discrepant FAA/AD required placards/markings MUST be addressed per TOPP 40-40-05 in conjunction with technical instructions of EA 10-495655-14. This NEF has a allowable time limit of 365 days.","r":"Before deferral, you MUST: \\r\\nContact the MCC for approval\\r\\nVerify the placard/marking is NOT FAA/AD required. \\r\\n(Ref TOPP 40-40-05 under Special MCO Procedures, FAA Required Placards/Markings for step-by-step instructions to determine if the placard/marking is required.)\\r\\n\\r\\nIf you identify an error was made and the plane has been dispatched, immediately contact the MCC and your CASS monitor to report the error. (Find your CASS monitor: TechOps Home Page, under SAFETY, SECURITY & COMPLIANCE, Compliance Links on the left, CAS Monitor List bottom right of the page.) You may also want to file an ASAP report under SAFETY, SECURITY & COMPLIANCE, TechOps Maintenance ASAP)"},{"n":"11-20-08","d":"Component Data Plates","o":"This relief applies to Component Data Plates (fixed placards containing part number, serial number, etc.) which are on INSTALLED, ON-WING COMPONENTS only. Data Plates may be missing or degraded.\\n\\nThis relief DOES NOT APPLY TO DATA TAGS FOR: Aircraft (complete airframe ID), Engine, Propeller, Propeller Blade, or Propeller Hub, or any Life-Limited Part.","r":"Ensure no sharp edges or protruding raised sections. If data plate is not secure, manually re-form the plate and secure the plate using aluminum Speed Tape. If unable to secure the data plate (AOG situations only), the plate may be removed and stowed in the aircraft AOG Pouch.\\n\\nRecord all legible data (Part Number, Serial Number, etc.) in the applicable Logpage to facilitate restoration/replacement of the data plate.\\n\\nThis relief is for IN- SERVICE, INSTALLED COMPONENTS ONLY. Do not remove or defer part identification on spare parts."},{"n":"11-30-02","d":"Cabin Inop Placards Need Replenishing","o":"","r":""},{"n":"11-30-10","d":"Non-Required Interior Placards - Degraded but Legible","o":"Discrepant FAA/AD required placards/markings MUST be addressed per TOPP 40-40-05 in conjunction with technical instructions of EA 10-495655-14.","r":"Before deferral, you MUST: \\r\\nContact the MCC for approval\\r\\nVerify the placard/marking is NOT FAA/AD required. \\r\\n(Ref TOPP 40-40-05 under Special MCO Procedures, FAA Required Placards/Markings for step-by-step instructions to determine if the placard/marking is required.)\\r\\n\\r\\nIf you identify an error was made and the plane has been dispatched, immediately contact the MCC and your CASS monitor to report the error. (Find your CASS monitor: TechOps Home Page, under SAFETY, SECURITY & COMPLIANCE, Compliance Links on the left, CAS Monitor List bottom right of the page.) You may also want to file an ASAP report under SAFETY, SECURITY & COMPLIANCE, TechOps Maintenance ASAP)"},{"n":"11-30-11","d":"Non-Required Interior Placards - Missing or Illegible","o":"Discrepant FAA/AD required placards/markings MUST be addressed per TOPP 40-40-05 in conjunction with technical instructions of EA 10-495655-14.","r":"Before deferral, you MUST: \\r\\nContact the MCC for approval\\r\\nVerify the placard/marking is NOT FAA/AD required. \\r\\n(Ref TOPP 40-40-05 under Special MCO Procedures, FAA Required Placards/Markings for step-by-step instructions to determine if the placard/marking is required.)\\r\\n\\r\\nIf you identify an error was made and the plane has been dispatched, immediately contact the MCC and your CASS monitor to report the error. (Find your CASS monitor: TechOps Home Page, under SAFETY, SECURITY & COMPLIANCE, Compliance Links on the left, CAS Monitor List bottom right of the page.) You may also want to file an ASAP report under SAFETY, SECURITY & COMPLIANCE, TechOps Maintenance ASAP)"},{"n":"11-30-12","d":"Seat Number Placards - Degraded or Missing","o":"","r":""},{"n":"21-20-01","d":"Flight Deck Air Vent (Non- Gasper) Damaged/Inoperative","o":"For flight deck gasper air vent damaged/inoperative reference NEF 21-24-04.","r":""},{"n":"21-21-01","d":"Cabin Vent Grill Damaged","o":"This NEF item may not be used for damaged A330 Ceiling Vent Panels that cannot be secured by normal means. Reference ERA 623957-14TR for authorization to secure vents.","r":"Damage must not be to an extent that it leaves an opening that items could fall into or that would be a security concern."},{"n":"21-22-01","d":"Cargo Compartment Air Outlet Trim Piece Missing","o":"","r":"Must not present hazard."},{"n":"21-22-02","d":"Cargo Compartment Air Outlet Vent Grill Damaged","o":"","r":"Must not present hazard."},{"n":"21-24-01","d":"Crew Rest Gasper Air Vent Damaged / Inoperative","o":"Bugeye","r":"Check if item is contained in the MEL; if yes then complete the MEL deferral process, otherwise defer using the NEF item. At this time reference MEL 25-25-07B for B767-300."},{"n":"21-24-02","d":"Crew Rest Ventilation Grill Damaged","o":"","r":"Damage must not be to an extent that it leaves an opening that items could fall into or that would be a security concern."},{"n":"21-24-03","d":"Flight Attendant Seat Gasper Air Vent Damaged / Inoperative","o":"","r":""},{"n":"21-24-04","d":"Flight Deck Gasper Air Vent Damaged/Inoperative","o":"For flight deck air vent (non- gasper) damaged/inoperative reference NEF 21-20-01.","r":""},{"n":"21-24-05","d":"Passenger Gasper Air Vent Damaged / Inoperative","o":"Bugeye","r":""},{"n":"21-26-01","d":"Galley Gasper Vent Damaged / Inoperative","o":"","r":""},{"n":"21-26-02","d":"Galley Ventilation Grill Damaged","o":"","r":"Damage must not be to an extent that it leaves an opening that items could fall into or that would be a security concern."},{"n":"21-26-03","d":"Lavatory Gasper Vent Damaged / Inoperative","o":"","r":""},{"n":"21-26-04","d":"Lavatory Ventilation Grill Cover Damaged","o":"","r":"Damage must not be to an extent that it leaves an opening that items could fall into or that would be a security concern."},{"n":"21-26-05","d":"Video Control Cabinet Ducting / Grills Damaged","o":"","r":"Damage must not be to an extent that it leaves an opening that items could fall into or that would be a security concern."},{"n":"21-28-01","d":"Ground Air Connection Flange Damaged","o":"CONNECTION MAY BE USED IF GROUND AIR HOSE WILL CONNECT","r":"CONNECTION MAY BE USED IF GROUND AIR HOSE WILL CONNECT"},{"n":"21-30-01","d":"Negative Pressure Relief Door Hold-Open Tool","o":"B757 Only - Negative Pressure Relief Valve Hold-Open Tool, normally stowed in the flight deck gear pouch, and only used for Pressure Relief Door lock-out during maintenance activities or MEL application, is occasionally found missing.","r":"MAY BE DEFERRED IF THE TOOL IS NOT REQUIRED FOR ANY CURRENT MEL ITEMS OR MAINTENANCE TASKS."},{"n":"21-41-01","d":"Crew Rest Temperature Control Indication Inop","o":"","r":"Crew rest temperature control works normally. For B747 see the MEL."},{"n":"21-50-01","d":"Ram Air Door Seal Deteriorated","o":"Seal deteriorated but serviceable on ram air inlet door.","r":""},{"n":"21-59-01","d":"Vapor Cycle Refrigeration Unit (VCRU) Reduced Performance / Inoperative (A350)","o":"This item is for A350 aircraft only.","r":"Not for use for the VCRU Overheat Protection. Utilize A350 MEL 21-59-01A for VCRU Overheat Protection.\\n\\n(M)\\nOnly 1 VCRU may be deferred. If a VCRU is inoperative, refer to AMM Task A350-A-21-59-55-00001-560A-A for deactivation procedures."},{"n":"21-59-02","d":"SCS (Supplemental Cooling) Reduced Performance (A350 ONLY)","o":"","r":"Galley Cooling must be sufficient in all galleys (air temperature at or below 41 degrees F) with the exception of individual position outages due to ACU inop."},{"n":"21-59-03","d":"Inoperative Supplemental Galley Cooling - A350 ONLY - Dry Ice Required All Locations","o":"Dry ice provisioning required at all cooled galley cart positions. Contact MCC to apply SPL-item 21-59-00.","r":"Confirm loss of supplemental system cooling capabilities in all galley positions IAW A350 AMM 21-59-XX. To prevent provisioned dry ice dissipation, pull and collar associated circuit breakers for all ACUs on galley breaker panels at galleys locations 402 / 403 / 404 / 409 / 410 referencing applicable CMM for the galleys. Placard subject ACUs at all collared locations."},{"n":"21-59-04","d":"Galley Air Cooling Unit Reduced Performance/Inoperative - A350 ONLY - Dry Ice Required Specific Locations","o":"Dry ice provisioning required at any cooled galley cart positions with an inoperative ACU. Contact MCC to apply SPL-item 21-59-00.","r":"Observation of a smoke, wire damage, or overheat event requires additional inspection by maintenance prior to placarding. If the ACU (air cooling unit) is inoperative, pull and secure associated circuit breaker for ACU on galley breaker panel referencing applicable CMM for the galley. Placard subject ACU \"inoperative\"."},{"n":"21-61-01","d":"Cabin Temp Intake Grill or Retainer Damaged/Missing","o":"","r":""},{"n":"21-70-01","d":"Teledyne Aircraft Cabin Environment Sensor (ACES) INOP","o":"Teledyne Aircraft Cabin Environment Sensor (ACES) System may be inoperative. The ACES System consists of ACES Onboard Devices (AOD) and ACES Sensor Packs (ASP). All or some components may be inoperative.","r":""},{"n":"21-70-02","d":"Teledyne Aircraft Cabin Environment Sensor (ACES) MISSING","o":"Teledyne Aircraft Cabin Environment Sensor (ACES) System may be missing. The ACES System consists of ACES Onboard Devices (AOD) and ACES Sensor Packs (ASP). All or some components may be missing.","r":"All associated wiring must be capped and stowed per applicable SWPM/ESPM/ESPP procedures. Must not pose hazards to personnel (e.g. no sharp edges, no arcing, chafing wire damage, etc.)."},{"n":"21-70-03","d":"Sidewall Diffuser Blockers missing - 757-200 ONLY","o":"757-200 ONLY, P/N H30567-039 or 25-5830-001 as installed by AA 2161-01021.","r":""},{"n":"23-11-01","d":"HF Sensitivity Knob Damaged / Missing (sensitivity still adjustable)","o":"This NEF item has a 10 day allowable time limit.","r":""},{"n":"23-25-01","d":"Satcom Phone Directory Missing","o":"Reset Timed Out. Satcom operational phone numbers will need to be dialed manually.","r":"Reset Timed Out. Satcom operational phone numbers will need to be dialed manually."},{"n":"23-30-01","d":"IFE BITE data not offloading over WiFi connection - Except 717","o":"Built In Test Equipment (BITE) data offloading is a capability of Delta Air Lines IFE system to evaluate IFE equipment performance. No passenger impact for either WiFi or IFE system as data is used for performance monitoring only.","r":""},{"n":"23-31-02","d":"Cabin Speakers have static (Still Operational)","o":"For inoperative speaker(s) refer to MEL.","r":""},{"n":"23-31-07","d":"PA System Loud","o":"","r":"Audio must still be intelligible."},{"n":"23-32-04","d":"Movie Control Panel Inop","o":"","r":""},{"n":"23-32-05","d":"Moving Map Incorrect Data","o":"","r":""},{"n":"23-32-06","d":"Moving Map Interferes With Movie","o":"","r":""},{"n":"23-32-07","d":"Moving Map Not Communicating","o":"","r":""},{"n":"23-32-08","d":"Moving Map Won't Turn On","o":"","r":""},{"n":"23-32-09","d":"Overhead/Wall Monitor Inop-F/A Manual Briefing / demo Required - Video /except A220 fleet/","o":"","r":"NOTE: This NEF item does NOT apply to the A220. Captain is to brief lead flight attendant to accomplish takeoff briefing/demos."},{"n":"23-32-10","d":"Video Monitor Poor Quality -F/A Manual Brief/demo Required - Overhead Monitor","o":"","r":"Captain is to brief lead flight attendant to accomplish takeoff briefing/demos."},{"n":"23-32-11","d":"Cell Modem Inoperative (Panasonic IFE System)","o":"This deferral is for the cell modem installed on Panasonic IFE systems. The cell modem transmits and receives IFE data (BITE, PAXUS, and OneMedia) and is not used for any flight critical systems. The transfer of data occurs when the aircraft is on the ground. NEF has 365 day allowable time limit","r":""},{"n":"23-32-12","d":"Video Monitor Will Not Extend -F/A Manual Brief/demo Required- Overhead Monitor","o":"","r":"Captain is to brief lead flight attendant to accomplish takeoff briefing/demos."},{"n":"23-32-14","d":"Safety Video Incorrect/Missing -F/A Manual Brief/demo Required","o":"","r":"Captain is to brief lead flight attendant to accomplish takeoff briefing/demos."},{"n":"23-32-15","d":"Safety Video Poor A/V Quality-F/A Manual Brief/demo Required","o":"","r":"Captain is to brief lead flight attendant to accomplish takeoff briefing/demos."},{"n":"23-33-01","d":"Inseat Audio Inop for Individual Seat - PS, C+, Main Cabin","o":"","r":""},{"n":"23-33-02","d":"Inseat Audio Inop for Individual Seat - Delta One and First Class Only","o":"","r":""},{"n":"23-33-03","d":"Inseat Audio Jack Audio in One Ear Only","o":"","r":""},{"n":"23-33-04","d":"Inseat Audio Jack Damaged / Obstructed - Delta One and First Class Only","o":"","r":""},{"n":"23-33-05","d":"Inseat Music Audio Uncontrollable","o":"","r":""},{"n":"23-33-06","d":"Inseat Music Poor Quality / Inoperative","o":"","r":""},{"n":"23-33-07","d":"Movie Audio Mixing Channels/Limited","o":"","r":""},{"n":"23-33-08","d":"Movie Audio Poor Quality / Static","o":"","r":""},{"n":"23-33-09","d":"Movie Audio Volume Too High / Low","o":"","r":""},{"n":"23-33-10","d":"Passenger Seat Video Monitor Bluetooth Audio Connectivity (IF INSTALLED)","o":"Passenger Seat Video Monitor Bluetooth Audio Connection functionality may be inoperative. NEF only applies to aircraft which have Bluetooth functionality installed and activated.","r":""},{"n":"23-33-11","d":"Inseat Audio Jack Damaged / Obstructed - PS, C+, Main Cabin","o":"","r":""},{"n":"23-36-01","d":"Boarding Music Incorrect","o":"","r":""},{"n":"23-36-02","d":"Boarding Music Poor Quality / Inoperative","o":"","r":""},{"n":"23-37-01","d":"Entertainment Audit Tapes or Media Load Out of Date","o":"Safety Briefing Video is covered by its own NEF item.","r":""},{"n":"23-37-02","d":"IFE Audio/Video Quality Poor-F/A Manual Brief/demo Required","o":"","r":"Captain is to brief lead flight attendant to accomplish takeoff briefing/demos."},{"n":"23-37-05","d":"In-Arm Seat Video Display (ISVD) Hard To Install / Extend","o":"","r":"Must not present hazard to passengers or crew or impede emergency egress."},{"n":"23-37-06","d":"Redundant IFE Network Operational, Primary IFE Signal Degraded/Inoperative (B767 Only)","o":"Video on the B767 IFE system skips in primary mode due to pinched signal wiring. The IFE system must be switched to the redundant mode by disconnecting the primary signal connector. before using this NEF item, confirm the IFE system is fully operational in the redundant mode after the primary line is disconnected. This NEF item has a 365 day allowable time limit.","r":"Disconnect the primary IFE signal line in accordance with the following instructions. After disconnecting the primary line, verify the fault is no longer present and the IFE system is fully operational in the redundant mode.\\n1. Disconnect harness connector D95194P at the J8 connection of ADB4.\\n2. Cap and stow the D95194P connector IAW BSWPM, CH. 20.\\n3. Verify IFE system functionality in backup mode. \\n4. Note in a paper log page that connector D95194P at the J8 connection to ADB4 has been disconnected, capped, and stowed."},{"n":"23-37-07","d":"Inseat On-Demand Movies Unavailable","o":"","r":""},{"n":"23-37-08","d":"Inseat Video Monitor/Seat Display Unit Inoperative-F/A Manual Brief/demo may be Required - PS, C+, Main Cabin","o":"Includes Comfort plus (C+)","r":"Install placard ON inoperative monitor. For the pre-flight safety brief/demonstration, an adjacent video monitor must be visible to the passenger sitting in the seat with the video inoperative. If video is not visible from an adjacent seat, the flight attendant must perform the safety brief/demonstration for the seat/seats with the inoperative video."},{"n":"23-37-09","d":"Inseat Video Monitor Inoperative -F/A Manual Brief/demo may be Required - Delta One and First Class Only","o":"","r":"Install placard ON inoperative monitor. For the pre- flight safety brief/demonstration, an adjacent video monitor must be visible to the passenger sitting in the seat with the video inoperative. If video is not visible from an adjacent seat, the flight attendant must perform the safety brief/demonstration for the seat/seats with the inoperative video."},{"n":"23-37-10","d":"Inseat Video / Music Channels Do Not Match Icons","o":"","r":""},{"n":"23-37-14","d":"Inseat Video Poor Video Quality-F/A Manual Brief/demo Required","o":"","r":"Install placard at seat. If passenger briefing is affected Captain is to brief lead flight attendant to accomplish takeoff briefing/demos."},{"n":"23-37-15","d":"Inseat Video Screen Wont Go Into Entertainment","o":"","r":""},{"n":"23-37-16","d":"Inseat Video Touch Screen Unresponsive Delta One and First Class Only","o":"Not applicable to inoperative inseat video monitor(s).","r":""},{"n":"23-37-17","d":"Inseat Video Will Not Download Game / Menu","o":"Includes in-seat menu application content and Smart IFE functions.","r":""},{"n":"23-37-18","d":"Satellite TV Inoperative","o":"","r":""},{"n":"23-37-19","d":"Universal Passenger Control Unit (UPCU) Cord Won't Retract / Damaged","o":"","r":""},{"n":"23-37-21","d":"Universal Passenger Control Unit (UPCU) Handset or Cradle Damaged / Inoperative - Delta One and First Class Only","o":"","r":"Damage must not be to an extent that it leaves an opening that items could fall into or that would be a security concern."},{"n":"23-37-30","d":"Panasonic OML INOP -onboard media loader","o":"This item has a allowable limit of 365 days. This NEF is only for the OML being inop NOT the content/entertainment being out of date, if that is the case see NEF 23-37-01. The content should not be out of date because of a INOP OML there are alternate ways for loading the software such as using a PML (portable media loader).","r":""},{"n":"23-37-31","d":"IFE Master Switch Cover","o":"A220 Fleet Only","r":"Ensure that the switch functions properly."},{"n":"23-37-32","d":"Inseat Video Screens - Cosmetic Damage","o":"Cosmetic damage may include but is not limited to: significant scratches, permanent stains, chipped corners, etc.","r":""},{"n":"23-37-33","d":"Wireless IFE Secondary File Server Inoperative (764 and A330-900 ONLY)","o":"764 and A330-900 only, P/N E71-202A01. If Secondary File Server is found inoperative, Wireless In-Flight Entertainment System remains fully operational through Primary Server.","r":""},{"n":"23-37-34","d":"Redundant IFE Network Inoperative, Seatback Installed Screens (ALL fleets, except 717)","o":"","r":""},{"n":"23-37-35","d":"Inseat Video Touch Screen Unresponsive - PS, C+, Main Cabin","o":"Not applicable to inoperative inseat video monitor(s).","r":""},{"n":"23-37-36","d":"Universal Passenger Control Unit (UPCU) Handset or Cradle Damaged / Inoperative - PS, C+, Main Cabin","o":"","r":"Damage must not be to an extent that it leaves an opening that items could fall into or that would be a security concern."},{"n":"23-41-02","d":"Service Interphone Phenolic Block at External Power Damaged","o":"The phenolic block is cracked but the jack can be secured for use. If can not be secured ref MEL. Defer for block replacement where there is parts and manpower.","r":""},{"n":"23-42-01","d":"Cabin Handset Cradle Damaged (Handset operational)","o":"See MEL for handset if cradle is causing the handset not to reset or not operate correctly.","r":"Handset must be able to be secured in cradle."},{"n":"23-51-01","d":"Cabin medical communication flight deck switch inop(330 only)See notes","o":"This NEF allows for the flight deck switch to be rendered inoperative and will render the whole system inoperative.\\nTroubleshoot system per A330 AWM 23-51-13 and/or 23-51-01, if any wire damage (chafed, exposed or otherwise damage) is identified, coil and stow wire in accordance with Airbus ESPM Chapter 20-54-50 at the damage location.\\n\\nOnly on A330 Post AA 2351-01033","r":"Troubleshoot system per A330 AWM 23-51-13 and/or 23-51-01, if any wire damage (chafed, exposed or otherwise damage) is identified, coil and stow wire in accordance with Airbus ESPM Chapter 20-54-50 at the damage location.\\n\\nOnly on A330 Post AA 2351-01033"},{"n":"23-51-02","d":"Cabin medical communication jacks inop (330 only) see notes","o":"This NEF allows for a cabin medical communication PSU jack to be inoperative.\\n\\nTroubleshoot system per A330 AWM 23-51-13 and/or 23-51-01, if any wire damage (chafed, exposed or otherwise damage) is identified, coil and stow wire in accordance with Airbus ESPM Chapter 20-54-50 at the damage location\\n\\nOnly on A330 Post AA 2351-01033","r":"Troubleshoot system per A330 AWM 23-51-13 and/or 23-51-01, if any wire damage (chafed, exposed or otherwise damage) is identified, coil and stow wire in accordance with Airbus ESPM Chapter 20-54-50 at the damage location.\\n\\nOnly on A330 Post AA 2351-01033"},{"n":"23-51-03","d":"Cabin Medical Communication wiring and/or jack(NOT FOR USE ON A330/A220 series)","o":"(NEF use is for 320 FAM,350/717/737/767/757/777only)Troubleshoot system per applicable AWM ,WDM and AMM if any wire damage (chafed, exposed or otherwise damage) is identified, coil and stow wire in accordance with D6-54446 707, 727 Through 787 SWPM Chapter 20-10-11 OR Airbus ESPM Chapter 20-54-50 at the damage location and record this info in the paper log book . Allowable time on this item is 365 days.","r":"(NEF use is for 320 FAM,350/717/737/767/757 only)Troubleshoot system per applicable AWM ,WDM and AMM if any wire damage (chafed, exposed or otherwise damage) is identified, coil and stow wire in accordance with D6-54446 707, 727 Through 787 SWPM Chapter 20-10-11 OR Airbus ESPM Chapter 20-54-50 at the damage location and record this info in the paper log book ."},{"n":"23-51-04","d":"Capt and FO's ACP Foam Block (737-800, -900 ONLY)","o":"Ensure adjacent compartment is empty.","r":""},{"n":"23-54-01","d":"Flight Deck Microphone Holder Damaged","o":"Mike clip/holder. This is in the flight deck for the crew members. This does not apply to the Emergency PA microphone holder in the flight deck.","r":""},{"n":"23-55-01","d":"Crew Rest Handset Holder Damaged (Handset operational)","o":"","r":"Handset must be able to be secured in cradle."},{"n":"23-55-02","d":"Flight Deck Handset Cradle Damaged (Handset operational)","o":"","r":"Handset must be able to be secured in cradle."},{"n":"23-56-01","d":"Cabin Medical Headset Damaged / Missing","o":"this item is not applicable to the 737 fleet. For Cabin Medical Headset deferral, please see 737 MEL item 23-00-29.","r":""},{"n":"23-56-02","d":"Excess Flight Deck Headsets (Spares only) Damaged / Missing","o":"See applicable fleet MEL for required headsets for required positions.","r":""},{"n":"23-56-03","d":"Flight Deck Headset Cord Holder Damaged / Missing","o":"","r":""},{"n":"23-56-04","d":"Headset Hangar Damaged / Missing","o":"","r":""},{"n":"23-95-01","d":"WIFI Button at L1 Door Does Not Illuminate","o":"Clarification of WIFI light location.","r":""},{"n":"23-95-02","d":"WIFI Inoperative","o":"","r":""},{"n":"23-95-03","d":"WIFI Reported Intermittently Inoperative","o":"","r":""},{"n":"23-95-04","d":"WIFI Handset / WIFI Video Inoperative","o":"Includes video content loader/USB dock located in the handset","r":""},{"n":"23-95-05","d":"WIFI system software is not current","o":"The WiFi system must be fully functional. Apply this code only if the WIFI system requires the latest software version to be installed. It has a Allowable time limit of 365 days.","r":""},{"n":"23-95-06","d":"WIFI system software load failed","o":"This code is for a failed software load. The system must be fully functional using the previous software version. If the system is inoperative, use NEF 23-95-02.","r":""},{"n":"24-10-01","d":"IDG Oil Dust Cap Damaged / Missing","o":"","r":""},{"n":"24-10-02","d":"IDG Oil Dust Cap Lanyard Damaged / Missing","o":"","r":""},{"n":"24-10-03","d":"IDG disconnection test harness Missing from Flight Compartment (A330 Only)","o":"A330 Fleet Management has decided to incorporate a test harness for assistance in verifying the successful disconnection of an IDG on P&W 4168 powered aircraft. As this harness will be installed on the flight deck for maintenance\\u001As use to verify no go ODI procedures for the IDG. MPN is 24-0188-501DL STK# 33-2400-3-0607","r":""},{"n":"24-24-01","d":"APU Generator Terminal Lug Plastic Cover Damaged / Poor Condition","o":"This NEF item has a 10 day allowable time limit.","r":"Cover must be secure and lugs must not be exposed."},{"n":"24-41-01","d":"Ground Power Cord Strap Damaged (B757)","o":"","r":"Ground power operates normally."},{"n":"24-41-02","d":"Ground Power Receptacle Guide Cracked","o":"","r":"Ground power operates normally. Item must be deferred in a condition to prevent electrical shorting. This will require a maintenance check before deferral."},{"n":"24-41-03","d":"Ground Power Unit Guard Cracked or Missing - A320FAM ONLY","o":"10-day item\\n\\nThis deferral applies to A320FAM aircraft ONLY (PN 24-0193-501)","r":""},{"n":"24-51-01","d":"Electrical outlets (AC) or (DC)(NOT for Electronic Flight Bags -EFB power connectors)","o":"This NEF is not for This NEF is not for use for electrical outlets in the Flight Deck labeled EFB Power Only or EFB Use Only. See fleet specific chapter 46 MEL for Electronic Flight Bags (EFB) power connector relief....","r":"(Not applicable for Flight Deck EFB Only power outlets, see NEF item notes.) May be inoperative. Item must be deferred in a condition to prevent electrical shorting. This will require a maintenance check before deferral."},{"n":"24-51-02","d":"Ground Service Electrical Outlet Covers Damaged or Missing","o":"","r":"Damage must not be to an extent that it leaves an opening that items could fall into or that would be a security concern."},{"n":"24-58-01","d":"Crew Rest PED Power / Empower Inop","o":"Includes PED KID Power system installed on 330-9.","r":"check if item is contained in the MEL; if yes then complete the MEL deferral process, otherwise defer using the NEF item.\\n\\nCheck affected locations/area for acrid/burning smells and face of outlets for abnormal heat coming from or around the unit. If smell or overheat condition is apparent contact MCC. \\n\\nInstall placard at the seat."},{"n":"24-58-02","d":"Change to PED Power / Empower Inop at Individual Seat -Premimum Select / Coach Class- CABIN ONLY","o":"For Cockpit power connectors/USB that are not EFB( Electronic Flight Bag) use NEF 24-51-01. If EFB power INOP use the correct fleet specific MEL under ATA chapter 46.","r":"Install placard at the seat.\\n\\nCheck affected locations/area for acrid/burning smells and face of outlets for abnormal heat coming from or around the unit. If smell or overheat condition is apparent contact MCC."},{"n":"24-58-03","d":"Change to PED Power Inop at Individual Seat- Delta One - CABIN ONLY","o":"For Cockpit power connectors/USB that are not EFB( Electronic Flight Bag) use NEF 24-51-01. If EFB power INOP use the correct fleet specific MEL under ATA chapter 46.","r":"Install placard at the seat.\\n\\nCheck affected locations/area for acrid/burning smells and face of outlets for abnormal heat coming from or around the unit. If smell or overheat condition is apparent contact MCC."},{"n":"24-58-04","d":"PED Power / Empower System Zone Inop- CABIN ONLY","o":"For Cockpit power connectors/USB that are not EFB( Electronic Flight Bag) use NEF 24-51-01. If EFB power INOP use the correct fleet specific MEL under ATA chapter 46.","r":"Check affected locations/area for acrid/burning smells and face of outlets for abnormal heat coming from or around the unit. If smell or overheat condition is apparent contact MCC."},{"n":"24-58-05","d":"PED Power / Empower in Use Light Inop- CABIN ONLY","o":"For Cockpit power connectors/USB that are not EFB( Electronic Flight Bag) use NEF 24-51-01. If EFB power INOP use the correct fleet specific MEL under ATA chapter 46.","r":"Install placard at the seat."},{"n":"24-58-06","d":"PED Power Outlets - Cosmetic Damage","o":"Cosmetic damage can include but is not limited to: significant scratches, permanent stains, chipped corners, etc.","r":""},{"n":"25-00-01","d":"NLG Steering Valve Lock Pin - 757 ONLY","o":"","r":""},{"n":"25-00-02","d":"Hand Sanitizer Bracket (post AA #2500-01840)","o":"","r":"Hand Sanitizer Mount/Bracket may be damaged or missing under the following conditions:\\n1) If mount is damaged, no sharp edges or hazards to persons are permitted, remove entire hand sanitizer mount if any sharp edges or hazards exist.\\n2) No damage to underlying structure (monument/wall panel) is permitted.\\n3) No open holes are permitted. Install attachment hardware to fill holes, or cover open inserts with 3M 425 or 3M 398FRP tape.\\n4) If mount is damaged, or security of attachment is suspect, the hand sanitizer dispenser (bottle) must be removed."},{"n":"25-00-03","d":"NOTAC CLIP IN COCKPIT MISSING","o":"NOTAC CLIP DAMAGED/MISSING","r":""},{"n":"25-00-04","d":"Landing Gear Pins Tag (Yellow Tag) Missing","o":"Subject warning tags are being installed via AA 2510\\u001A01333 on all Delta fleets for placement over the throttle levers while the gear down lock pins are installed.","r":""},{"n":"25-00-05","d":"Cockpit circuit breaker colored identification cap (Yellow / Red) damaged or missing","o":"","r":""},{"n":"25-10-01","d":"Flight Deck Ramp Inspection Vest Container Damaged","o":"","r":"Flight deck ramp vest must be able to remain secure within the designated storage container and be accessible to the flight crew."},{"n":"25-10-02","d":"Flight Deck Blanking Plate Broken","o":"","r":"Cover the damaged area with tape as necessary to prevent any FOD from entering behind the blanking plate."},{"n":"25-10-03","d":"Flight Deck Flight Manual Retaining Bar Damaged or Missing (B737 Only)","o":"","r":"Manuals must be retained in flight deck flight manual compartment."},{"n":"25-10-04","d":"Flight Crew Seat Adjust Assist Overhead Handle Spring Damaged/Missing","o":"Handle down does not imped vision.","r":""},{"n":"25-10-06","d":"Flight Deck Sunvisor or Shade Holder/Pouch Damaged/Missing","o":"For the A220\\u001As only, if damaged and usable this NEF applies. If inoperative or missing refer to A220 MEL 25-18-05","r":""},{"n":"25-10-07","d":"Damaged/Missing Cockpit Storage Compartment Door (757 Only, Limited Effectivity)","o":"This item is only applicable to the compartment doors listed in the B757 IPC 25-13-52-55 items 250/255(All B757s) and 475/480 (Aircraft 5650-5657 & 5801-5816)//IPC 53-11-51 door assy item 405 for (757-300s).","r":"Install a placard to restrict items from being stored in the compartment and block off the compartment.\\r\\n\\r\\nIf damaged, smooth out all sharp edges.\\r\\n\\r\\nData stored in restricted compartment must be available to crew."},{"n":"25-10-08","d":"Cockpit PED Mount Stowage Bag Missing/Damaged","o":"See MEL for missing/damaged PED mounts. This item is for the PED mount stowage bag only. PED mount must be securely stowed in a closet or overhead bin during flight and when not in use.","r":""},{"n":"25-10-09","d":"CREW EFB docking compartment padlock missing/damaged- 350 only","o":"1. EFB MUST BE REMOVED FROM DOCKING STATION. Remove EFB from the aircraft and defer per A350 MEL 46-20-07A. No deviations from MEL are permitted.\\n\\n2. Placard the unlocked docking station DO NOT INSTALL OR STORE EFB IN THIS DOCKING STATION\\n\\n3. NEF is limited to 10 DAYS, or remainder of MEL 46-20-07A limit, whichever is sooner.","r":"1. EFB MUST BE REMOVED FROM DOCKING STATION. Remove EFB from the aircraft and defer per A350 MEL 46-20-07A. No deviations from MEL are permitted.\\n\\n2. Placard the unlocked docking station DO NOT INSTALL OR STORE EFB IN THIS DOCKING STATION\\n\\n3. NEF is limited to 10 DAYS, or remainder of MEL 46-20-07A limit, whichever is sooner."},{"n":"25-10-38","d":"A/C Out of Service Tag Damaged","o":"","r":""},{"n":"25-10-39","d":"Boom MIC Holders (Clips)","o":"","r":""},{"n":"25-10-40","d":"Broken Copper Safety Wire for EEC Switch (B757 Only)","o":"EEC alt/norm switch cover has broken safety wire. Must be safetied at next station where copper wire is available. There is no requirement to safety wire switch guards per Boeing.","r":"There is no requirement to safety wire switch guards per Boeing. Safety wire may be installed after delivery by the customer, or by Boeing at customer request. email on file."},{"n":"25-10-41","d":"Center Pedestal Clear Plastic Paperwork Holder Damaged / Missing","o":"","r":""},{"n":"25-10-43","d":"Document Holders Damaged","o":"","r":""},{"n":"25-10-44","d":"Eyebrow Window Visors Damaged","o":"","r":""},{"n":"25-10-45","d":"Flight Deck Access Compartment Latches Damaged / Hard to Operate","o":"","r":"If compartment door does not stay closed then remove items from compartment and secure door closed. If removing items and compartment contains emergency equipment then see MEL."},{"n":"25-10-46","d":"Flight Deck Ashtrays Damaged / Missing","o":"","r":"If ashtray is missing and leaves hole exposed, inspect for foreign objects then cover with suitable pressure sensitive tape (i.e. bag bin tape, nylon or fiberglass reinforced tape, not masking tape)."},{"n":"25-10-47","d":"Flight Deck Coat or Hat Hooks / Hangers Damaged or Missing","o":"","r":""},{"n":"25-10-48","d":"Flight Deck Crew Stowage Tie Downs or Belts Damaged / Missing","o":"","r":"For tie downs that are not in usable condition, alternate storage areas (coat closets or overhead storage bins) must be available for use by crewmembers. If Crew stowage tie-down unusable, alternate stowage area must be made available.\""},{"n":"25-10-49","d":"Flight Deck CRT Cleaning Kit Damaged / Missing","o":"","r":""},{"n":"25-10-50","d":"Flight Deck Cup Holder or Insert Damaged or Missing","o":"","r":"If cup holder is missing and leaves an opening, cover with tape."},{"n":"25-10-51","d":"Flight Deck Door Closing Strap Damaged / Missing","o":"","r":"Must not present hazard to crew."},{"n":"25-10-52","d":"Flight Deck Floor Coverings Worn / Damaged / Missing","o":"Covers floor covering and carpet","r":"May be worn, frayed, torn, damaged, loose, missing (must not present hazard to pax/crew or impede emergency egress)."},{"n":"25-10-53","d":"Flight Deck Food Sliding Table / Food Trays Damaged / Missing","o":"For A319/320/321 and A330, 350 pilot sliding tables see MEL.","r":"May be inoperative in the stowed position or missing."},{"n":"25-10-54","d":"Flight Deck Forms or Consumables Need Replenishing","o":"These are items normally used up. Any forms required for flight must be replaced. See FOM for required forms","r":""},{"n":"25-10-55","d":"Flight Deck Ramp Inspection Vests damaged or missing","o":"Any standard Reflective Safety Vest can replace a missing flight deck safety vest if a Flight Ops Branded Vest is not available. The Flight Ops Safety Vests, P/N P600FOXL and P/N P600FO2X , can be obtained by ordering in Ariba.","r":""},{"n":"25-10-56","d":"Flight Deck Software Binder or Disks Damaged / Missing","o":"","r":""},{"n":"25-10-57","d":"Flight Deck Vanity Mirror Damaged / Missing","o":"","r":"Damage must not pose any safety hazard. Cracked Mirror may require taping."},{"n":"25-10-58","d":"Flight Deck Waste Containers Damaged / Missing","o":"","r":"If container is missing and leaves hole exposed, inspect for foreign objects then cover with suitable pressure sensitive tape (i.e. bag bin tape, nylon or fiberglass reinforced tape, not masking tape)."},{"n":"25-10-59","d":"Flight Deck Window Shades (retractable) Damaged","o":"For the A220\\u001As only, if damaged and usable this NEF applies. If inoperative or missing refer to A220 MEL 25-18-05","r":"This is subject to conditions not requiring it's use."},{"n":"25-10-60","d":"HGS / HUD Quilted Cover Damaged or Missing","o":"","r":""},{"n":"25-10-61","d":"Instrument Panel Foot Rest Damaged","o":"For A319/320/321 ,330 and A350 pilot retractable footrest see MEL.","r":""},{"n":"25-10-62","d":"Instrument Panel Foot Tread Trim Damaged / Missing","o":"","r":""},{"n":"25-10-63","d":"Logbook Holder Damaged","o":"","r":""},{"n":"25-10-64","d":"Map / Chart Holders Damaged / Missing","o":"For Airbus food sliding table map holders see NEF 25-16-04.","r":"Item may not be missing if wires normally attach to it or if it presents an electrical hazard."},{"n":"25-10-65","d":"Observer's Foot Rest Assemblies Damaged","o":"MELs are available for the observer seat including associated equipment if the seat is acceptable to the FAA inspector for performance of official duties.","r":"Must not present hazard to crew or impede emergency egress. Do not use on B757 aircraft, use MEL 25-11-02A per the FAA."},{"n":"25-10-66","d":"Observer's Seat Latch Knob Damaged(see notes)","o":"Only for a damaged knob, Latch must still operate and not prevent egress or pose a hazard to crew.","r":""},{"n":"25-10-67","d":"Side Stick Bellows / Boot Worn / Damaged","o":"","r":"Damage must not be to an extent that it leaves an opening that items could fall into."},{"n":"25-10-68","d":"Spare Bulb Kit Damaged / Missing","o":"","r":""},{"n":"25-10-69","d":"Spare Bulb Kit Needs Replenishing","o":"","r":""},{"n":"25-10-70","d":"Sunshade or Clips Damaged / Missing","o":"This NEF item is not applicable to the A220 fleet. Reference A220 MEL 25-18-05.","r":"This is subject to conditions not requiring it's use."},{"n":"25-10-71","d":"Yoke Thumb Wheel Reminder Inoperative","o":"","r":""},{"n":"25-10-72","d":"AIRCRAFT OUT OF SERVICE TAG MISSING","o":"AIRCRAFT OUT OF SERVICE TAG MISSING","r":""},{"n":"25-11-01","d":"Flight Deck Armrest Covers Damaged / Missing","o":"For inoperative flight crew armrest see MEL.","r":""},{"n":"25-11-02","d":"Flight Deck Seat Belt Tidy Clips Damaged / Missing","o":"","r":""},{"n":"25-11-03","d":"Flight Deck Seat Covers Worn","o":"For this item if it is lightly worn, or wrong color replace at next overnight where parts are available.","r":"May be lightly worn in a cosmetic fashion, but seat still serviceable and cushion is not torn or otherwise has hole in fabric."},{"n":"25-11-04","d":"Flight Deck Seat Cushions Flat or Damaged","o":"Cushion flat or damaged (i.e.; velcro missing).","r":"Cushion and fabric may not be torn or have holes in fabric. The cushion seat must be secured."},{"n":"25-11-05","d":"Flight Deck Seat Trim Damaged","o":"","r":"Seat functions normal and trim is secure. Must not present hazard to crew or impede emergency egress."},{"n":"25-11-06","d":"Observers Seat - Seat Bottom Stowage Strap Damaged/Broken","o":"Only to be used with observers jump seat that has two straps used to secure the seat in the up position.","r":"Only one of two straps may be damaged or broken. Verify condition of the remaining strap."},{"n":"25-11-07","d":"Flight Deck Seat Comfort Pad Damaged/Missing","o":"The pad, if installed, is located on the back of the rotary lap buckle. Not all aircraft have a pad installed on the rotary lap buckle.","r":"The pad may be damaged or missing provided the rotary lap buckle operates normally."},{"n":"25-11-08","d":"Shoulder Harness Quick Release Tab Broken/Bent (B767 Only)","o":"The single point rotary release system is fully operational. This tab releases the shoulder restraints only. B767 only. This NEF item has a 10 day allowable time limit.","r":"Single point rotary release must be fully operational; if any section of the release tab is bent it must not impede the action of the rotary release mechanism. Broken or missing release tab must not have any exposed sharp edges."},{"n":"25-12-01","d":"Gear Pin Pouch/Container Damaged / Poor Condition","o":"","r":"Pouch or container must securely hold and allow access to the contents."},{"n":"25-13-01","d":"Flight Deck Stowage Compartment Door Lock Damaged","o":"","r":"Compartment needs to be secured"},{"n":"25-14-01","d":"Flight Deck Closet Restraints Damaged / Missing","o":"","r":"If items can not be secured with remaining closet restraints, closet must not be used for storage."},{"n":"25-14-02","d":"Flight Deck Interior Trim Damaged/Missing (Including Glareshield & Condensation Drain Tube)","o":"Includes condensation drain tubes.This NEF item has a 365 day allowable time limit. Panels that cover live electrical terminals cannot deferred per this NEF.","r":"Appearance items, damaged, loose, missing (must not present hazard to pax/crew or impede emergency egress)."},{"n":"25-14-03","d":"Flight Deck Outlet Covers Damaged","o":"","r":"Verify that no electrical wiring is exposed."},{"n":"25-14-04","d":"Flight Compartment C/B Panel Identification Label Support Damaged/Missing","o":"Circuit breaker identification label support may be removed as long as a circuit breaker identification label is installed per 14 CFR 25.1357(d).","r":"No sharp edges may be present and must not present hazard to the crew. \\r\\n\\r\\nEnsure circuit breaker is identified with a temporary identification label."},{"n":"25-15-01","d":"Fuel Valve Deactivation Tool (A330 Only) Damaged / Missing","o":"Replace at next RON station where parts are available. NW Stock# 33-2500-3-0828","r":""},{"n":"25-15-02","d":"Printer Cover Damaged / Missing","o":"","r":""},{"n":"25-16-01","d":"Polar Suits","o":"May be inoperative or missing provided flight is not conducted on polar routes.","r":"Check if item is contained in the MEL; if yes then complete the MEL deferral process, otherwise defer using the NEF item. \\n\\nContact the MCC to ensure that Flight Control applies S item 25-16-01 prior to dispatch to ensure the aircraft is restricted from polar routes.\\n\\nWhen removing the NEF, contact the MCC to ensure that S item 25-16-01 is removed."},{"n":"25-16-02","d":"Flight Deck Pencil / Pen Holder Damaged or Missing","o":"","r":""},{"n":"25-16-04","d":"Yoke / Table Chart Clips Damaged Missing","o":"","r":""},{"n":"25-16-05","d":"Fly-Away Kit (A220 only)","o":"","r":""},{"n":"25-17-01","d":"Abnormal Checklist Damaged or Worn but Legible","o":"","r":""},{"n":"25-17-02","d":"Contaminated Runway Hard Cards Damaged or Worn but Legible","o":"","r":""},{"n":"25-17-03","d":"Speed Book Damaged or Worn but Legible","o":"","r":""},{"n":"25-18-01","d":"Printer Paper Needs Replenishing","o":"","r":""},{"n":"25-19-01","d":"Pilot Crew Rest Area Assist handles Poor Condition","o":"","r":"Must still be functional and secure."},{"n":"25-19-02","d":"Pilot Crew Rest Area Bunk Door (Check MEL)","o":"","r":"Check if item is contained in the MEL; if yes then complete the MEL deferral process, otherwise defer using the NEF item."},{"n":"25-19-03","d":"Pilot Crew Rest Area Grills / Vents Damaged","o":"","r":""},{"n":"25-19-04","d":"Pilot Crew Rest Area Interior Trim or Wall Covering Damaged / Missing","o":"This NEF item has a 365 day allowable time limit.","r":""},{"n":"25-19-05","d":"Pilot Crew Rest Area Pillows, Blankets, Mattress Pads, Sheets damaged/ Missing","o":"","r":"Check if item is contained in the MEL; if yes then complete the MEL deferral process, otherwise defer using the NEF item. At this time, reference MEL 25-25-07F for B767-300, MEL 25-25-07F for B767-400 and MEL 25-29-04F for B777 aircraft."},{"n":"25-19-06","d":"Crew Rest Area Carpet or Floor Coverings Worn / Damage / Missing","o":"This NEF item has a 365 day allowable time limit.","r":""},{"n":"25-19-07","d":"Crew Rest Area Floor Track Covers Damaged / Loose / Missing","o":"","r":"Any exposed wiring must be protected."},{"n":"25-19-08","d":"Pilot Crew Rest Ashtray Damaged / Missing","o":"","r":"If ashtray is missing and leaves hole exposed, inspect for foreign objects then cover with suitable pressure sensitive tape (i.e. bag bin tape, nylon or fiberglass reinforced tape, not masking tape)."},{"n":"25-19-09","d":"Pilot Crew Rest Coat / Hat Hangar or Clip Damaged / Missing","o":"","r":""},{"n":"25-19-10","d":"Pilot Crew Rest Foot Rest Restraining Straps Damaged / Missing","o":"","r":""},{"n":"25-19-11","d":"Pilot Crew Rest Headrest Cover Damaged / Missing","o":"","r":""},{"n":"25-19-13","d":"Pilot Crew Rest Peep Hole Blocked / Damaged","o":"Crew rest door peep hole in a330.","r":"If cover is missing Place masking tape over the peep hole to insure security."},{"n":"25-19-14","d":"Pilot Crew Rest Seat Cushions and Coverings Damaged/Torn","o":"","r":""},{"n":"25-19-15","d":"Pilot Crew Rest Seat Curtain Tie-back Damaged or Missing","o":"","r":"If tie- back is missing secure curtain with ties or string."},{"n":"25-19-16","d":"Pilot Crew Rest Stowage Compartment or Bag Damaged","o":"","r":""},{"n":"25-19-17","d":"Pilot Crew Rest Tray Table Damaged / Missing","o":"","r":""},{"n":"25-19-18","d":"Pilot Crew Rest Vanity Mirrors Damaged / Missing","o":"This NEF item has a 365 day allowable time limit.","r":""},{"n":"25-19-19","d":"Pilot Crew Rest Seat Curtain Missing","o":"This is the curtain used for the crew rest seats located in Business Class. The curtain is required for flights scheduled over 8 hrs by Pilot Working Agreement. If curtain is required schedule maintenance at next station.","r":"Check if item is contained in the MEL; if yes then complete the MEL deferral process, otherwise defer using the NEF item. At this time, reference MEL 25-25-08C/D/E for B767-300 and MEL 25-25-08C/D/E for B767-400 and MEL 25-75-03C/D/E for A330 aircraft"},{"n":"25-19-20","d":"Pilot Crew Rest Seat Curtain Damaged","o":"This is the curtain used for the crew rest seats located in Business Class. The curtain is required for flights scheduled over 8 hrs by Pilot Working Agreement. If curtain is required schedule maintenance at next station.","r":"Check if item is contained in the MEL; if yes then complete the MEL deferral process, otherwise defer using the NEF item. At this time, reference MEL 25-25-08C/D/E for B767-300 and MEL 25-25-08C/D/E for B767-400 and MEL 25-75-03C/D/E for A330 aircraft \\n\\n\\nSecure curtain if applicable."},{"n":"25-19-23","d":"Pilot Crew Rest Trash Liner Damaged/Missing","o":"","r":"Must not present hazard to passengers or crew. Flapper door and access door must be secured closed and placarded: \"Do not use\"."},{"n":"25-19-24","d":"Pilot Crew Rest Seat Will Not Adjust","o":"The seat must be usable, if not defer per appropriate the MEL.","r":"Must not present hazard to crew or impede emergency egress and the seat must be usable."},{"n":"25-19-25","d":"Aft Lower Lobe Crew Rest Dust Seal Damaged or Missing (767 only)","o":"Aft Lower Lobe Crew Rest Dust seal may be missing or damaged. \\r\\n\\r\\nThis FRC to replace 25-74-01 when EFM rev 2 is published and boarded on all fleets.","r":"Secure loose or remove any loose or damaged seal. Tape any opening to prevent debris from entering beneath the lower lobe crew rest as needed."},{"n":"25-19-26","d":"Pilot Crew Rest Area Bunk Curtain (Check MEL)","o":"","r":"Check if item is contained in the MEL; if yes then complete the MEL deferral process, otherwise defer using the NEF item."},{"n":"25-19-27","d":"Pilot Crew Rest Area Bunk Curtain Tie-Back (Check MEL)","o":"","r":"Check if item is contained in the MEL; if yes then complete the MEL deferral process, otherwise defer using the NEF item."},{"n":"25-19-30","d":"767(only) crew rest secondary door hold open magnet and magnet catch inop or missing","o":"This NEF is only for the magnet or the magnet catch on the secondary door(small drop down door not the main entry door) on the crew rest on 767 A/C only.","r":""},{"n":"25-20-01","d":"Wheelchair strap Missing- Pilot notify gate agent each flight that no wheelchair is available--Missing or Damaged","o":"This NEF item has a 10 day allowable time limit. MCC: A wheelchair must be provided for any passenger that requires it on an aircraft with a wheelchair accessible lavatory. For aircraft without a wheelchair accessible lavatory the passenger may be required to provide 48hrs notice and check-in one hour before the check-in time for the general public to be guaranteed an onboard wheelchair.","r":"For the onboard wheelchair strap, remove the onboard wheelchair. Flight Crew must notify gate agent that no wheelchair is available. If wheelchair is required by passenger then contact MCC for guidance."},{"n":"25-20-03","d":"Braille Book Damaged or Missing","o":"","r":""},{"n":"25-20-04","d":"Cabin Mirrors Damaged / Missing","o":"","r":"If cracked it may require taping. Must not present damage to passengers or crew."},{"n":"25-20-05","d":"Cabin Trim Torn / Damaged / Missing","o":"This NEF item has a 365 day allowable time limit.","r":"Must not present hazard to passengers or crew or impede emergency egress. Damage must not be to an extent that it leaves an opening that items could fall into or that would be a security concern."},{"n":"25-20-06","d":"Equipment and Furnishings Manual Cover Damaged / Poor Condition","o":"","r":""},{"n":"25-20-07","d":"Equipment and Furnishings Manual Needs Worksheets","o":"","r":""},{"n":"25-20-12","d":"Seat Tray Containers or Tray Liners Damaged","o":"This can include Flight Deck and crew rest area tray Containers/liners","r":""},{"n":"25-20-13","d":"Universal Precaution Kit (UPK) Used / Missing","o":"upk opened","r":""},{"n":"25-20-14","d":"Wheelchair Damaged/Missing-Pilot notify gate agent each flight that no wheelchair is available","o":"This NEF item has a 10 day allowable time limit. MCC: An on-board wheelchair must be provided for any passenger that requires it provided the passenger provides 48 hours' notice and checks-in one hour before the check-in time for the general public to be guaranteed an onboard wheelchair. If a passenger does not meet advance notice or check-in requirements, a wheelchair must still be provided if you can do so by making reasonable efforts, without delaying the flight.","r":"If wheelchair is not usable attach placard or tag to chair. Flight Crew must notify gate agent that no wheelchair is available. If wheelchair is required by passenger then contact MCC for guidance."},{"n":"25-20-16","d":"Equipment and Furnishings Manual or Individual Components Missing","o":"For EFM needs worksheets reference NEF 25-20-07. For EFM cover damaged/poor condition reference NEF 25-20-06.","r":"Per TOPP 50-10-10: Contact the MCC to have the missing item replaced at the next Delta Maintenance Station where time and required parts are available. If EFM is missing, install a placard in aircraft logbook including instruction for flight crew to enter all discrepancies in the aircraft logbook and report them to the MCC or local maintenance."},{"n":"25-20-18","d":"Seat Belt Extension Pouch Damaged/Poor Condition","o":"","r":"Seat belt extension pouch must be capable of holding the extensions securely."},{"n":"25-20-21","d":"Cabin Handrail Damaged/Missing- B717 Only","o":"","r":"No sharp edges may be present and must not present hazard to passengers or crew.\\n\\n(M) Procedure (If the handrail is to be removed):\\n1. Remove the handrail.\\n2. (PRE AA 3320-01184 ONLY) Obtain an ER/A to deactivate the handrail light and apply MEL 33-20-01B.\\n3. Create a log and defer all removed seat row placards to NEF code 11-30-12."},{"n":"25-20-22","d":"Coat Hangers Damaged/Missing","o":"This FRC replaced 25-25-02.","r":""},{"n":"25-20-23","d":"Trash Trap Netting Damaged/Missing","o":"Trash Trap netting is being installed during High Seat density mod. Netting runs between the seatbacks of the last row in F/C and the bulkhead. In place to prevent trash from falling between the seatback and the bulkhead. \\r\\n\\r\\nThis FRC replaced 25-73-09.","r":""},{"n":"25-20-58","d":"Passenger Wheelchair Seat Strapping Kits (Supernumerary Kits Only)","o":"","r":"For configurations which use the seat-strapping method of stowage for passenger wheelchairs, two wheelchair strapping kits are required. If more than two strapping kits are provisioned, supernumerary kits may be missing or damaged, if minimum two serviceable strapping kits remain.\\n\\nThis NEF does not apply to closet stowage of wheelchairs, or for onboard aisle chair. For onboard wheelchair (aisle chair) stowage, see NEF 25-20-01."},{"n":"25-21-05","d":"Passenger Seat PLASTIC Literature Pocket Damaged/Missing","o":"Disregard the ATA description code. This NEF code applies to all passenger seats that have PLASTIC literature seat pockets; First Class, Business Elite, World Business Class or Premium Economy or Coach Class seats.","r":"For missing pocket one passenger information card is required per seat assembly."},{"n":"25-21-06","d":"Passenger Seat LEATHER Literature Pocket Missing","o":"Disregard the ATA description code. This NEF code applies to all passenger seats that have leather literature seat pockets; First Class, Business Elite, World Business Class or Premium Economy or Coach Class seats.","r":"For missing pocket one passenger information card is required per seat assembly."},{"n":"25-21-08","d":"Passenger Seat PLASTIC Literature Pocket Damaged/Torn","o":"Disregard the ATA description code. This NEF code applies to all passenger seats that have PLASTIC literature seat pockets; First Class, Business Elite, World Business Class or Premium Economy or Coach Class seats.","r":""},{"n":"25-21-09","d":"Passenger Seat Information Cards Damaged or Missing","o":"Disregard the ATA description code. This NEF code applies to all passenger seats; First Class, Business Elite, World Business Class or Premium Economy or Coach Class seats.","r":"At least one required per each occupied seat assembly."},{"n":"25-21-10","d":"Passenger Seat Ashtray Cover Damaged / Missing","o":"Disregard the ATA description code. This NEF code applies to all passenger seats; First Class, Business Elite, World Business Class or Premium Economy or Coach Class seats.","r":"If ashtray cover is missing and leaves hole exposed, inspect for foreign objects then cover with suitable pressure sensitive tape (i.e. bag bin tape, nylon or fiberglass reinforced tape, not masking tape)."},{"n":"25-21-12","d":"Passenger Seat PLASTIC Literature Pocket Worn","o":"Disregard the ATA description code. This NEF code applies to all passenger seats that have PLASTIC literature pockets; First Class, Business Elite, World Business Class or Premium Economy or Coach Class seats.","r":""},{"n":"25-21-13","d":"Passenger Seat Assembly Aisle Trim Damaged / Missing","o":"Disregard the ATA description code. This NEF code applies to all passenger seats; First Class, Business Elite, World Business Class or Premium Economy or Coach Class seats.This NEF item has a 365 day allowable time limit.","r":"Must not present hazard to passengers or crew or impede emergency egress."},{"n":"25-21-16","d":"Passenger Seat Belt Extension Incorrect Type","o":"Disregard the ATA description code. This NEF code applies to all passenger seats; First Class, Business Elite, World Business Class or Premium Economy or Coach Class seats.","r":""},{"n":"25-21-17","d":"Passenger Seat Belt Extension Missing","o":"Disregard the ATA description code. This NEF code applies to all passenger seats; First Class, Business Elite, World Business Class or Premium Economy or Coach Class seats.","r":""},{"n":"25-21-24","d":"Passenger Seat Tray Table Needs Adjustment","o":"Disregard the ATA description code. This NEF code applies to all passenger seats; First Class, Business Elite, World Business Class or Premium Economy or Coach Class seats.","r":""},{"n":"25-21-25","d":"Passenger Seat Tray Table or Latch Damaged","o":"Disregard the ATA description code. This NEF code applies to all passenger seats; Delta one ,First Class, Business Elite, World Business Class or Premium Economy or Coach Class seats.","r":"Tray table latch must be operational if not operational use NEF 25-21-26. Must not present hazard to passengers or crew or impede emergency egress."},{"n":"25-21-26","d":"Coach Class Passenger Seat Tray Table Inop","o":"Disregard the ATA description code. This NEF code applies to Coach Class passenger seats only.\\n\\nWhen a meal tray table must be removed: 1. Part must be tagged with the MPN, AC #, and removal location 2. Part must be secured in the MCO pouch and documented in the log deferral 3. Email must be sent to Cabin Maintenance (cabin.mtc@delta.com) notifying of the meal tray removal and include the log page as reference This will help ensure parts are recovered and held until a permanent repair can be accomplished.","r":"Critical notes\\n\\nAccomplish ER/A 525535-14MA Rev C to install an INOP cover to secure the tray table and arms. INOP cover MPN 34000019// 56-2500-3-1248 . Cover must keep the Tray table completely closed. Must not present a hazard to passengers or crew or impede emergency egress.\\n\\nIf INOP cover is not available, tray table and arms MUST be removed. Must not present a hazard to passengers or crew or impede emergency egress."},{"n":"25-21-27","d":"Passenger Seat Tray Table Cosmetic Damage","o":"Disregard the ATA description code. This NEF code applies to all passenger seats; First Class, Business Elite, World Business Class or Premium Economy or Coach Class seats.","r":""},{"n":"25-21-28","d":"Passenger Seat Under Seat Component Covers Damaged / Loose","o":"Disregard the ATA description code. This NEF code applies to all passenger seats; First Class, Business Elite, World Business Class or Premium Economy or Coach Class seats.","r":"Wires must be secured and cover/wires must not present hazard to passenger. Component covers must be present."},{"n":"25-21-30","d":"Passenger Seat Armrest Cover Damaged or Missing - Coach Only","o":"For Damaged / Inop Armrest See MEL. For B/E & F/C seats see NEF 25-28-10 -\\r\\nPassenger Seat Armrest Cover / Trim Damaged or Missing - B/E & F/C only.\\r\\n\\r\\nThis FRC replaced 25-21-08.","r":"Must not present hazard to passengers or crew."},{"n":"25-21-31","d":"Inseat Video Monitor Trim Damaged / Missing","o":"This item has a allowable limit of 365 days","r":"Must not present hazard to passengers or crew or impede emergency egress."},{"n":"25-21-32","d":"Passenger Seat Headrest Broken","o":"","r":"Headrest assembly must be secure and follow the contour of the seat back. Must not present hazard to crew or impede emergency egress and the seat must be usable."},{"n":"25-21-33","d":"Passenger Seat Literature Pocket Spring Damaged/Missing","o":"Disregard the ATA description code. This NEF code applies to all passenger seats; First Class, Business Elite, World Business Class or Premium Economy or Coach Class seats.","r":"The literature pocket must be able to hold the required passenger safety material for the seat."},{"n":"25-21-34","d":"Passenger Seat Armrest Cover/Trim Worn/Cosmetic Damage/Incorrect Color","o":"Disregard the ATA description code. This NEF code applies to all passenger seats; First Class, Business Elite, World Business Class or Premium Economy or Coach Class seats. Allowable time limit for this NEF is 365 days . \\n\\nThis FRC replaced 25-21-08.","r":""},{"n":"25-21-35","d":"Inseat Video Arms Damaged / Inoperative","o":"","r":"(M) Procedure Required:\\n\\n1. Disconnect, cap and stow monitor harness at Seat Electronics Box for affected monitor per AMM.\\n\\nThe flight crew can reference this deactivation procedure in the EFM procedures section."},{"n":"25-21-36","d":"Passenger Seat Headrest Cover Missing/Torn","o":"Disregard the ATA description code. This NEF code applies to all passenger seats; First Class, Business Elite, World Business Class or Premium Economy or Coach Class seats.","r":""},{"n":"25-21-37","d":"Passenger Seat Headrest Damaged/Torn","o":"Disregard the ATA description code. This NEF code applies to all passenger seats; First Class, Business Elite, World Business Class or Premium Economy or Coach Class seats.","r":""},{"n":"25-21-38","d":"Passenger Seat Tray Book Holder Damaged","o":"Some aircraft configurations now have a book holder built into the tray table, with a flip up holder.","r":"Damage must not be to an extent that it leaves an opening that items could fall into or that would be a security concern."},{"n":"25-21-39","d":"Passenger Seat Trim Damaged/Missing","o":"This FRC replaced 25-20-11.","r":"Must not present hazard to passengers or crew or impede emergency egress."},{"n":"25-21-40","d":"Passenger Seat Foot Rest Cover Damaged/Torn","o":"Disregard the ATA description code. This NEF code applies to all passenger seats; First Class, Business Elite, World Business Class or Premium Economy or Coach Class seats.","r":""},{"n":"25-21-41","d":"Passenger Seat Headrest Cover Worn","o":"Disregard the ATA description code. This NEF code applies to all passenger seats; First Class, Business Elite, World Business Class or Premium Economy or Coach Class seats.","r":""},{"n":"25-21-42","d":"Passenger Seat Foot Rest Cover Worn","o":"","r":""},{"n":"25-21-44","d":"Passenger Seat LEATHER Literature Pocket Damaged/Torn","o":"Disregard the ATA description code. This NEF code applies to all passenger seats that have LEATHER literature seat pockets; First Class, Business Elite, World Business Class or Premium Economy or Coach Class seats.This NEF item has a 365 day allowable time limit.","r":""},{"n":"25-21-45","d":"Passenger Seat LEATHER Literature Pocket Worn","o":"Disregard the ATA description code. This NEF code applies to all passenger seats that have LEATHER literature pockets; First Class, Business Elite, World Business Class or Premium Economy or Coach Class seats.","r":""},{"n":"25-21-46","d":"Passenger Seat Cushions/Covers Damaged/Torn","o":"If torn, may need to apply MEL for inoperative seat. For this item if it is or torn, replace at next available overnight. Disregard the ATA description code. This NEF code applies to all passenger seats; First Class, Business Elite, World Business Class or Premium Economy or Coach Class seats. \\n\\nThis FRC replaced 25-21-12.","r":""},{"n":"25-21-48","d":"Seat Belt Extension Storage Pouch Missing/Damaged.","o":"This item is for the seat belt extension storage pouch. Use item 25-21-17 for missing seat belt extensions.","r":"Ensure that the seat belt extensions can be stowed securely in the same compartment that the seat belt extension storage pouch is/should be located in."},{"n":"25-21-58","d":"Delta One Seat Land Control Inoperative","o":"The \"Land\" control allows the seat to fully retract to the full upright postion with one control. Other seat controls can be used to perform the same function as the land control. Disregard the ATA description code, this NEF code applies to Delta One seats.","r":"All other seat controls must work normally except for the \"Sleep\" control."},{"n":"25-21-60","d":"Delta One Sleep Control Inoperative","o":"The \"Sleep\" control allows the seat to fully recline with one control. Other seat controls can be used to perform the same function as the sleep control. Disregard the ATA description code, this NEF code applies to Delta One seats.","r":"All other seat controls must work normally except for the \"Land\" control."},{"n":"25-21-67","d":"Delta One Suite - SECONDARY PCU Inoperative - Recline/Foot Rest Controls (A350/B777/B764)","o":"Secondary Passenger Control Unit (PCU) is the small lower PCU.","r":"Delta One Suite SECONDARY PCU may be inoperative provided:\\n- Primary PCU is operative,\\n- All recline/lumbar/foot rest/lighting features are operative or deferred via the applicable MEL/NEF,\\n- No damaged wires or exposed EWIS, and\\n- No sharp edges or hazards to personnel."},{"n":"25-21-70","d":"Seatbelt TSO Tags Worn or Missing","o":"","r":"For seat belt TSO tag only. Do not use for any other discrepancies on the seat belt. The deferred seatbelt may remain installed, but once the seatbelt is removed, the seatbelt is not authorized for re-installation without a TSO tag. This NEF is only authorized for seatbelts currently installed on-wing."},{"n":"25-22-01","d":"Cabin Window Shade Stuck / Damaged / Missing (NOT FOR OVER WING EXIT SHADE)","o":"DO NOT USE ON OVERWING EXIT SHADES- SEE BELOW. CAUTION WHEN USING NEF ON CREW REST RESTS- SEE BELOW\\n\\nOver wing exit shades are to be deferred under NEF 25-22-11. Due to 14 CFR 25.809( Emergency exit arrangement) the over wing exit shade must not be stuck closed. If these shades are stuck in the closed position, the shade must be removed.*\\n \\n\"IF SHADE IS REMOVED OR MISSING AT A CREW REST SEAT, FWD THE SEAT TO MEL\" CONTACT MCC FOR CREW REST SEAT LOCATIONS","r":"DO NOT USE ON OVERWING EXIT SHADES- SEE BELOW. CAUTION WHEN USING NEF ON CREW REST RESTS- SEE BELOW\\n\\nOver wing exit shades are to be deferred under NEF 25-22-11. Due to 14 CFR 25.809( Emergency exit arrangement) the over wing exit shade must not be stuck closed. If these shades are stuck in the closed position, the shade must be removed.*\\n \\n**\"IF SHADE IS REMOVED OR MISSING AT A CREW REST SEAT, FWD THE SEAT TO MEL\" CONTACT MCC FOR CREW REST SEAT LOCATIONS"},{"n":"25-22-03","d":"Sidewall Panel Damaged","o":"This NEF item has a 365 day allowable time limit.\\n\\nThis NEF does not include the cabin decompression flaps on 330 Dado panels. The center decompression flaps must be closed with no gaps. If panel has been actuated, it can be reset per A330 AMM.","r":"Damage must not be to an extent that it leaves an opening that items could fall into or that would be a security concern."},{"n":"25-22-05","d":"Wall Covering Torn, Damaged or Missing","o":"This NEF item does not include return air grills.\\n\\nThis NEF does not include the cabin decompression flaps on 330 Dado panels. The center decompression flaps must be closed with no gaps. If panel has been actuated, it can be reset per A330 AMM.\\n\\nThis NEF item has a 365 day allowable time limit.","r":"Damage must not be to an extent that it leaves an opening that items could fall into or that would be a security concern."},{"n":"25-22-06","d":"Window Cover Trim Damaged","o":"","r":"Damage must not be to an extent that it leaves an opening that items could fall into or that would be a security concern."},{"n":"25-22-07","d":"Window Cover Trim Missing","o":"This NEF item has a 10 day allowable time limit. If the window shade is missing use NEF 25-22-01 - Cabin Window Shade Stuck / Damaged / Missing.","r":"If window trim cover is missing and leaves hole exposed, inspect for foreign objects then cover with suitable pressure sensitive tape (i.e. bag bin tape, nylon or fiberglass reinforced tape, not masking tape)."},{"n":"25-22-08","d":"Overhead / Wall Mounted Video Monitor Trim Damaged","o":"This NEF item has a 365 day allowable time limit.","r":""},{"n":"25-22-10","d":"Cabin Lower Sidewall Panel Connecting Strip Damaged/Missing","o":"The connector is the vertical plastic trim that goes between the cabin lower sidewall panels. Cabin lower sidewall panels are also called carpet risers.","r":"The cabin lower sidewall panels must be secure and there must be no gaps between the panels."},{"n":"25-22-11","d":"Overwing EXIT WINDOW(ONLY) Shade Stuck OPEN / Damaged / Missing(Placard needed for 767-300 only see deferral remarks)","o":"NEF USE IS FOR OVERWING EXIT ONLY. SHADE MUST NOT BE STUCK CLOSED -SEE BELOW. DO NOT USE NEF FOR ANY OTHER CABIN SHADE. All other cabin locations are to be deferred under NEF 25-22-01.\\n\\nREGULATORY REQUIREMENT\\n14 CFR 25.809 states \\u001Aeach emergency exit must have means to permit viewing of the conditions outside the exit when the exit is closed\\u001A. To comply with this regulation, this NEF prohibits the deferral of an overwing exit shade stuck in the closed position. If overwing exit window shades are stuck in the closed position, the shade must be removed prior to using this NEF deferral.","r":"For 767-300 only a placard MPN 11-1158-501 (stk # 00-0812-3-4910 ) must be installed on each location that this NEF is used. If placard is not in stock in station please reference ERA 573465-14MA for placard replication. Location of placard can be placed any where on the exit door that is not on an existing placard and not on the clear plastic/ shade itself. The placard location must be noticeable for the passenger, crew, and maintenance for easy identification when the item is on deferral and when cleared."},{"n":"25-23-04","d":"Seat Track Covers Damaged, Loose or Missing","o":"","r":"Any Exposed Wiring Must Be Protected. Must not present hazard to passengers or crew or impede emergency egress."},{"n":"25-23-05","d":"Cabin E/E Hatch Cover Trim Poor Condition/Damaged/Missing","o":"This NEF item has a 10 day allowable time limit. Blue and white security tamper-evident security seal part number 0412-20248 may be used.","r":"If the trim is in poor condition, secure the trim and defer for later replacement. If the trim is damaged and cannot be reinstalled or is missing, apply tamper-evident security seal to prevent unauthorized access between one side of the E/E compartment door and the floor."},{"n":"25-23-07","d":"Cabin Carpet (Other than Aisle and Cross-Aisle) Worn/Torn/Frayed/Missing(For gum or soiled use CTL 25-23-06)","o":"For aisle and cross-aisle carpet use NEF code 25-23-10. This code is for all cabin carpet except aisle and cross-aisle carpet.\\n\\nFor flight deck flooring reference NEF 25-10-53 - Deck Floor Coverings Worn / Damaged / Missing.\\n\\nFor any dirty Carpet (soiled/Gum) use CTL 25-23-06.\\n\\nThis FRC replaced 25-23-01.This NEF item has a 365 day allowable time limit.","r":"May be worn, frayed, torn, damaged, loose, missing (must not present hazard to pax/crew or impede emergency egress)."},{"n":"25-23-08","d":"Lavatory Flooring Damaged/Worn","o":"For flight deck flooring reference NEF 25-10-53 - Deck Floor Coverings Worn / Damaged / Missing.\\n\\nThis FRC replaced 25-23-01.This NEF item has a 365 day allowable time limit.","r":"May be worn, frayed, torn, damaged, loose, missing (must not present hazard to pax/crew or impede emergency egress)."},{"n":"25-23-09","d":"Vinyl Flooring Damaged/Worn/Missing","o":"Vinyl flooring is used in the galley and entry ways. Also known as NTF.\\n\\nFor flight deck flooring reference NEF 25-10-53 - Deck Floor Coverings Worn / Damaged / Missing.\\n\\nThis FRC replaced 25-23-01.This NEF item has a 365 day allowable time limit.","r":"May be worn, frayed, torn, damaged, loose, missing (must not present hazard to pax/crew or impede emergency egress)."},{"n":"25-23-10","d":"Cabin Carpet (Aisle and Cross-Aisle) Worn/Torn/Frayed/Missing(For gum or soiled use CTL 25-23-06)","o":"This code is for the cabin aisle and cross-aisle carpet only. For all other cabin carpet use NEF code 25-23-07.\\n\\nFor flight deck flooring reference NEF 25-10-53 - Deck Floor Coverings Worn / Damaged / Missing.\\n\\nFor any dirty Carpet (soiled/Gum) use CTL 25-23-06.\\n\\nThis FRC and 25-23-07 replaced 25-23-01.This NEF item has a 365 day allowable time limit.","r":"May be worn, frayed, torn, damaged, loose, missing (must not present hazard to pax/crew or impede emergency egress)."},{"n":"25-23-13","d":"B767 Secondary Escape Hatch Edge Trim Damaged/Missing","o":"This applies only to the B767-300/400. Lower Lobe Crew Rest (LLCR) Secondary Escape Hatch plastic carpet-edge trim pieces (P/N 17230AA, installed by ER/A 523335-14MA) may be degraded or missing, so long as there is no interference with hatch operation, and the broken edges do not pose a hazard to passengers or crew.","r":"Applicable only for P/N 17230AA Trim Assy (post-ER/A 523335-14MA)\\n\\u001A Verify
