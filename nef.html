 no tape, carpet, or other obstructions are installed across gap between the LLCR Secondary Escape Hatch and Floor Structure\\n\\u001A Verify edges of carpet are secure and not a trip hazard\\n\\u001A Accomplish an Operational Check of the LLCR Hatch per AMM 25-29 prior to deferral"},{"n":"25-24-01","d":"Cabin Curtain Tiebacks Damaged or Missing","o":"","r":"May be worn, frayed, torn, damaged, loose, missing (must not present hazard to pax/crew or impede emergency egress). If tieback is missing secure curtains open or remove and store in closet."},{"n":"25-24-03","d":"Direct View bulkhead Window - 757 NBA Config/330 only","o":"This NEF item applies only to the 757 NBA/330 only configured aircraft that have Direct View bulkhead Window.","r":"May be inoperative in open position or with window removed. To remove window:\\n\\n1. Remove 4 mounting screws from window frame and remove frame.\\n2. Remove window from the divider.\\n3. Re-install frame and mounting screws into divider.\\n4. Placard window \"MUST REMAIN WITH AIRPLANE\" and stow in available closet."},{"n":"25-24-04","d":"Cabin Dividers/Curtains Frayed/Worn","o":"This FRC replaces 25-24-02.","r":"Must not present hazard to pax/crew or impede emergency egress.\\n\\nAny emergency exit markings, instructions and/or signs must be present and legible on cabin dividers or curtains. If emergency exit markings, instructions and/or signs are missing, do not defer to NEF, contact the MCC."},{"n":"25-24-05","d":"Cabin Dividers/Curtains Damaged/Loose/Torn/Missing (Missing Dividers N/A to B717)","o":"This FRC replaces 25-24-02.","r":"DO NOT REMOVE CABIN DIVIDERS FROM B717 AIRCRAFT. CONTACT MCC IF MISSING AND DO NOT DEFER USING THIS NEF **** \\nFor Crew Rest Curtains, check the applicable MEL for relief*\\nMust not present hazard to pax/crew or impede emergency egress.\\nAny emergency exit markings,instructions and/or signs must be present and legible on cabin dividers or curtains. Pay particular attention to B717.\\nMarkings/placards are to be verified prior to removal of any part. If emergency exit markings, instructions and/or signs are missing, DO NOT DEFFER to NEF contact the MCC. \\nIf divider to be removed contains non-FAA required placards a second NEF(11-30-11) must be made."},{"n":"25-24-08","d":"L4 Lavatory Privacy Partition Retention Straps (764 ONLY)","o":"","r":"Ensure locking mechanism for securing the privacy partitions are functional."},{"n":"25-25-02","d":"Aft Flight Attendant Seat Deployment Assist Handle Damaged / Missing (B717 Only)","o":"Applicable to the convenience handles installed on the seat pan per AA 2520-01906 which helps the flight attendant deploy the seat.","r":"Verify the seat pan can still be deployed with a reasonable amount of force without the secondary seat deployment handle."},{"n":"25-25-04","d":"Flight Attendant Seat Trim/Covering Damaged/Torn/Missing","o":"This FRC to be replaced by 25-25-09, 25-25-10, 25-25-12 and 25-25-13 when EFM rev 2 is published and boarded on all fleets.","r":""},{"n":"25-25-10","d":"Flight Attendant Jumpseat Trim Damaged/Torn/Missing","o":"Reference NEF 25-25-09 for Flight Attendant seat cushions and coverings.","r":"Must not present hazard to passengers or crew or impede emergency egress."},{"n":"25-25-12","d":"Flight Attendant Jumpseat Cushions and Coverings Damaged/Torn","o":"Includes Flight Attendant headrest cover and cushion. Reference NEF 25-25-10 for Flight Attendant Seat Trim Damaged/Torn/Missing.\\r\\n\\r\\nThis FRC to replace 25-25-09 when EFM rev 2 is published and boarded on all fleets.","r":""},{"n":"25-25-13","d":"Flight Attendant Jumpseat Cushions and Coverings Worn","o":"Includes Flight Attendant headrest cover/cushion (ALL FLEETS), and cushion inserts (A350). \\n\\nReference NEF 25-25-10 for Flight Attendant Seat Trim Damaged/Torn/Missing.","r":""},{"n":"25-26-01","d":"Attendant Storage Box Cosmetic Damage","o":"More than cosmetic damaged covered by MEL.","r":""},{"n":"25-26-02","d":"Closet Door Assist Spring Broken - Door still usable","o":"","r":""},{"n":"25-26-04","d":"Closet Door Handle Hard to Turn - Still Operational","o":"","r":""},{"n":"25-26-11","d":"Stowage Bin / Trim / Decorative Laminate / Cosmetic Damage","o":"Cosmetic damage to bonded trim details and decorative laminate ONLY, otherwise see MEL. Damaged trim/decorative laminate must not pose a hazard to passengers or crew. Acceptable to cut/remove loose sections. Smooth any sharp edges. Application of 3M 398FRP fiberglass tape is acceptable to smooth edges (tape must not interfere with bin operation; do not exceed 1 sq ft of tape at any location).","r":"Damaged trim/decorative laminate must not pose a hazard to passengers or crew. Acceptable to cut/remove loose sections. Smooth any sharp edges. Application of 3M 398FRP fiberglass tape is acceptable to smooth edges (tape must not interfere with bin operation; do not exceed 1 sq ft of tape at any location)."},{"n":"25-26-12","d":"Stowage Bin Latching Mechanism Out of Adjustment - Still Operational","o":"","r":"Latch must still operate. For inop latch or quarter turn lug see MEL."},{"n":"25-26-13","d":"Stowage Bin Snubber Damaged or Missing(not for 319/320/321)","o":"Can not use NEF on 319/320/321 over head bin doors due to free falling doors and injuries.\\n\\nAffected overhead bin should be considered operational and may be used. For overhead bins that are inoperative, refer to the applicable MEL.","r":""},{"n":"25-26-14","d":"Closet Door Hold Open Latch/Catch Damaged/Inoperative","o":"","r":"Must not present hazard to passengers or crew or impede emergency egress. Door must stow properly"},{"n":"25-26-15","d":"Video Control Unit Door Damaged/Missing","o":"","r":""},{"n":"25-26-17","d":"Overhead Bin Auxiliary Bin Stop (A319, A320 Only)","o":"Applicable to A319 and A320 post AA 2500-01771 and AA 2500-01772 only.This NEF item has a 365 day allowable time limit.","r":"1. If a section of the bin stop is remaining, trim loose sections as required to remove any sharp edges. If the entire section is missing, no maintenance action is required.\\r\\n2. Clean surface per P.S. 900-1, No. 07 using isopropyl alcohol. Wipe dry before it evaporates. Do not use MEK or MPK.\\r\\n3. Apply 3M 398 FR tape over any loose sections that were trimmed in step 1. Ensure tape overlaps at least 1 onto the bin stop and at least 1 onto the bin. Due to flammability requirements, only 3M 398 FR tape is allowed for use."},{"n":"25-26-19","d":"Overhead Bin Lift Assist system components (767-400 POST MOD only)","o":"","r":"Wire Damage\\n1. Troubleshoot system per 16D12W32000 B767-400 WDM Supplement Section 25-25-05, if any wire damage (chafed, exposed or otherwise damage) is identified, coil and stow wire in accordance with D6-54446 707, 727 Through 787 SWPM Chapter 20-10-11 Paragraph 17 and 18 at the damage location.\\n2. Ensure the remainder of the system is operating normally.\\n\\nElec. Component Damage\\n1 Troubleshoot system per 16D12W32000 B767-400 WDM Supplement 25-25-05, until a component is identified as the root cause.\\n2. For the Bin Assist System: Pull and Collar C/B C9879, on the P34 Aux Power Panel, reference 16D12W32000 B767-400 WDM Supplement 25-25-05 and D6-54446 707, 727 Through 787 SWPM 20-00-10.\\n3. Note the component damaged, including EIN and location in the NEF log page.\\n\\nMech. Component Damage\\nVerify no sharp edges or hazards. Verify no binding or interference with bin operation and no damage to aircraft or bin structure. Contact engineering if disconnection or removal instructions are req'd"},{"n":"25-26-20","d":"Overhead Bin Lift Assist System Components (767-300 POST MOD only)","o":"The Bin Lift Assist system installed via AA 2526-01293 / 2500-01823 for B767-300 A/C 180-199, 1200-1201, 1601-1606, 1701-1708 in the passenger cabin may be missing/inoperative. \\n\\nNOTE: The 22\\u001A center OVHD bins have not been modified to install lift assist.","r":"Wire Damage\\n1. Troubleshoot per 18D07R009WDM, B767-300 WDM Supplement Sect. 25-28-07, if any wire damage (chafed, exposed or otherwise damage) is identified, cut out damage and coil and stow wire IAW D6-54446 707, 727-787 SWPM Chapter 20-10-11 Para 18 and 19 at the damage location.\\n2. Ensure the remainder of the system is operating normally.\\nElec. Component Damage\\n1. Troubleshoot per 18D07R009WDM, B767-300 WDM Supplement Sect. 25-28-07, until a component is identified as the root cause.\\n2. For the Bin Assist System: Pull and Collar C/B C9910, on the P87 FWD LEFT MISC EQUIP PNL, reference 18D07R009WDM, B767-300 WDM Supplement Sect. 25-28-07 and D6-54446 707, 727-787 SWPM 20-00-10.\\n3. Note the component damaged, including EIN and location in the NEF log page.\\nMech. Component Damage\\n1. Verify no sharp edges or hazards. Verify no binding or interference with bin operation. Verify no damage to aircraft or bin structure. If disconnection or removal is req'd, contact Dept 555."},{"n":"25-26-21","d":"Overhead Bin Lift Assist System (737-900 ONLY)","o":"Overhead bin lift assist system installed in the passenger cabin may be missing or inoperative (737-900 ONLY).\\n\\nAffected overhead bin should be considered operational and may be used. For overhead bins that are inoperative, refer to the applicable MEL.","r":"Associated bin must close and latch manually. Verify no sharp edges or hazards. Verify no binding or interference with bin operation. Verify no damage to a/c or bin structure."},{"n":"25-26-22","d":"A321NEO Bin Closing Tool Missing/Damaged","o":"","r":""},{"n":"25-26-23","d":"Overhead Bin Lift Assist System - A350 A/C","o":"May be missing or inoperative. This NEF is NOT applicable to electrical aspects of the bin lift assist system. This NEF should not be used to defer damage to the bin structure (i.e. strongback, bucket). If the bin structure is damaged, reference the MEL.","r":"Verify no sharp edges or hazards. Verify no binding or interference with bin operation. Verify no damage to aircraft or bin structure. Contact Liaison Engineering if disconnection or removal instructions are required."},{"n":"25-27-01","d":"Cabin Flight Attendant Panel Door Magnet Weak","o":"","r":""},{"n":"25-27-03","d":"Passenger Notice System Sign in Poor Condition","o":"This NEF item has a 365 day allowable time limit.","r":"The lens cover must be intact and not cracked or damaged. This NEF is only for the marking on the lens. The associated passenger seat or lavatory must have a legible NO SMOKING / FASTEN SEAT BELT / RETURN TO CABIN sign that is readily available."},{"n":"25-27-04","d":"Passenger to Flight Attendant Call Light Inop","o":"This NEF does not cover the Lavatory Call Light Smoke Detected Function on 767-300/400 aircraft. see the MEL to defer this function. \\n\\nThis NEF item cannot be applied on the A350. Please refer to the A350 MEL for relief related to Passenger Call Lights. \\n\\nThe FAA has rescinded policy letter MMEL PL-128, Wheelchair Accessible Lavatories. Any and all restrictions which identified as more restrictive then the MMEL relief requirements have in regards to wheelchairs accessible lavatories have been removed.","r":""},{"n":"25-27-05","d":"PSU Panel Minor Damaged but Functions Properly","o":"This NEF item has a 365 day allowable time limit.","r":""},{"n":"25-28-03","d":"Delta One Seat Lumbar Support Inop","o":"","r":""},{"n":"25-28-04","d":"Cocktail Tray Table Damaged","o":"","r":""},{"n":"25-28-05","d":"First / Business Class Seat Lumbar Function Inop (A330)","o":"","r":""},{"n":"25-28-07","d":"Fold Down Footrest Inoperative / Damaged / Missing","o":"This may be the footrest attached to the back of the seat in front of the passenger or the footrest attached to the affected seat.","r":"Not to be used on electrically operated seats. Footrest must stow in the upright position or must be secured in the upright condition for egress."},{"n":"25-28-08","d":"Portable Footrest Damaged","o":"","r":""},{"n":"25-28-09","d":"Airbag Seat Belt Leather Cover Worn","o":"This NEF is only for cosmetic issues only. Disregard the ATA description code. This NEF code applies to all passenger seats; First Class, Business Elite, World Business Class or Economy Comfort or Coach Class seats.","r":"The following criteria MUST be met:\\r\\n1. No airbag material can protrude past the end of the cover.\\r\\n2. No stitching may be broken.\\r\\n3. The cover cannot be torn or have any holes.\\r\\n\\r\\nIf the seat belt or seat belt cover is torn or damaged reference the appropriate manuals for serviceable limits and reference the MEL or manual to defer."},{"n":"25-28-10","d":"Passenger Seat Armrest Cover Damaged or Missing - Delta One / Prem Select","o":"For Damaged / Inop Armrest See MEL. For coach seats see NEF 25-21-30 - Passenger Seat Armrest Cover / Trim Damaged or Missing\\n\\nThis FRC replaced 25-21-08.","r":"Must not present hazard to passengers or crew."},{"n":"25-28-11","d":"Delta One suite privacy divider gas strut inop (A350/330-NEO/764 POST SUITE MOD only)","o":"Ensure the partition assembly common to the discrepant gas strut remains free from other signs of damage. For the 767-400/350 Ensure the partition can be locked in the open & closed positions and that the partition can be opened and closed properly. For the 767-400/330 NEO this NEF can be used for any portion of the Delta one privacy divider system as long as it can be locked in fully down or is all the way open.","r":"Ensure the partition assembly common to the discrepant gas strut remains free from other signs of damage. For the 350 Ensure the partition can be locked in the open & closed positions and that the partition can be opened and closed properly. For the 330 NEO this NEF can be used for any portion of the Delta one privacy divider system as long as it can be locked in fully down or is all the way open."},{"n":"25-28-12","d":"Delta One PCU Cosmetic Damage (A350 3568-3576, JSP001 Seats ONLY)","o":"Only applicable to cosmetic damage to the PCU on A350 ships 3568-3576, JSP001 seats.","r":"Verify that the symbol on the button that returns the seat to the upright condition is legible."},{"n":"25-28-13","d":"Delta One Seat Suite Door, Lower Magnet, A350 and A330-900 Thompson Delta One suites ONLY","o":"","r":""},{"n":"25-28-14","d":"Wireless Charging Module INOP (Delta One (BC) Vantage XL seats on AC 3520 and sub)","o":"","r":""},{"n":"25-28-16","d":"Passenger Seat Trim Damaged/Missing - Delta One/Prem Select","o":"","r":"Must not present hazard to passengers or crew or impede emergency egress."},{"n":"25-28-18","d":"PCU backlighting (A330-200/-300 fleets)","o":"Applicable to Cirrus and Thompson seat PCU's on the A330 -200/-300 fleets ONLY","r":""},{"n":"25-28-19","d":"D1/ Prem/ FC Passenger Tray Table Inop","o":"Disregard the ATA description code. This NEF code applies to Delta One, Premium Economy, or First Class passenger seats.\\n\\nWhen a meal tray table must be removed: 1. Part must be tagged with the MPN, AC #, and removal location 2. Part must be secured in the MCO pouch and documented in the log deferral 3. Email must be sent to Cabin Maintenance (cabin.mtc@delta.com) notifying of the meal tray removal and include the log page as reference This will help ensure parts are recovered and held until a permanent repair can be accomplished.","r":"*Critical notes\\n\\nAccomplish ER/A 525535-14MA Rev C to install an INOP cover to secure the tray table and arms. INOP cover MPN 34000019// 56-2500-3-1248 . Cover must keep the Tray table completely closed. Must not present a hazard to passengers or crew or impede emergency egress.\\n\\nIf INOP cover is not available, tray table and arms MUST be removed. Must not present a hazard to passengers or crew or impede emergency egress."},{"n":"25-29-01","d":"Bassinet Damaged","o":"","r":""},{"n":"25-29-02","d":"Bassinet Missing","o":"","r":""},{"n":"25-29-04","d":"Pedestal Table All Failure Modes Except Vertical Adjustment -757 NBA Config","o":"This NEF item applies only to the 757 NBA configured aircraft.","r":"(M) Procedure Required: Close table leafs and secure closed with leaf latches if available. If leaf latches are not available, secure table leafs closed with onboard strap. If unable to secure with onboard strap, defer the affected seats per MEL. Placard inoperative table \"Unserviceable - Do Not Use\". The flight crew can reference this deactivation procedure in the EFM procedures section."},{"n":"25-29-05","d":"Pedestal Table Vertical Adjustment - 757 NBA Config","o":"This NEF item applies only to the 757 NBA configured aircraft.","r":"(M) Procedure Required Install placard in logbook. Close table leafs and secure closed with leaf latches. Install table top pad and verify it is secure. Placard inoperative table \"Unserviceable - Do Not Use\". The flight crew can reference this deactivation procedure in the EFM procedures section."},{"n":"25-30-01","d":"Attendant Work Tables in Galley Damaged/Missing","o":"","r":"Must stow properly or must be secured or removed so as not to impede egress."},{"n":"25-30-02","d":"Cork Screws Damaged / Missing","o":"This NEF item has a 365 day allowable time limit.","r":""},{"n":"25-30-03","d":"Galley Cosmetic Trim / Wall coverings / Bumpers Damaged / Missing","o":"This NEF item has a 365 day allowable time limit.","r":"Damage must not be to an extent that it leaves an opening that items could fall into or that would be a security concern."},{"n":"25-30-04","d":"Galley Drain Screen or Cover Damaged / Missing","o":"","r":""},{"n":"25-30-05","d":"Galley Floor Covering Torn/Damaged/Missing","o":"This NEF item has a 365 day allowable time limit.","r":"Must not present hazard to passengers or crew."},{"n":"25-30-06","d":"Galley Utensils Damaged / Missing","o":"","r":""},{"n":"25-30-08","d":"Galley Door Hold Open Latch Damaged/Inoperative","o":"For A330 reference IPC 25-31-52-75 item 140 - chiller door holder assembly.","r":"Must not present hazard to passengers or crew or impede emergency egress. Door must stow properly"},{"n":"25-31-01","d":"GalleyGalley Counter / Counter Shelf Damaged (including dents)","o":"","r":"Must stow properly or must be secured so as not to impede egress. Damage must not affect the integrity of the structure and does not create any hazards to personnel (e.g. sharp edges)"},{"n":"25-31-02","d":"Counter Shelf Stuck","o":"","r":"Must stow properly or must be secured so as not to impede egress."},{"n":"25-31-04","d":"Galley Drawer Will Not Open / Hard to Open or Close","o":"Quarter Turn Latches are covered in MEL.","r":""},{"n":"25-31-09","d":"G2 Galley Countertop Disbonded (B737 only)","o":"This NEF is for the B737 G2 galley only (the forward galley area, aft module). The disbonding of the countertop may cause the bun warmer door to bind.","r":"Secure the counter top with tape and ensure that no sharp edges exist. Ensure that the bun warmer door does not bind."},{"n":"25-31-10","d":"Galley Cart Bay Side Latch Inop/Missing","o":"For 737-900 aircraft reference CMM 25-31-81 Fig 11 item 165, remote retainer assembly.","r":"Ensure primary (large latches) are operational. Install a placard at the cart bay that only full length carts may be used in that location."},{"n":"25-31-11","d":"Galley/Closet Container/Cart Extractor Damaged/Inoperative","o":"The galley container/cart extractor consists of a handle with cable or strap in a track with a bracket to pull out a container or cart in the aft portion of the storage bay. This NEF item has a 10 day allowable time limit.","r":"The most aft container or cart must remain empty with a placard that states EMPTY, DO NOT REMOVE on the container/cart in addition to a DO NOT USE placard around the extractor for that bay."},{"n":"25-32-01","d":"Cabin Step Stool Damaged / Missing","o":"","r":""},{"n":"25-32-02","d":"Galley Waste Compartment/Container Liner Missing/Damaged (NOT to be used for waste carts)","o":"Only one trash compartment liner is permitted to be missing from fixed locations. Item is NOT to be used for missing wheeled carts or liners as they are catering equipment.","r":"1. Ensure that the waste receptacle is empty and void of any waste material. \\r\\n2. Must not present hazard to passengers or crew.\\r\\n3. Flapper door and/or access door must be secured closed and placarded: Do not use. 3M 398FR tape can be used to secure the door closed."},{"n":"25-32-03","d":"Galley Cup Holders Damaged","o":"","r":""},{"n":"25-32-04","d":"Galley Document Clips Damaged / Missing","o":"","r":""},{"n":"25-32-05","d":"Galley Drawers Damaged / Corroded","o":"","r":""},{"n":"25-32-06","d":"Galley Drawers Missing","o":"","r":""},{"n":"25-32-07","d":"Galley Storage Compartment Minor Damage","o":"For INOP storage compartment see MEL.This NEF item has a 365 day allowable time limit.","r":""},{"n":"25-32-08","d":"Hot Plate Inoperative","o":"","r":"(M) Procedure Required:\\n1. Pull and secure associated circuit breaker. Observation of a smoke or overheat event requires additional inspection by Maintenance prior to placarding.\\n2. Placard Hot Plate \"Inoperative\". \\n\\nThe flight crew can reference this deactivation procedure in the EFM procedures section."},{"n":"25-32-09","d":"Lavatory Paper Towel Holders Damaged","o":"","r":"Damage must not be to an extent that it leaves an opening that items could fall into or that would be a security concern."},{"n":"25-32-10","d":"Lavatory Sanitizer Dispensers Damaged","o":"","r":"Damage must not be to an extent that it leaves an opening that items could fall into or that would be a security concern."},{"n":"25-32-11","d":"Miscellaneous Cabin Forms Need Replenishing","o":"","r":""},{"n":"25-32-12","d":"Miscellaneous Galley Supplies Need Replenishing","o":"","r":""},{"n":"25-32-13","d":"Fire Containment Bag/Gloves Missing/Damaged(NOT FOR GLOVES ON AIRBUS PLANES)","o":"A319/320/321/330/350 fire containment gloves are located in the MEL. This NEF is still active for the fire containment bags on all fleets.This item is applicable to post AA 2560-01539 aircraft which installs fire containment bags and fire gloves on the aircraft. This item can be used for any number of bags or gloves in any combination.This NEF item has a 10 day allowable time limit.","r":"A319/320/321/330/350 fire containment gloves are located in the MEL. This NEF is still active for the fire containment bags on all fleets. If containment bag seal has failed but the kit has not been opened, perform weight check per AMM 25-60-06. If the weight check passes, the bag is within AMM limits and deferral to NEF is not permitted."},{"n":"25-32-14","d":"Galley Soap Dispenser","o":"","r":""},{"n":"25-33-01","d":"Chilled Air Temperature Gauges Inoperative","o":"","r":""},{"n":"25-33-02","d":"Chiller Inoperative / Damaged - EXCEPT A350","o":"Reference NEF 21-59-xx for the A350. Contact MCC to apply SPL-item 21-59-00.","r":"(M) Procedure Required:\\n1. Pull and secure associated circuit breaker. Observation of a smoke or overheat event requires additional inspection by Maintenance prior to placarding.\\n2. Placard Chiller \"Inoperative\". \\n\\nThe flight crew can reference this deactivation procedure in the EFM procedures section."},{"n":"25-33-03","d":"Chiller Shelf Clip Missing","o":"","r":""},{"n":"25-33-05","d":"Galley Freezer Inoperative","o":"","r":"(M) Procedure Required:\\n1. Pull and secure associated circuit breaker. Observation of a smoke or overheat event requires additional inspection by Maintenance prior to placarding.\\n2. Placard Freezer \"Inoperative\". \\n\\nThe flight crew can reference this deactivation procedure in the EFM procedures section."},{"n":"25-33-06","d":"Thermos Units Damaged / Missing","o":"","r":""},{"n":"25-33-07","d":"Galley Chiller Air Distribution System - Cart Air Flaps and Chilled Compartments Damaged","o":"If a chiller cart air flap is missing, damaged, broken or stuck open, air will continue to flow and may degrade chiller ability to chill food if cart is not present.","r":"For a damaged or inoperative chiller cart air flap assembly, secure the flap assembly of loose parts and tape opening to prevent loss of chiller air into galley as needed. Placard Chilling Compartment 'Inoperative'."},{"n":"25-34-01","d":"Oven Door / Secondary Latch Damaged","o":"","r":"Door knob must latch securely. This NEF cannot be used if the door will not latch securely closed."},{"n":"25-34-02","d":"Oven -includes oven timers Damaged / Inoperative","o":"C series Oven circuit breakers are electronic. Improper lockout can cause possible ODI's due to reactivation at next electrical power reset. That's why it is imperative to confirm the CB's are LOCKED AND NOT JUST OUT. \\n\\nG1 Galley Oven -GLY 1 EQPT 1- Virtual Electronic C/B # CDC4-13-1","r":"M) Procedure Required:\\n\\n1. Pull and secure associated circuit breaker. Observation of a smoke or overheat event requires additional inspection by Maintenance prior to placarding.( For C series NEF Deactivate an inoperative Oven as follows: On the CB electronic synoptic page, set the following applicable circuit breaker to OUT and LOCK (refer to AMP TASK BD500?-A?- J24?00-?00-?06AAA-?398D-?A):\\n2. Placard Oven \"Inoperative\".\\nThe flight crew can reference this deactivation procedure in the EFM procedures section."},{"n":"25-35-01","d":"Bun Warmer / Warming Compartment Damaged / Inoperative","o":"","r":"(M) Procedure Required:\\n\\n1. Pull and secure associated circuit breaker. Observation of a smoke or overheat event requires additional inspection by Maintenance prior to placarding.\\n2. Placard Bun Warmer \"Inoperative\".\\n\\nThe flight crew can reference this deactivation procedure in the EFM procedures section."},{"n":"25-36-01","d":"Brewing Pot Damaged / Missing","o":"","r":""},{"n":"25-36-02","d":"Coffee Maker Damaged / Inoperative","o":"EXPRESSO MAKERS ARE ALSO VALID UNDER THIS NEF. \\nC series Coffee maker circuit breakers are electronic. Improper lockout can cause possible ODI's due to reactivation at next electrical power reset. That's why it is imperative to confirm the CB's are LOCKED AND NOT JUST OUT. \\nG1 Galley Coffee maker-GLY 1 EQPT 2 - Virtual Electronic C/B # CDC4-11-1\\nG4 Galley Coffee maker-GLY 4 EQPT 5 - Virtual Electronic C/B # CDC5-16-1 :Compartment A403 (Inboard)\\nG4 Galley Coffee maker-GLY 4 EQPT 6 - Virtual Electronic C/B # CDC5-6-1 : Compartment A402 (outboard)","r":"(M) Procedure Required:\\n1. Pull and secure associated circuit breaker. Observation of a smoke or overheat event requires additional inspection by Maintenance prior to placarding.( For C series NEF Deactivate an inoperative Coffee maker as follows : On the CB electronic synoptic page, set the following applicable circuit breaker to OUT and LOCK (refer to AMP TASK BD500?-A?-J24?00-?00-?06AAA-?398D-?A):\\n2. If leaking, shut off associated water supply.\\n3. Placard Coffee Maker \"Inoperative\". \\nThe flight crew can reference this deactivation procedure in the EFM procedures section."},{"n":"25-36-03","d":"Coffee Maker Hot Water Spigot Inoperative","o":"","r":""},{"n":"25-36-04","d":"Coffee Maker Leaking","o":"C series Coffee maker circuit breakers are electronic. Improper lockout can cause possible ODI's due to reactivation at next electrical power reset. That's why it is imperative to confirm the CB's are LOCKED AND NOT JUST OUT. \\n\\nG1 Galley Coffee maker-GLY 1 EQPT 2 - Virtual Electronic C/B # CDC4-11-1\\nG4 Galley Coffee maker-GLY 4 EQPT 5 - Virtual Electronic C/B # CDC5-16-1 :Compartment A403 (Inboard)\\nG4 Galley Coffee maker-GLY 4 EQPT 6 - Virtual Electronic C/B # CDC5-6-1 : Compartment A402 (outboard)","r":"(M) Procedure Required:\\n1. Pull and secure associated circuit breaker. Observation of a smoke or overheat event requires additional inspection by Maintenance prior to placarding.( For C series NEF Deactivate an inoperative Coffee maker as follows : On the CB electronic synoptic page, set the following applicable circuit breaker to OUT and LOCK (refer to AMP TASK BD500?-A?-J24?00-?00-?06AAA-?398D-?A):\\n2. Shut off associated water supply.\\n3. Placard Coffee Maker \"Inoperative\".\\nThe flight crew can reference this deactivation procedure in the EFM procedures section."},{"n":"25-36-05","d":"Coffee Maker Light Inoperative","o":"","r":""},{"n":"25-36-06","d":"Coffee Maker Tray Missing","o":"","r":""},{"n":"25-36-08","d":"Water Boiler Inoperative","o":"","r":"M) Procedure Required:\\n\\n1. Pull and secure associated circuit breaker. Observation of a smoke or overheat event requires additional inspection by Maintenance prior to placarding.\\n2. If leaking, shut off associated water supply.\\n3. Placard Water Boiler \"Inoperative\".\\nThe flight crew can reference this deactivation procedure in the EFM procedures section."},{"n":"25-38-01","d":"Cabin Cart Tie Down Damaged / Inoperative","o":"","r":"Must be secured."},{"n":"25-38-02","d":"3 tier Collapsible Trolley Damaged","o":"","r":""},{"n":"25-40-01","d":"Diaper Changing Table Damaged","o":"","r":"Verify that table still stows properly or secure table in stowed position."},{"n":"25-40-03","d":"Lower Vanity Access Door/Shroud Damaged/Missing (B737-900 Only, See notes)","o":"Applicable only to B737-900 Delta ship numbers listed below:\\n\\n3801-3848 when modified by AA 2540-01324, Lower Vanity Door/Shroud Retrofit.\\n3849 and subsequent - These ships were modified during production.\\n3931-3963 POST AA 2500-01847 \\n\\nThis deferral is only applicable to the lower vanity outer cosmetic door/shroud. If the lavatory trash access door is damaged or the fire seal of the lavatory trash compartment is compromised, use MEL 25-00-22B.","r":"Inspect lavatory trash access door for proper operation and fire seal integrity. If any discrepancies are found with the lavatory trash access door, use MEL 25-00-22B.\\n\\nRemove lower vanity door/shroud or secure closed with pressure sensitive tape.\\nIf door/shroud is removed, send to Atlanta Midfield / Department 206."},{"n":"25-40-05","d":"Lavatory Coat Hook Damaged / Missing","o":"","r":""},{"n":"25-40-06","d":"Lavatory Cup Holder Damaged / Missing","o":"","r":""},{"n":"25-40-07","d":"Lavatory Deodorizer Holder Damaged or Missing","o":"","r":""},{"n":"25-40-08","d":"Lavatory Door Snubber / Ejector Support Damaged Missing","o":"","r":""},{"n":"25-40-09","d":"Lavatory Entry Door Track roller missing - Door closes Normally","o":"","r":"Door remains in track and door closes normally."},{"n":"25-40-10","d":"Lavatory Inside Door Ash Trays Damaged / Missing","o":"For external door ashtrays - see MEL","r":""},{"n":"25-40-11","d":"Lavatory Mirror Cracked / Damaged","o":"","r":"Mirror can only be scratched or damaged in such a fashion not to pose a hazard to occupants. Cracked/damaged mirror may require taping. Graffiti must be covered up."},{"n":"25-40-12","d":"Lavatory Paper or Supplies Need Replenishing","o":"","r":""},{"n":"25-40-15","d":"Lavatory Trim / Wall Coverings / Damaged or Missing(see comments)","o":"This NEF item has a 365 day allowable time limit. This NEF cannot be used for the bi-fold door hinge seal.\\n\\nCan NOT be used for A321NEO door privacy/profile seal, see MEL 38-30-01A.","r":""},{"n":"25-40-17","d":"Lavatory Waste Flapper Door Snubber Damaged/Missing","o":"NEF item is for snubber only that may not be installed. Maintenance may need to adjust the snubber or remove snubber to allow the door to close flush.","r":"Access door must fully shut closed and seal for fire containment. If needed see applicable MEL if door stays open. NEF item is for snubber only."},{"n":"25-40-18","d":"Soap Dispenser Damaged / Missing","o":"The FAA has rescinded policy letter MMEL PL-128, Wheelchair Accessible Lavatories. Any and all restrictions which identified as more restrictive then the MMEL relief requirements have in regards to wheelchairs accessible lavatories have been removed.","r":""},{"n":"25-40-20","d":"Toilet Paper Roll Holder Damaged / Missing","o":"","r":""},{"n":"25-40-21","d":"Lavatory Waste Flapper Door Foot Step Inoperative","o":"767-300ER - Reference CMM/IPC 25-48-65 page 213","r":"The waste bin door opens and closes normally. Waste door must shut closed for fire containment. If needed see applicable MEL if door stays open."},{"n":"25-40-22","d":"Lavatory Shroud Cosmetic Damage","o":"","r":"Damage is limited to areas directly under where the seat interfaces on the shroud assembly (completely covered when the seat is lowered). Damage cannot yield in a hole that penetrates all the way through the shroud in a way that creates a cavity that would be subject to TSA security procedures."},{"n":"25-40-23","d":"Inoperative Sensor, Automatic Touchless Waste Flap (infrared or capacitive)","o":"","r":"Ensure waste flap operates manually to fully close. If any EWIS damage is found (wire damage, arcing, electrical smoking), contact engineering for repair."},{"n":"25-41-01","d":"Lavatory Assist Handles Damaged / Missing","o":"The FAA has rescinded policy letter MMEL PL-128, Wheelchair Accessible Lavatories. Any and all restrictions which identified as more restrictive then the MMEL relief requirements have in regards to wheelchairs accessible lavatories have been removed.","r":"Damage must not be to an extent that it leaves an opening that items could fall into or that would be a security concern."},{"n":"25-41-03","d":"Lavatory Occupied Sign Inop or Missing","o":"","r":""},{"n":"25-42-01","d":"Lavatory Countertop Damaged","o":"Water basin must be serviceable.This NEF item has a 365 day allowable time limit.","r":"Maybe damaged, cracked or dented as long as water cannot leak in the sink cabinet and the integrity of the lavatory waste container is not compromised for fire containment. No sharp edges may be present and must not present hazard to passengers or crew."},{"n":"25-43-01","d":"Amenity Holder Damaged / Missing","o":"","r":"Damage must not be to an extent that it leaves an opening that items could fall into or that would be a security concern."},{"n":"25-43-02","d":"Feminine Napkin Storage Cabinet Damaged","o":"","r":"Damage must not be to an extent that it leaves an opening that items could fall into or that would be a security concern."},{"n":"25-43-03","d":"Kleenex Holder Damaged / Missing","o":"","r":"Damage must not be to an extent that it leaves an opening that items could fall into or that would be a security concern."},{"n":"25-44-01","d":"Lavatory Seat Cover Holder Damaged / Missing","o":"","r":""},{"n":"25-44-02","d":"Toilet Seat Lids or Dampers Damaged / Missing","o":"This NEF does include the hold open and slow close function of the toilet seat/lid damper.","r":""},{"n":"25-50-01","d":"A319/320/321 Cargo Compartment Bulb Seal Damaged/Missing","o":"Cargo compartment bulb seals (ABS0398, ABS0305, ABS0399 profiles) between the slanted sidewall panels and the adjacent vertical sidewall and horizontal floor panels are not required on A319, A320, A321, and A321NEO. Reference IPC 53-22-02-20F items 50 and 60 and IPC 53-22-02-20J items 180 and 190 for examples of typical locations.","r":""},{"n":"25-50-02","d":"Cargo Compartment Anti Skid tape Worn / Missing","o":"","r":""},{"n":"25-50-03","d":"Cargo Compartment Barrier Net Damaged/Missing (B717only)(737 cosmetic damage only for inop use MEL see notes) (A220 see MEL 50-22-01)","o":"NEF relief for 737 is limited to cosmetic damage for inop and missing please reference MEL 25-00-05A and 25-00-05B. For B717 net can be missing or operationally damaged since there is no MEL relief.","r":"For A319, A320, A321, A330, A350, B737, B757, B767 aircraft see the MEL for relief. Required nets must be serviceable. For missing required nets refer to MEL for deferral procedures."},{"n":"25-50-04","d":"Cargo Moveable PDU Wheels Worn (EXCEPT A330)","o":"This FRC to replace 25-52-01 when EFM rev 2 is published and boarded on all fleets. \\n\\nOn A330s, defer per MEL item 25-51-01C or 25-51-01D.","r":"PDU wheels worn but still operational. If inop see MEL."},{"n":"25-50-05","d":"Cargo Compartment Has Fish Smell","o":"","r":""},{"n":"25-50-06","d":"Cargo Net Hooks Damaged/Missing","o":"Hooks used to keep cargo nets out of the way during loading.\\r\\n\\r\\nThis FRC to replace 25-56-01 when EFM rev 2 is published and boarded on all fleets.","r":""},{"n":"25-50-08","d":"Cargo Compartment has Graffiti","o":"","r":""},{"n":"25-50-09","d":"Cargo Compartment Non-Slip Tape Worn / Missing","o":"This NEF item has a 365 day allowable time limit.","r":""},{"n":"25-50-10","d":"Cargo Compartment Profile Bar Damaged","o":"","r":""},{"n":"25-50-11","d":"Cargo Compartment Sidewall Trim Damaged / Missing","o":"","r":""},{"n":"25-50-12","d":"Cargo Control Pendant Rubber Cover Damaged or Poor Condition","o":"","r":""},{"n":"25-50-13","d":"Cargo Door Draft Seal Worn","o":"","r":""},{"n":"25-50-14","d":"Cargo Pendant Holder Damaged","o":"","r":""},{"n":"25-50-15","d":"Cargo Repair Kit Expired/Damaged/Missing","o":"","r":""},{"n":"25-50-16","d":"Master Cargo Control Indication Lights/Switch Covers (Panel/Pendant Still Operative)","o":"This item is for the lights or switch covers on the cargo loading control panel or pendant. The panel / pendant still controls the loading system properly. For inoperative panel / pendant, see MEL.","r":""},{"n":"25-50-17","d":"B767-300 Cargo Pendant Plastic Cover (POST AA 2553-01018)","o":"3D Printed Plastic Protective Cover (P/N 25-5790-001)","r":"B767-300 (POST AA 2553-01018) Cargo Pendant Plastic Cover (3D Printed Plastic Protective Cover - P/N 25-5790-001) may be damaged or missing. No sharp edges or hazards to personnel are permitted. Round sharp edges or remove damaged cover. No damage to underlying pendant or wiring is permitted."},{"n":"25-60-03","d":"Demo Equipment (Safety Belt, Life Vest, O2 Mask) Excess Equipment","o":"","r":"Redundant equipment may be missing provided a safety belt, life vest and O2 mask remain to provide for demo briefing aids."},{"n":"25-60-04","d":"Security Kit Inoperative, Missing or Missing Equipment","o":"Includes Handcuffs","r":""},{"n":"25-60-06","d":"Demo Equipment Pouch/Container Broken or Missing","o":"","r":""},{"n":"25-60-07","d":"Demo O2 Mask Damaged/Missing","o":"This is for the spare mask only.This NEF item has a 365 day allowable time limit.","r":""},{"n":"25-60-08","d":"Evacuation Preparation Checklist and/or Holder Damaged or Missing","o":"This NEF item has a 10 day allowable time limit.","r":""},{"n":"25-60-09","d":"\"CREW ONLY\" labeled HEADREST COVERS/ BAG MISSING OR DAMAGED","o":"CREW ONLY\\u001A labeled removable headrest covers on the aft RH seats of the cabin. These seats will be \\u001Asoft blocked\\u001A, which means Revenue Management can still sell the aft RH seats to revenue passengers, however, they will not be assigned to any non- revs. If revenue passengers are in the seat, then F/A\\u001As can move them to a location forward in the cabin to free up the seats to be available during turbulence. The headrest covers (Qty: 2) will be stored in the storage bag during Taxi/Takeoff/Landing and stowed in the emergency equipment overhead bin. They are not permanently installed on the seat.","r":""},{"n":"25-61-01","d":"Evacuation Slide Bottle View Port Lens Damaged / Missing","o":"This NEF item has a 10 day allowable time limit.","r":"Cover port with clear tape to prevent rain water ingress."},{"n":"25-61-07","d":"Slide Bustle Scuffed","o":"","r":""},{"n":"25-61-09","d":"Slide Manual Inflation Pull-Tab/Handle Clear Cover","o":"","r":"The red pull tab must be present and in serviceable condition. Only the clear plastic cover can be missing or damaged. If damaged, remove plastic cover from the aircraft to ensure pull tab is accessible and visible."},{"n":"25-62-01","d":"Crew Life Vest Cover Missing or Weak Velcro","o":"","r":"Crew Life Vest must be able to remain secure within the designated storage pocket and not be vulnerable to falling out."},{"n":"25-62-03","d":"Life Vest Container End Cap Damaged / Missing","o":"If the life vest container cap seal is missing/broken, check the MEL for applicability. If the seal is missing/broken and not listed in the MEL, use NEF code 25-62-07.","r":"If end cap is missing, perform visual inspection to ensure life vest pouch has not been compromised. Make sure life vest placard is facing the floor.\\r\\n\\r\\nIf the life vest container cover is damaged, ensure there are no sharp edges that could present a safety hazard."},{"n":"25-62-07","d":"Life Vest Seals Broken/Missing","o":"","r":"For those associated with crew or passenger seats, refer to associated MEL.\\n\\nIf red life vest seal security seal is missing, perform visual inspection to ensure life vest pouch has not been compromised. Make sure life vest placard is facing the floor."},{"n":"25-62-08","d":"Spare Life Vest Bag Damaged","o":"As of 06/18/2014 all MELs contain spare vests inop/missing except for the A319/320/321 MEL.","r":"Check if item is still contained in the MEL; if yes then complete the MEL deferral process, otherwise defer using this NEF Item. For those associated with crew or passenger seats, refer to associated MEL."},{"n":"25-62-09","d":"Spare Life Vests Missing","o":"As of 06/18/2014 all MELs contain spare vests inop/missing except for the A319/320/321 MEL.","r":"Check if item is still contained in the MEL; if yes then complete the MEL deferral process, otherwise defer using this NEF Item. For those associated with crew or passenger seats, refer to associated MEL."},{"n":"25-62-10","d":"Survival Kit Container Strap Damaged","o":"","r":""},{"n":"25-63-11","d":"First-Aid Kit Strap Damaged / Inoperative","o":"This item is only for the strap that holds the kit. If kit is unserviceable or if security seal is broken see MEL.","r":"May require Temporary Strap."},{"n":"25-65-04","d":"Flash Light Holder Seals Broken/Missing","o":"","r":""},{"n":"25-65-05","d":"Flight Deck Crash Axe Cover Damaged / Missing","o":"","r":"Crash Axe must still be secured."},{"n":"25-71-01","d":"Electrostatic Wrist Strap Damaged / Missing","o":"","r":""},{"n":"25-73-01","d":"A/C Aft Service Bay Indication Light Lenses Cracked","o":"","r":""},{"n":"25-73-02","d":"A/C Service Bay Compartment Light Lenses Cracked","o":"","r":""},{"n":"25-73-03","d":"Aft Service Bay Insulation Blanket Worn / Damaged","o":"","r":""},{"n":"25-73-04","d":"E & E Service Bay Floor Panel Damaged","o":"","r":""},{"n":"25-73-06","d":"Hoist Point Plug / Cover Missing (NON ENGINE OR T/R)","o":"All Aircraft passenger door, cargo doors slat, flap, vertical stabilizer, horizontal stabilizer, rudder, elevator hoist point plugs and hoist point covers. Not for engine and T/R hoist point see MEL or specific NEF.","r":"Does not apply to tape over MD90 nitrogen discharge port. Not for engine and T/R hoist point see MEL or specific NEF."},{"n":"25-73-07","d":"IFE Cabinet Trim and Cosmetic Items Damaged / Missing","o":"MISC Items Having Only Cosmetic Function.This NEF item has a 365 day allowable time limit.","r":"Damage must not be to an extent that it leaves an opening that items could fall into or that would be a security concern."},{"n":"25-73-08","d":"PSU Tool Missing- Must Brief F/A to use alt method per OBM","o":"","r":"Captain is to brief lead flight attendant to use alternate method per On-Board Manual."},{"n":"25-74-01","d":"Flight Attendant Crew Rest Area Assist handles Poor Condition","o":"","r":"Must still be functional and secure."},{"n":"25-74-02","d":"Flight Attendant Crew Rest Area Bunk Door (Check MEL) A330-200 ONLY","o":"This NEF is for the pilot to FA pass through door on A330-200 aircraft ONLY","r":"Check if item is contained in the MEL; if yes then complete the MEL deferral process, otherwise defer using the NEF item. \\n\\nRemoval of the bunk door is acceptable for repair development."},{"n":"25-74-03","d":"Flight Attendant Crew Rest Area Grills / Vents Damaged","o":"","r":""},{"n":"25-74-04","d":"Flight Attendant Crew Rest Area Interior Trim or Wall Covering Damaged / Missing","o":"This NEF item has a 365-day allowable time limit.","r":""},{"n":"25-74-05","d":"Flight Attendant Crew Rest Area Pillows, Blankets, Mattress Pads, Sheets damaged/ Missing","o":"","r":"Check if item is contained in the MEL; if yes then complete the MEL deferral process, otherwise defer using the NEF item. At this time, reference MEL 25-25-07F for B767-300, MEL 25-25-07F for B767-400."},{"n":"25-74-06","d":"Flight Attendant Crew Rest Ashtray Damaged / Missing","o":"","r":"If ashtray is missing and leaves hole exposed, inspect for foreign objects then cover with suitable pressure sensitive tape (i.e. bag bin tape, nylon or fiberglass reinforced tape, not masking tape)."},{"n":"25-74-07","d":"Flight Attendant Crew Rest Coat / Hat Hangar or Clip Damaged / Missing","o":"","r":""},{"n":"25-74-09","d":"Flight Attendant Crew Rest Peep Hole Blocked / Damaged","o":"Crew rest door peep hole in A330","r":"If cover is missing, place masking tape over the peep hole to ensure security."},{"n":"25-74-10","d":"Flight Attendant Crew Rest Stowage Compartment or Bag Damaged","o":"","r":""},{"n":"25-74-11","d":"Flight Attendant Crew Rest Tray Table Damaged / Missing","o":"","r":""},{"n":"25-74-12","d":"Flight Attendant Crew Rest Vanity Mirrors Damaged / Missing","o":"This NEF item has a 365-day allowable time limit.","r":""},{"n":"25-74-13","d":"Flight Attendant Crew Rest Trash Liner Damaged/Missing","o":"","r":"Must not present hazard to passengers or crew. Flapper door and access door must be secured closed and placarded: \"DO NOT USE\""},{"n":"25-74-14","d":"Flight Attendant Crew Rest Area Bunk Curtain (Check MEL)","o":"","r":"Check if item is contained in the MEL; if yes then complete the MEL deferral process, otherwise defer using the NEF item."},{"n":"25-74-15","d":"Flight Attendant Crew Rest Area Bunk Curtain Tie-Back (Check MEL)","o":"","r":"Check if item is contained in the MEL; if yes then complete the MEL deferral process, otherwise defer using the NEF item."},{"n":"25-75-01","d":"Aft Stairway Ceiling or Sidewall Panel Damaged / Poor Condition","o":"This NEF item has a 365 day allowable time limit.","r":""},{"n":"25-75-02","d":"Airstair Control Handle Knob Damaged / Missing","o":"Airstair handle must still be operational.","r":""},{"n":"26-15-01","d":"Cargo Smoke Detector Grill Damaged","o":"","r":"Detector must operate normally and grill must still protect detector. Must not present hazard."},{"n":"26-17-03","d":"Lavatory Smoke Detector Grill Damaged","o":"","r":"Detector Must Operate Normally and grill must still protect detector. Damage must not be to an extent that it leaves an opening that items could fall into or that would be a security concern."},{"n":"26-19-01","d":"Crew Rest Smoke Detector Grill Damaged","o":"","r":"Detector Must Operate Normally and grill must still protect detector."},{"n":"26-27-01","d":"Crew Rest Area Smoke Detector Cover Latch Damaged","o":"For Smoke detector faults see MEL","r":"May be inoperative provided door(s) is closed."},{"n":"27-40-01","d":"Stab Trim Cutout Switch Guard or Spring Damaged/Broken/Missing -B717 Only","o":"This NEF item has a 10 day allowable time limit.","r":"No sharp edges may be present and must not present hazard to the crew."},{"n":"27-66-01","d":"Spoiler Maintenance Key","o":"May be missing or damaged.","r":""},{"n":"28-00-01","d":"Engine Fuel Cut-off Switch Guard plate Damaged / Missing (B717 Only)","o":"Applicable to the Engine Fuel Cut-off Switch Guard plate installed on the B717 throttle control module under AA 7612-01011.","r":"The primary safety gate/stop on the fuel shutoff switch must be in good condition and prevent the fuel shutoff switch from slipping over the gate into the off position without positively pulling the switch knob out. If the fuel shutoff switch gate is worn to the point of causing the switch to slip into the off position, this deferral can't be used.\\r\\n \\r\\nIf the switch guard plate is damaged, make sure no sharp edges are present and any deformation of the plate does not interfere with any switches/controls. If any safety hazard or interference is present, remove the plate."},{"n":"28-20-01","d":"Fueling Panel Spray Pan","o":"The spray pan is required to be installed during fueling of the aircraft. This NEF item has a 10 day allowable time limit.","r":"Fueling panel spray pan may be missing; however fueling is not allowed. Install placard at the fueling panel. State on placard: Fueling Panel Spray Pan Missing - Do Not Fuel."},{"n":"28-21-01","d":"Defuel Valve Lens Cap Damaged / Missing","o":"Lens cap for defuel valve in fueling panel","r":""},{"n":"28-21-02","d":"Fueling Door Striker Plate for Red Switch Cap Damaged","o":"Striker plate for fuel fill valve red switch cap.","r":"Plate can have minor damage but must still perform its intended function to close the switch guard."},{"n":"28-21-03","d":"Fueling Panel \"Set\" Button Damaged / Inoperative","o":"Does not affect fueling of a/c","r":""},{"n":"28-21-04","d":"Refuel Coupling Cap Lanyard or Chain - Broken or Missing LIMITED FLEET APPLICABILITY","o":"Lanyard or Chain on the Refuel Coupling Cap may be missing or removed for the following fleets: B763, B764, A221, A223, A319/320/321/321N, A330. For A350, use relief in the CDL. For B717, B737, B757, no published relief available (or this configuration is not installed).\\n\\nNo damage permitted to the cap or to the refuel coupling. If the cap is missing or damaged, do not use this NEF: Use relief in MEL or CDL.","r":"All parts of the broken lanyard or chain must be entirely detached from the cap and the coupling and discarded."},{"n":"29-16-01","d":"Hydraulic Quantity Gauge at Service Panel Inop (A330 Only)","o":"","r":"Use ECAM to fill."},{"n":"29-16-02","d":"Hydraulic Reservoir Fill Hand Pump Inop (A32x. A330, A350)","o":"Hydraulic Reservoir Filling Hand Pump (FIN: 1009GM for A319/320/321, FIN: 5204JM for A330, FIN: 5001JE for A350) may be inoperative. Reservoir servicing must be accomplished by pressure feed. This NEF applies ONLY to the Reservoir Filling Pump (located on the Green System Ground Service Panel). This NEF does NOT apply to the Yellow System Auxiliary Pump.","r":"No leaks permitted. Reservoir Pressure Feed must be operative."},{"n":"29-16-03","d":"Hydraulic Reservoir Hose or Bottle Damaged / Poor Condition","o":"","r":""},{"n":"29-16-04","d":"Hydraulic Service Bay Chains, Lanyards, Clips Damaged / Missing","o":"","r":""},{"n":"29-16-05","d":"Hydraulic Service Bay Dust Cover Caps Damaged / Missing","o":"","r":""},{"n":"29-16-06","d":"Hydraulic Service Bay Manual Service Hoses Damaged/Missing","o":"Missing hose allowed for A319, A320, A330, A350, 737, 757, 767 fleets only.","r":"Missing hose not allowed for A321 and B717 fleets. Damaged hose is approved for all other fleets."},{"n":"29-16-07","d":"Hydraulic Reservoir Fill Pump Handle Missing","o":"This is the hand pump used for ground service of hydraulic system. System can still be serviced by pressure feed.","r":""},{"n":"29-16-08","d":"Hydraulic Manual Servicing Port Threads Damaged (A319/320)","o":"Can use ECAM or servicing panel gage for filling.","r":"Pressure fill operates normally."},{"n":"31-10-01","d":"Flight Deck Control Knob Set Screw Head Worn","o":"This NEF item has a 10 day allowable time limit. Relief is for the screw head used for tightening being worn.","r":"Knob must be secure."},{"n":"31-14-01","d":"Circuit Breaker Bar Loose / Damaged(see notes)","o":"Please follow guidance of CFR 25-1357(D)- If the ability to reset a circuit breaker or replace a fuse is essential to safety in flight, that circuit breaker or fuse must be located and identified so that it can be readily reset or replaced in flight.","r":"Can be loose but must still be attached in a way that C/B's are clearly identified. Must not interfere with operation of Circuit Breakers."},{"n":"31-14-02","d":"Overhead Switch Rubber Tip Damaged / Missing","o":"","r":""},{"n":"31-31-01","d":"Flight & Voice Recorder Driver/Extractor Missing","o":"Driver/Extractor tool ref MPN ABN7066-1 ref IPC 31-31-00-10 item 275.","r":""},{"n":"31-63-01","d":"EICAS Maintenance Switch(es) inoperative","o":"Set up for next possible repair opportunity since switch may be needed during maintenance checks.","r":""},{"n":"32-25-01","d":"Nose Gear Torque Link Hold Open Bracket Damaged (767 only)","o":"This NEF item has a 10 day allowable time limit. Bracket MPN 162T1618-1 is only used for MTC functions and is a non essential equipment.","r":"1. Accomplish a detailed visual inspection of:\\r\\n A) The subject area and adjacent structure to ensure no additional damage is present\\r\\n B) The inside the upper link hinge pin to ensure no evidence of damage to the hinge pin or retention pin. \\r\\n2. Ensure that the remaining shaft section of the support pin within the upper torsion link pin is not loose.\\r\\n3. Contact the MCC and Liaison Engineering with any discrepancies."},{"n":"32-30-01","d":"Landing Gear Pins Missing","o":"This NEF item has a 10 day allowable time limit.","r":""},{"n":"32-30-02","d":"Landing Gear Pin Pouch Damaged/Missing","o":"Use this item for the landing gear pin pouch damaged/missing. When this item is used then the gear pins must be removed or stowed in a secure location and NEF code 32-30-01 must also be applied for the gear pins missing.This NEF item has a 10 day allowable time limit.","r":""},{"n":"32-40-01","d":"Brake Deactivation Tool - Missing","o":"","r":""},{"n":"32-70-01","d":"Tail Skid Lockout Tool Missing","o":"","r":"May be missing provided the downlock pin is not required for MEL tail skid deactivation."},{"n":"33-10-02","d":"Flight Deck Video In Use Light Inop","o":"","r":""},{"n":"33-10-03","d":"Service Interphone Illuminated Override Switch Inoperative","o":"This pushbutton used for maintenance. 50vu panel.","r":"The illumination function may be inoperative provide the switch still operates properly."},{"n":"33-10-04","d":"OVHD \"ANNUN LT PULL TO DIM\" SWITCH KNOB MISSING","o":"LIGHT SWITCH MUST RETAIN DIMMING FUNCTIONALITY.","r":"NO REMARKS"},{"n":"33-12-01","d":"Crew Rest Area Stair Tread Lighting Inoperative","o":"","r":"Check if item is contained in the MEL; if yes then complete the MEL deferral process, otherwise defer using the NEF item. At this time, reference MEL 33-20-02D for B767-300 and MEL 33-21-01E for A330 aircraft."},{"n":"33-12-02","d":"Crew Rest Area Stowage Compartment / Bin Lighting Inoperative","o":"","r":"Check if item is contained in the MEL; if yes then complete the MEL deferral process, otherwise defer using the NEF item. At this time, reference MEL 33-21-01 for A330 aircraft."},{"n":"33-12-03","d":"Crew Rest Reading Lights Inop","o":"","r":"Check if item is contained in the MEL; if yes then complete the MEL deferral process, otherwise defer using the NEF item. At this time, reference MEL 33-20-02F for B767-300 and MEL 33-20-02C for B767-400 and MEL 33-21-01 for A330 aircraft."},{"n":"33-12-04","d":"Crew Rest Sink Overhead Light Inoperative","o":"","r":"Check if item is contained in the MEL; if yes then complete the MEL deferral process, otherwise defer using the NEF item. At this time, reference MEL 33-21-01 for A330 aircraft."},{"n":"33-18-01","d":"Grimes Light Lens Damaged / Missing","o":"","r":""},{"n":"33-19-01","d":"Landing Light Gang Bar Assembly Damaged/Missing","o":"","r":"No sharp edges may be present and must not present hazard to the crew."},{"n":"33-21-01","d":"Cabin Light Bulb Discolored But Still Operational","o":"","r":"Bulb may be discolored but still operational. For emergency lighting or inoperative cabin lighting see MEL."},{"n":"33-21-02","d":"Cabin Light Lens Cracked or Damaged","o":"DO NOT USE for MISSING lenses unless specifically referenced in other NEF items. MISSING sidewall or ceiling light lenses normally require engineering documentation for dispatch.","r":"Lights are fully operational. Len is cracked or has temp repair but must be secure. For inoperative cabin lens see MEL."},{"n":"33-21-09","d":"Cabin PSU Pod Halo Accent Lighting Inoperative (A319/320 Only)","o":"Applicable to the modified A319/320 PSU pod blue halo accent light function. If the amber call light function of the PSU pod is also inoperative, create an additional deferral using NEF 25-27-04. Press and reset the attendant call button to verify which functions are inoperative.","r":""},{"n":"33-21-10","d":"Delta one suite mood lighting(A350/A330-NEO)","o":"This NEF is for use INOP mood lighting on the Delta one Suite installed currently on the A350/ 777 POST MOD/ 330-NEO only.","r":"For in suite reading light please see NEF 33-23-01."},{"n":"33-21-11","d":"330NEO Handrail lighting INOP","o":"","r":"1. Troubleshoot system per A330 AWM 33-21-90, and ASM 33-21-26.\\n2. Pull and collar CBs FIN 328LG RH (location B08) and/or 329 LG LH (location B07) on the 5001VE per TOPP 40-40-05 Section VII Para. F and ESPM 20-46-10, depending on damage.\\n3. If any wire damage (chafed, exposed or otherwise damage) is identified, coil and stow wire in accordance with the Airbus ESPM Chapter 20-54-50 at the damage location, reference AWM 33-21-90, and ASM 33-21-26."},{"n":"33-21-12","d":"76K Cabin Lighting \\u001A AFT CTS Control Panel","o":"This NEF applies only to \\u001A76K\\u001A configuration, 767-300 post-AA 2500-01823. Only applies to the secondary (aft) CTS panel.","r":"The Aft Cabin Lighting \\u001ACabin Touch Screen\\u001A (CTS) control panel may be inoperative, provided the FWD panel remains operative and all cabin illumination functions remain operative (or otherwise deferred per other approved MEL/NEF)."},{"n":"33-21-13","d":"Underbin (Handrail) Flexible Strip Lights (A321NEO ONLY)","o":"","r":""},{"n":"33-21-14","d":"Ceiling/Sidewall HERO Lights (A321NEO)","o":"Not to be used for normal ceiling or sidewall lighting. See MEL","r":""},{"n":"33-21-15","d":"Branding Light Lens Missing","o":"Cabin LED style Branding Light lens is missing.","r":"To use this NEF, the branding light must be LED style illumination. A glass light bulb would present a possible debris hazard and require the lens. Verify the Branding Light is LED style and the lens may be missing."},{"n":"33-21-16","d":"UNDER SEAT ACCENT LIGHTS INOP.B757C A/C ONLY","o":"","r":""},{"n":"33-21-17","d":"3D Lit Widget - D1 cabins","o":"","r":""},{"n":"33-22-04","d":"Passenger Service Unit WIFI Light Inoperative","o":"For No Smoking and Fasten Seatbelt lights see MEL.","r":""},{"n":"33-23-01","d":"Passenger Reading Light Inoperative","o":"","r":""},{"n":"33-23-02","d":"Passenger Reading Light Lens / Diffuser Damaged or Missing","o":"","r":"No exposed lamps or wiring can exist, causing a hazard to passengers."},{"n":"33-23-03","d":"Passenger Reading Light Needs Adjustment","o":"","r":""},{"n":"33-23-04","d":"Passenger Reading Light Won't Turn Off","o":"","r":""},{"n":"33-23-05","d":"Passenger Reading Lights Inop Multiple Locations","o":"","r":""},{"n":"33-23-06","d":"Forward Entry Mood Lights - Bezel (B717 ONLY)","o":"This NEF applies only to the B717 LED Mood Light configuration post-AA 3323-01027.\\n\\nThe decorative plastic diffuser/bezel (MPN 0203063-001EA or equivalent) may be missing from the B717 Forward Cabin drop ceiling mood light(s).","r":""},{"n":"33-24-04","d":"Attendant Panel Switch Light Inop - Switch Still Operates","o":"Check MEL for specific switch light prior to deferral. This NEF is for the light inside of the switch light. Items associated with the forward attendant panel on the A319/320/321 are located in the MEL.","r":""},{"n":"33-24-05","d":"Attendant Panel Switch Light Lens Damaged","o":"","r":""},{"n":"33-24-09","d":"Passenger to Flight Attendant Call System(not for A350)","o":"This NEF is NOT applicable to A350 aircraft (refer to A350 MEL 44-13-02A). \\n\\nOn B757, B763, and B764 aircraft, this NEF may NOT be used to defer amber, pink or red Flight Attendant Visual Alert Lights (reference B757, B763, or B764 MEL)\\n\\nThe FAA has rescinded policy letter MMEL PL-128, Wheelchair Accessible Lavatories. Any and all restrictions which identified as more restrictive then the MMEL relief requirements, in regard to wheelchairs accessible lavatories, have been removed.","r":""},{"n":"33-25-01","d":"Aft Air Stair Light Lens / Cover Damaged","o":"","r":"Does not apply to emergency lights. Lens must be secure."},{"n":"33-25-02","d":"Flight Attendant Reading Light Inoperative","o":"","r":"There must be acceptable lighting to allow reading of check list. This may require overhead lighting switch to be accessible from the seated position."},{"n":"33-25-03","d":"Threshold Light Inop","o":"For flight deck door viewing port lights see MEL.","r":""},{"n":"33-25-04","d":"Threshold Light Lens / Cover Damaged","o":"","r":"Lens must be secure."},{"n":"33-26-01","d":"Lavatory Light Inoperative (not for A350)","o":"This NEF is not applicable to A350 please see MEL 33-21-02.","r":"May be inoperative (partially) provided sufficient lighting exists (For Return To Seat sign lighting or emergency lights, refer to MEL).This NEF is not applicable to A350 please see MEL 33-21-02."},{"n":"33-26-02","d":"Lavatory Light Lens Damaged","o":"","r":"Lens must be secure."},{"n":"33-26-03","d":"Lavatory Occupied Light Inop (Restricted application on the A350)","o":"On the A350, this NEF applies to the lights in the Passenger Cabin ONLY. For the A350 Flight Deck Lav OCCPD Light, use MEL 44-01-02A.","r":""},{"n":"33-26-04","d":"Lavatory Please Lock Door Light Inop","o":"","r":""},{"n":"33-26-05","d":"Lavatory Sign Lens / Cover Damaged","o":"","r":"No electrical wiring can be exposed. Lens or cover must still be secure."},{"n":"33-26-06","d":"Lavatory Lock Door Light Inop","o":"Light is located in the lavatory and may state \"Please Lock Door\" or \"Lock Door\".","r":""},{"n":"33-27-01","d":"Closet Light Inop","o":"","r":""},{"n":"33-27-02","d":"Closet Light Lens Damaged / Missing","o":"","r":"Lens must be secure. If lens is missing then bulb is removed."},{"n":"33-27-04","d":"Galley Power Indicator Light Inop in Galley","o":"","r":"Galley Power Operates Normally."},{"n":"33-27-05","d":"Galley Power Indicator Light Lens Damaged","o":"","r":""},{"n":"33-27-06","d":"Galley Work Light","o":"","r":""},{"n":"33-31-01","d":"Cargo Compartment Door Light Housing Damaged","o":"","r":""},{"n":"33-32-01","d":"External Power Connection Compartment Light Lens Damaged/Missing","o":"","r":""},{"n":"33-32-02","d":"External Power Connection Indication Light Lens Damaged/Missing","o":"","r":""},{"n":"33-32-03","d":"Fuel Service Bay Indication Light Lens Damaged","o":"","r":""},{"n":"33-32-04","d":"Potable Water Service Bay Indication Light Lens Damaged","o":"","r":""},{"n":"33-32-05","d":"Service Bay Compartment Light Lens Damaged/Missing","o":"","r":""},{"n":"33-32-06","d":"Toilet Service Indication Light Lens Damaged/Missing","o":"","r":""},{"n":"33-51-02","d":"Emergency Exit Cover Diffuser Lens Damaged or Missing","o":"The exit cover must be present. This NEF is for the diffuser lens only. The diffuser lens is the clear lens on the bottom of the cover.","r":"The exit cover must be present. Emergency exit light(s) illumination operation is normal."},{"n":"34-42-01","d":"Vibration Monitor Unit for the WX radar antenna drive 757-200 only","o":"AA 3442-01139 installs a (VMU) Vibration Monitor Unit that monitors the vibration of the Wx Radar Antenna Drive Motor and alerts to pre-failure conditions. It is installed in the in the Forward EE bay of B757-200 A/C. This NEF has a 365 day allowable time limit..","r":""},{"n":"34-42-02","d":"Weather Radar XCVR Mounting Base (MBA-4 Series) - Extractor Assembly","o":"","r":""},{"n":"34-55-01","d":"Nav Radio Control Panel Frequency Display Window Damaged","o":"This NEF item has a 10 day allowable time limit.","r":"Nav system operation is normal and the nav frequency can be viewed in an alternate display (PFD, ND, DU, ect). Must not obstruct the view of the display and must not present hazard to the crew, no sharp edges."},{"n":"34-64-01","d":"Data Loader Inop / Fail Light Illuminated","o":"","r":""},{"n":"35-11-01","d":"CREW OXYGEN CYLINDER COMPARTMENT WINDOW","o":"MAY BE WORN, DIRTY OR DAMAGED NO (M) OR (O) PROCEDURES","r":""},{"n":"35-21-01","d":"PSU Oxygen Door Test Stop Assembly Broken","o":"On Airbus fleets this is called a \"test button\". The stop assembly/test button is used for operational testing of the oxygen door on PSUs.","r":"Oxygen door must be operational and must not be obstructed. Secure opening with tape as required."},{"n":"35-32-06","d":"Oxygen Bottle Mask Velcro Strap Damaged/Missing","o":"Specify the location of the oxygen cylinder in the log. This NEF item has a 10 day allowable time limit.","r":"The mask and tubing must be secured to bottle with a rubber band."},{"n":"36-13-01","d":"The PRSOV Ground Mtc Switch (on engine 767-300 only)","o":"The PRSOV ground switch (767-300 EQ. S2178) is not functioning; not allowing maintenance to deploy the Thrust Reversers on the ground with APU air. This switch and associated circuitry is for Maintenance function only, based on a review of B767 WDM 36-11-51 and 36-11-52. Item can only be deferred on 1502, 1504-1506, 1521, 1601-1613, 1701-1708.","r":"The Thrust Reverser must still be validated to deploy and PRSOV function using normal engine operations (B767-300 AMM 78-31-00-715-007-H00) to apply this NEF. If alternate procedures are not used to validate the thrust reverser will deploy this NEF is not to be used, and MEL to inop the Thrust Reverser must be considered, or the Thrust Reverser must be repaired. \\n\\n1. Troubleshoot the affected System, referencing B767-300 WDM 36-11-51 (LH), or 36-11-52 (RH) and B767-300 SSM 36-11-05 (LH), or 36-11-06 (RH) to identify root cause. The root cause must either be a faulty switch or start solenoid. No wiring faults are authorized.\\n2. Accomplish B767-300 AMM 78-31-00-715-007-H00 Thrust Reverser Operational Test \\u001A With Engine Operation"},{"n":"36-14-01","d":"HPSOV Jumper Damaged / Missing from MCO Pouch (B767)","o":"","r":""},{"n":"36-20-01","d":"Temperature Tabs Worn","o":"","r":"Worn but still operative. See applicable AMM for other requirements."},{"n":"38-12-01","d":"Galley Spigot Aerator Damaged/Missing","o":"","r":""},{"n":"38-12-04","d":"Galley Water Spigot Will Not Turn ON(check MEL)","o":"Check MEL prior to deferral.","r":""},{"n":"38-12-07","d":"Lavatory Faucet Aerator Damaged / Missing","o":"","r":""},{"n":"38-12-08","d":"Lavatory Faucet Hot and Cold Indicators Illegible or Missing","o":"","r":""},{"n":"38-13-01","d":"Water Quantity Gauge Lens Damaged","o":"","r":"Indication must be operational."},{"n":"38-13-04","d":"Water System Quantity Indication Lights (B717 only)","o":"This code is for the \"tank water level\" lights on the potable water servicing panel on all B717 aircraft. The crew will need to check that water pressure is present in the cabin prior to flight. If no water flows from the faucets in the cabin then the MEL code for the potable water system must be used.","r":""},{"n":"38-15-01","d":"Potable Water Dust Cover / Cap / Chain / Lanyard Damaged or Missing","o":"","r":""},{"n":"38-30-01","d":"Lavatory Flush Handle Loose","o":"","r":"Handle can be loose but must be secure. The toilet flush handle and flush switch must operate normally."},{"n":"38-31-02","d":"Toilet Bowl Splash Pan Stuck","o":"","r":""},{"n":"38-31-03","d":"Toilet Bowl Strong Odor","o":"","r":""},{"n":"38-31-05","d":"Toilet Foot Pedal Flush Inoperative/Foot Pedal Damaged (767)","o":"This code applies to the foot pedal operation of the toilet flush. The toilet flush push button must be operational. See the MEL if the toilet flush push button is inoperative or if the toilet will not flush at all.","r":""},{"n":"38-31-06","d":"Touchless flush inop (A/C 6801-6818 only)","o":"This code applies to the IR touchless operation of the toilet flush. The manual toilet switch must be operational. See the MEL if the toilet flush switch is inoperative or if the toilet will not flush at all.","r":"Troubleshoot the system in accordance applicable CMM and disconnect plug J107 and cap and stow in accordance with D6-54446 707, 727 Through 787 SWPM 20-10-11 requirements."},{"n":"38-32-01","d":"Toilet Service Dust Cover/Cap/Chain/Lanyards Damaged/Missing","o":"This item is for the external lav service panel components.","r":""},{"n":"38-32-02","d":"Waste Ball Valve Cover - A220 ONLY, POST AA 3832-01115","o":"This item applies to POST AA 3832-01115 A220 aircraft only. If the waste ball valve cover (PN 38-0156) is missing, maintenance may defer replacement for 10 days.","r":""},{"n":"38-33-01","d":"Toilet Bowl Non-Stick Coating Peeling","o":"This NEF item has a 365 day allowable time limit.","r":""},{"n":"38-34-01","d":"Door Sill Drain Plugged / Inop","o":"","r":""},{"n":"38-34-02","d":"Galley Drain Noisy","o":"","r":""},{"n":"38-34-03","d":"Galley Drain Plugged / Inop (B717/B737 only)","o":"NEF for Galley Drain Plugged / Inop 717/737 only. For A319/320/321, A330 and A350 potable water system galley drains see the MEL for relief. Due to E/E flooding risk on 757/767 do not use this NEF please use MEL 38-30-01A.","r":"Install placard in area of drain to inform cabin crew that it is inoperative."},{"n":"38-34-04","d":"Galley Drain Slow (Contact MCC)","o":"","r":"Contact MCC prior to deferral. Ensure there is no risk of an overflow."},{"n":"38-34-05","d":"Lavatory Drain Noisy","o":"","r":""},{"n":"38-34-06","d":"Lavatory Drain Slow (Contact MCC)","o":"","r":"Contact MCC prior to deferral. Ensure there is no risk of an overflow."},{"n":"38-34-07","d":"Lavatory Sink Drain Screen Damaged / Missing (Contact MCC)","o":"","r":"Contact MCC prior to deferral. Ensure there is no risk of an overflow."},{"n":"38-34-08","d":"Lavatory Sink Stoppers Damaged / Missing (Contact MCC)","o":"","r":"Contact MCC prior to deferral. Ensure there is no risk of an overflow."},{"n":"38-34-09","d":"Lavatory Water Dispenser Drain slow","o":"","r":""},{"n":"38-34-10","d":"Sink Drain Handles Inoperative (Contact MCC)","o":"","r":"Contact MCC prior to deferral. Ensure there is no risk of an overflow."},{"n":"38-34-11","d":"Sink Handles / Faucets / Pull Knobs Damaged But Still Operational","o":"The FAA has rescinded policy letter MMEL PL-128, Wheelchair Accessible Lavatories. Any and all restrictions which identified as more restrictive then the MMEL relief requirements have in regards to wheelchairs accessible lavatories have been removed.","r":""},{"n":"38-34-13","d":"Sink Stopper Damaged / Missing (Contact MCC)","o":"","r":"Contact MCC prior to deferral. Ensure there is no risk of an overflow."},{"n":"38-34-14","d":"Pilot Crew Rest Potable Water Drain Slow","o":"","r":""},{"n":"44-11-01","d":"Cabin Controller Tray Fan Fault","o":"","r":"If necessary, perform a reset of the following SSPCs to erase the Maintenance Message.\\n\\u001A CMS CABIN CTLR PRI \\u001A CDC2\\u001A7\\u001A3\\n\\u001A CMS CABIN CTLR SEC \\u001A CDC3\\u001A5\\u001A6"},{"n":"45-10-01","d":"Air Conditioning Health Management System (ACHMS) inop","o":"","r":""},{"n":"45-10-02","d":"ACHMS TEMPERATURE SENSORS SWAPPED OR MIS-WIRED CAUSING MISSING OR INCORRECT DATA TO BE DISPLAYED","o":"NEF LIMIT IS 10 DAYS.","r":"DEACTIVATE SYSTEM BY PULLING AND COLLARING C/B P18-3 (E10) ACHM DCU PWR."},{"n":"45-41-01","d":"Portable Maintenance Access Terminal (PMAT) Inop","o":"PMAT located in the E/E may be inop.","r":""},{"n":"46-00-01","d":"Anti-skid (rubber, non-slip) Pads on the A350 Pilot Sliding Table and the Flight Deck OMT (A350 ONLY)","o":"Some or all of the anti-skid pads can be missing on one or both Captain and First Officer folding Keyboard Assemblies","r":"N/A"},{"n":"46-13-01","d":"RFID Tag Exceptions - Missing or Inoperative","o":"Radio Frequency Identification (RFID) tag may be missing, damaged, not installed, not reporting or inoperative. This NEF code has a 30 day allowable deferral limit.","r":"Verify presence, condition, and expiration date of affected components prior to deferral of the RFID tag exception. Report the component type, the expiration date and installed location on the aircraft. Verify that the component has at least 30 days remaining before it expires. If the component has less than 30 days remaining before replacement is due, replace the component or defer the replacement to a monitor (MON) log. If RFID equipment is not available, and replacement components have less than 30 days life remaining, defer component replacement to a monitor (MON) log"},{"n":"46-30-01","d":"Flight Ops and Maintenance exchanger (FOMAX) system (Except A319/320/321)","o":"Flight Ops and Maintenance exchanger (FOMAX) is an aircraft interface device that allows two way air-ground data communication. FOMAX collects aircraft parameter data and transmits it to Airbus ground servers via 4G connection at the end of every flight. The parameter data is used by Delta TechOps Predictive Maintenance Engineering (PME) team to assess aircraft health and impending system faults. This item is not applicable to the A319/320/321, reference MEL.","r":""},{"n":"46-30-02","d":"RMAX system (A330 only)","o":"Retro-fit Maintenance Exchanger (RMAX) system may be inoperative. Applies to the A330 CEO fleet only, may be installed on ships 3310-3331,3351-3361.","r":"Open and collar circuit breakers FIN 6TM (Test Plug 2) and FIN 7TM (Test Plug 1) to deactivate the RMAX system and remove electrical power."},{"n":"46-41-01","d":"NEW EFB ADAPTER","o":"EFB ADAPTER KIT MISSING","r":"REF FOR COMPLETETION OF AA 2516-01019 \\n\\nREF MEL FOR EFB OUTLETS NOT WORKING"},{"n":"46-41-02","d":"EFB ADAPTER KIT","o":"ALL OR PART OF EFB ADAPTER KIT MISSING","r":"REF FOR COMPLETETION OF AA 2516-01019 \\n\\nREF MEL FOR EFB OUTLETS NOT WORKING"},{"n":"49-16-01","d":"APU Inlet Lock Out Tool (CAP) Missing from Flight Compartment (A330 Only)","o":"NEF for 330 only. For spares order MPN TER90693 STK 33-4900-3-0297","r":""},{"n":"52-10-01","d":"Door Handle Trim Cover Plate Damaged / Missing","o":"The cover plate that hides the attaching hardware for door handle. This NEF does not include 330 passenger door support arm hinge covers that are disbonded. See ERA 632128-14TR.","r":"If applicable, apply tape over hole caused from missing plate."},{"n":"52-10-02","d":"Door Safety Strap Damaged/Missing/Poor Condition","o":"","r":"The aft cabin door barrier strap is not a NEF item for B717 ref MEL 25-61-01 - Ventral Exit Door Strap."},{"n":"52-10-03","d":"Entry Door Safety Strap Attach Point Damaged / Poor Condition","o":"","r":""},{"n":"52-10-04","d":"Door mounted bustle delethalization pad (only effective for 6819-6823 3R door)","o":"This NEF is only effective for 6819-6823 3R door delethalization pad( 3 R pad on A/C 6819-6823 is installed for appearances only, not for head impact protection). NO other can be deferred all other are required for A/C certification.","r":""},{"n":"52-11-01","d":"Entry Door Dust Seal Damaged / Missing / Poor Condition(see notes)","o":"Confirm that the dust seal does not interfere with the normal operation of the door.\\nDuring NEF validation confirm the security of the dust seal and remove damaged section if seal security or additional migration has the possibility of interfering with normal door operation.","r":""},{"n":"52-12-01","d":"Aft Door Arming Lever Cover Damaged / Poor Condition (B717 only)","o":"","r":"The \"Lower To Arm Slide\" placard must be legible. Cover is still secure and the Aft Door Arming Lever is still accessible for use."},{"n":"52-12-06","d":"Lavatory Door Close Spring Weak / Inoperative","o":"","r":""},{"n":"52-13-01","d":"Door Viewing Port Cover Damaged / Missing / Won't Stay Attached","o":"","r":""},{"n":"52-13-02","d":"Door Cover Minor / Insignificant Damage","o":"This NEF does not include 330 passenger door support arm hinge covers that are disbonded. See ERA 632128-14TR.","r":""},{"n":"52-13-03","d":"Slide Disarming Pin Attaching Lanyard Missing or Damaged","o":"","r":"Attachment lanyard may be missing or damaged but disarming pin fully functional."},{"n":"52-13-04","d":"Passenger Door Slide Disarming Pin Pouch Damaged/Missing","o":"","r":"Door slide disarming pin must be secured to door."},{"n":"52-13-05","d":"Passenger or Entry Service Door Liner Viewing Window Clear Dust Cover Cracked","o":"This is not door window inner or middle pane. This is the door liner clear dust cover.","r":"Viewing window must be clear to view through."},{"n":"52-21-01","d":"Emergency overwing exit dust seal","o":"overwing emergency exits dust seal loose torn or missing","r":"we have this issue a lot on a 319/20/21's it is not the pressure seal only cosmetic dust seal"},{"n":"52-22-02","d":"Door Disarm Pin Missing Locking Balls","o":"Pin still servicable with steamer attached.","r":""},{"n":"52-30-01","d":"Cargo Door Assist Spring Damaged/Missing","o":"","r":""},{"n":"52-30-02","d":"Cargo Barrier Door Hold Open Latch or Hook Damaged","o":"","r":"Must still be able to secure barrier door."},{"n":"52-30-03","d":"Cargo Compartment Door Actuator Cover Bracket Damaged","o":"","r":""},{"n":"52-30-04","d":"Cargo Door Handle Bumper Damaged/Missing","o":"","r":"If more than one bumper per aircraft is missing replacement should be scheduled at the next convenient maintenance over night."},{"n":"52-30-05","d":"Cargo Door Handle Ice Shield Retract Spring Inoperative (NOT FOR 737)","o":"Not for use on 737 A/C. Use MEL 52-00-25.","r":""},{"n":"52-30-06","d":"Cargo Door Handle Knuckle Cover Plate Damaged or Missing (NOT for 737)","o":"Not for use on 737 A/C. Use MEL 52-00-25.","r":""},{"n":"52-30-07","d":"Cargo Door Proximity Switch Cover Damaged/Missing","o":"","r":""},{"n":"52-30-08","d":"Cargo Door Release Lanyard Damaged / Missing (B737)","o":"This item is for the white handle and bungee used to assist in releasing the door from the latched open position.","r":"Ensure door latches securely in the full open position and uplock release operates manually."},{"n":"52-30-09","d":"Cargo Door Safety Nets Damaged / Missing(not for C series)","o":"Not for use on C series. Must use MEL 50-22-01.","r":"Required nets must be serviceable."},{"n":"52-30-10","d":"Cargo Door Storage Pouches and MISC Contents Damaged / Missing","o":"This item is for MISC items stored in cargo bins, i.e. purge tool, extra locks and pins etc.","r":""},{"n":"52-30-11","d":"Cargo Door Insulation Blanket Worn/Damaged (757-200 only)","o":"This NEF item has a 30 day allowable time limit. Worn or damaged blankets are to be permanently repaired per AMM 25-50-09-308-133.","r":"Blanket attachment failure is limited to the periphery of the blanket.\\n\\u001ASurfaces where tape will be applied must be clean and free of dirt, oil, or other contaminants.\\n\\u001AThere must be a minimum tape overlap of 1 in. on the blanket and door frame.\\n\\u001AOnly tape that meets BMS 5-146 and/or 14 CFR 25.853(a) can be used.\\nWorn or damaged blankets are to be permanently repaired per AMM 25-50-09-308-133."},{"n":"52-30-12","d":"Cargo Door Insulation Blanket Contaminated","o":"This NEF item has a 10 day allowable time limit.","r":""},{"n":"52-40-16","d":"Engine Pylon Door Hold Open Rods or Lanyards Damaged / Missing","o":"","r":"Hold open rod must be secure."},{"n":"52-40-17","d":"Fuel Service Bay Door Hold Open Rod or Lanyard Storage Device","o":"","r":"Hold open rod must be secure."},{"n":"52-40-18","d":"Fuel Service Bay Door Hold Open Rods or Lanyards","o":"","r":"Door must close and latch normally."},{"n":"52-40-19","d":"Ground Air Service Bay Door Hold Open Rod or Lanyard Storage Device","o":"","r":"Hold open rod must be secure."},{"n":"52-40-20","d":"Ground Air Service Bay Door Hold Open Rods or Lanyards","o":"","r":"Hold open rod must be secure."},{"n":"52-40-21","d":"Hydraulic Service Bay Door Hold Open Rod or Lanyard Storage Device","o":"","r":"Hold open rod must be secure."},{"n":"52-40-22","d":"Hydraulic Service Bay Door Hold Open Rods or Lanyards","o":"","r":"Hold open rod must be secure."},{"n":"52-40-23","d":"Waste Water or Potable Water Service Door Hold Open Rod Damag
