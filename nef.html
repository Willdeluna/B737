ed / Missing - A350 ONLY","o":"No damage permitted to door, hinges, or latches (seek alternate deferral relief). Hold-Open Rod only. Refer to M-IPD A350-A-52-42-69-01000-94AA-A, Item 060 or A350 M-IPD A350-A-52-42-74-01000-94AA-A, Item 220.","r":"Ensure door integrity and operation is not compromised."},{"n":"52-42-01","d":"E & E Service Bay Door Hold Open Damaged","o":"","r":""},{"n":"52-42-02","d":"E & E Service Bay Door Tracks Damaged","o":"","r":"Door must be operative."},{"n":"52-42-03","d":"External Power Door Hold Open Rod Damaged / Missing (A330 A350))","o":"No damage permitted to door, hinges, or latches (seek alternate deferral relief). Hold-Open Rod only. For A330 ref IPC 52-42-01-01 or 52-42-01-01A Item 100. For A350 ref M-IPD A350-A-52-42-71-01000-94AA-A Item 70.","r":"Door integrity and operation is not compromised."},{"n":"52-42-04","d":"Forward Accessory Compartment Door Hold Open Damaged","o":"","r":""},{"n":"52-45-01","d":"Air Conditioning Service Bay Door Hold Open Rod or Lanyard Storage Device","o":"","r":"Hold open rod must be secure."},{"n":"52-45-02","d":"Air Conditioning Service Door Bay Hold Open Rods or Lanyards","o":"","r":"Hold open rod must be secure."},{"n":"52-45-03","d":"LOW PRESSURE GROUND AIR CONNECTION DOOR SUPPORT HOOKS","o":"Hooks used to temporarily stow the LPGC Cover during ground servicing. Located on the LPGC Door inner surface( A220 Only).","r":"If hooks are missing, no open holes through the LPGC Door are permitted (fasteners must remain installed through holes)."},{"n":"52-45-04","d":"Low pressure ground connection (LPGC) cover lanyard damage or missing (A220 only)","o":"Lanyard used to retain the low pressure ground connection (lpgc) cover when removed can be damage or missing.","r":"can not apply this NEF for low pressure ground connection (LPGC) cover missing, refer to MEL."},{"n":"52-46-01","d":"Aft Service Bay Door Hold Open Rod or Lanyard Storage Device","o":"","r":"Hold open rod must be secure."},{"n":"52-46-02","d":"Aft Service Bay Door Hold Open Rods or Lanyards","o":"","r":"Hold open rod must be secure."},{"n":"52-47-01","d":"APU Service Bay Door Hold Open Rod or Lanyard Storage Device","o":"","r":"Hold open rod must be secure."},{"n":"52-47-02","d":"APU Service Bay Door Hold Open Rods or Lanyards","o":"","r":"Hold open rod must be secure."},{"n":"52-51-01","d":"Flight Deck Door Hold Open Mechanism / Magnet Damaged / Inoperative","o":"","r":""},{"n":"52-51-02","d":"Flight Deck Door Peep Hole Cover Damaged / Missing(see notes)","o":"If damaged must be able to open and see thru peephole per CRF121.313.","r":""},{"n":"52-51-03","d":"Flight Deck Door Dust Felt Seal Worn / Poor Condition","o":"This NEF item has a 365 day allowable time limit.","r":"This does not cover the seals that are required for smoke protection."},{"n":"52-51-04","d":"Flight Deck Door Switch Guard Spring Broken or Missing","o":"Flight deck door lock switch guard spring broken or missing. Guard will not stay in the upright position.","r":"Door lock switch must function normally."},{"n":"52-52-01","d":"Lavatory Door Cosmetic Damage","o":"Lav door seals are not covered under the NEF program. Lav door and lav door seals are certified for smoke penetration. See NEF Rejected item 25-40-08 - Lavatory Door Seal Strip.","r":""},{"n":"52-52-02","d":"Lavatory Door Hard To Open or Close - Door Still Operates","o":"","r":""},{"n":"52-52-03","d":"Lavatory Door Hold Open Mechanism","o":"Boeing Remarks: The hold open device is not part of certification and is installed simply as a convenience for the maintenance and ground crew. It is discretely located in the upper track of the door and placarding to \"unlatch\" the hold open was not considered necessary.","r":""},{"n":"52-52-04","d":"Lavatory Door Lock Inoperative","o":"The FAA has rescinded policy letter MMEL PL-128, Wheelchair Accessible Lavatories. Any and all restrictions which identified as more restrictive then the MMEL relief requirements have in regards to wheelchairs accessible lavatories have been removed. NEF cannot be used on the bi-fold door","r":"Door lock may be inoperative provided door latches closed."},{"n":"52-52-06","d":"Lavatory Door Occupied/Vacant Placard Misaligned in Window Or Worn","o":"Lav door latch works normal but occupied / vacant placard misaligned in viewer window or worn.","r":"Lav Door Latch Works Normal."},{"n":"52-56-01","d":"Crew Rest Storage Compartment Door / Latches Damaged or Inoperative(see notes)","o":"No crew rest storage compartment or latch can be deferred per NEF if emergency equipment Is installed inside the door. If so please contact engineering for possible deferral.","r":"Must be able to latch closed or must be secured."},{"n":"52-56-02","d":"Lower Deck Crew Rest Service Door Lock Handle Inop (A330)","o":"This is for access from the cargo compartment only during servicing.","r":"Security seal must be intact and door locked."},{"n":"52-75-01","d":"External Door Latch Spring, Broken or Missing (EXCLUDING B717)","o":"External Service Doors (doors used for maintenance or ground servicing, located external to the aircraft) may have one loose, broken, or missing latch (includes latch spring, push-button, striker, etc.) provided the following conditions are met: Door must be External and Non-Pressurized; Door must be hinged at the Forward Edge (hinge towards direction of flight); Door must have minimum 2 latches; No damage allowed to door hinge or remaining latch(es). Door must latch closed with all other latches and door must close flush and not have any part hanging out in the airstream. This NEF item has a 10 day allowable time limit. \\n\\nFor B717, refer to SRM Ch. 51-70-01.","r":"Secure the defective door & latch with speed tape over the latch and around the door edge. Clean surface per P.S. 900-1, No. 07 prior to taping. Apply 2 layers of speed tape (Min Width 2\\u001A) to the latch side of service door with tape oriented running parallel to service door edge. Do not obscure any placards or markings with the tape (if obscured, defer or restore markings per appropriate NEF or other relief). If door is opened for servicing or maintenance, re-apply tape per these deferral remarks prior to further flight."},{"n":"53-12-01","d":"Canted Bulkhead Drain Hose Torn/Damaged in The Gear Wheel Well","o":"","r":"Ensure the damaged hose is secure and does not interfere with anything in the gear well."},{"n":"53-20-01","d":"Maintenance Platform Damaged","o":"This is for integral interior maintenance platforms only. This does not apply to the ventral stairway emergency walkway on MD88, MD90 and B717 aircraft.","r":"No structural damaged may exist. Any sharp edges must be addressed prior to deferral."},{"n":"53-51-01","d":"Radome Hold Open Rod or Lanyard Storage Device Damaged/Missing","o":"","r":"Hold open rod must be secure and hold open device must not be required to preform maintenance."},{"n":"56-12-01","d":"Flight Compartment Sliding Window Scuff Plate Damaged/Missing (B737-700/800/900 Only)","o":"This deferral is for the pilot and copilot sliding window scuff plates installed on the B737-700/800/900.","r":"Scuff plates may be missing as long as a detailed visual inspection is accomplished to ensure bolt heads do not touch the window assembly. Window must be able to operate normally.\\r\\n\\r\\nScuff plates may be damaged as long as a detailed visual inspection is accomplished to ensure no binding exists and the scuff plate is secured in place. Window must be able to operate normally."},{"n":"56-21-01","d":"Cabin Window Scratched / Crazed / Damaged","o":"Item is for the inner plastic clear pane. See applicable AMM/SRM for other window limits.","r":"This item does NOT apply to entry / service doors. This deferral item is for the inner plastic clear pane. May have crazing or moisture between panes, loose, damaged or missing interior window trim. The clear plastic pane must not be missing."},{"n":"56-21-02","d":"Cabin Window Moisture Between Panes","o":"This NEF item has a 365 day allowable time limit.","r":"This item does NOT apply to entry / service doors."},{"n":"56-21-03","d":"Cabin Window Trim Missing or Loose","o":"","r":""},{"n":"71-10-02","d":"Cowl Hoist Covers Damaged / Missing(Not for A350/330 NEO)","o":"For A350 see CDL 71-00-02 FOR A330-900 SEE CDL 71-00-05.","r":""},{"n":"71-10-03","d":"Engine Access Panel Button for Latch Damaged / Missing(check CDL for A350)","o":"For A350 reference CDL 71-00 items","r":"Latch is still operative and secures panel."},{"n":"71-10-04","d":"Engine Cowl Hold Open Rod Clamps / Lanyards / Retaining Pin / Damage / Missing(Check CDL for A350)","o":"For A350 reference CDL 71-00 items.","r":"Rod must stow normally or must be secured."},{"n":"71-10-05","d":"Engine Fan/\"3rd\" Core Cowl Hold Open Rod Damaged / Missing(NOT FOR ANY T/R HOLD OPEN ROD/SEE NOTES FOR EFFECTIVITY)","o":"This NEF is not authorized for Thrust Reverser hold open rods. Please contact engineering for T/R hold open rod deferral. NEF only valid for the hold open rods on the fan cowl and core cowl (3rd/ most aft light weight cowl). Not for C series fan cowl hold open rod see MEL 71-10-01. For Airbus 319/320/321, 330-900NEO and 350 fan cowl hold open rod see the CDL for deferral.","r":"Not for C series fan cowl hold open rod see MEL 71-10-01.For Airbus 319/320/321, 330-900NEO and 350 fan cowl hold open rod see the CDL for deferral.\\nMay be missing or broken provided other hold open device is used and can be safely operated. Rod must stow normally, be secured, or be removed if it cant be secured."},{"n":"71-12-01","d":"Forward Fixed Fan Cowl Assist Pin Handle Damaged (A330)","o":"","r":"Confirm Assist Pin is in the closed and locked position."},{"n":"71-15-01","d":"Cowl Hold Open Clips / Lanyards / Dust Caps for Hyd Pumping System Damaged / Missing (check MEL/CDL)","o":"Prior to use please check MEL/ CDL for your specific item.","r":""},{"n":"71-16-01","d":"Fan Cowl Power Opening System (A350 ONLY)","o":"Fan Cowl Power Door Opening System (Electric Assist System, \\u001APDOS\\u001A) may be inoperative, provided ALTERNATE PROCEDURES ARE USED. See below for alternate procedures. No hazardous conditions (sharp edges, etc.) are permitted. Deactivate/Reactivate PDOS per A350 AMM 71-13-XX.\\n\\nIf it is required to open/close the Fan Cowl, use alternate manual procedure per A350 AMM A350-A-71-13-XX-02ZZZ-398A-A\\n\\nNOT FOR A330-900 \\u001A USE CDL 71-00-09\\nNOT FOR THRUST REVERSER COWL \\u001A USE NEF 78-31-03\\n\\nFOR OTHER FLEETS, THERE IS NO FAN COWL POWER OPENING SYSTEM INSTALLED","r":"Fan Cowl Power Door Opening System (Electric Assist System, \\u001APDOS\\u001A) may be inoperative, provided ALTERNATE PROCEDURES ARE USED. See below for alternate procedures. No hazardous conditions (sharp edges, etc.) are permitted. Deactivate/Reactivate PDOS per A350 AMM 71-13-XX.\\n\\nIf it is required to open/close the Fan Cowl, use alternate manual procedure per A350 AMM A350-A-71-13-XX-02ZZZ-398A- A\\n\\nNOT FOR A330-900 \\u001A USE CDL 71-00-09\\nNOT FOR THRUST REVERSER COWL \\u001A USE NEF 78-31-03\\n\\nFOR OTHER FLEETS, THERE IS NO FAN COWL POWER OPENING SYSTEM INSTALLED"},{"n":"71-16-02","d":"Engine Cowl Open Pumping System Dust Caps","o":"","r":""},{"n":"78-30-01","d":"Thrust Reverser Lockout Bolt and Lock Plate from Storage Bracket Missing","o":"May be missing provided the reverser operates normally and is not needed for locking out reverser.","r":"All lock plates and bolts may be missing on the storage bracket on only one engine. Opposite engine storage bracket must have complete set of lock plates and bolts."},{"n":"78-30-02","d":"Thrust Reverser PDO System Inoperative - No Leaks( 330 only)","o":"A330 Only. Not for C Series PDOS was not option taken by Delta.","r":"Inspect per AMM 78-36-00-210-801 before deferring"},{"n":"78-30-03","d":"Thrust Reverser Lock Out Pin Nutplate Missing or Threads Damaged (B737)","o":"","r":"May be in poor condition provided the reverser operates normally and is not needed for locking out the thrust reverser."},{"n":"78-30-08","d":"Thrust Reverser Isolation Valve Lock Dispatch Kit Missing (B757)","o":"B757 Only - Thrust Reverser Isolation Valve Lock Dispatch Kit, normally stowed in the flight deck gear pouch, and only used for Thrust Reverser lock-out during maintenance activities or MEL application, may be missing provided it is not required for any MEL or Maintenance procedures.","r":"MAY BE DEFERRED ONLY IF THE TOOL IS NOT REQUIRED FOR ANY CURRENT MEL ITEMS OR MAINTENANCE TASKS.\\nTHIS NEF ITEM HAS A 10 DAY LIMIT."},{"n":"78-30-09","d":"Thrust Reverser Closure Assist Assembly Tool Missing/INOP (A220-100, 300)","o":"Thrust Reverser Closure Assist Assembly Tool (A220 PPIPD PW1000G-A-78-36-20-01B-941A-A ITEM 30, MPN 999-3470-501) may be missing/inoperative on ONE ENGINE ONLY. No damage permitted to mounting hardware or mounts on reverser structure.","r":"ONE ENGINE ONLY. One must always be present/operative. Swap operative tool between engines if required for maintenance. No damage permitted to mounting hardware or mounts on reverser structure."},{"n":"78-31-01","d":"Thrust Reverser C Duct, Cowl Pumper Hydraulic Connection Leaking / Damaged (NOT FOR 330- NEO)","o":"NOT FOR 330-NEO SEE CDL 78-00-34","r":"May be leaking provided Cowl opens normally and is supported with the hold open safety device."},{"n":"78-31-02","d":"Thrust Reverser Deactivation Signal Plate Placard Screws Missing (A330 Only)","o":"Reverser Deactivation Signal Plate placard screws missing when the reverser is not on MEL. These screws are only for retaining the Deactivation Signal Plate placard but should be reinstalled to fill the holes after clearing the MEL. Ref AMM 78-30-00-991-0","r":""},{"n":"78-31-03","d":"Thrust Reverser Cowl Opening System (LIMITED EFFECTIVITY - SEE REMARKS)","o":"Thrust Reverser Cowl Opening System (hydraulic/electric cowl opening assist for maintenance functions) may be inoperative, provided ALTERNATE PROCDURES ARE USED. See deferral remarks for alternate procedures. No leaks are permitted. No hazardous conditions (sharp edges, etc.) are permitted.","r":"No leaks are permitted. No hazardous conditions (sharp edges, etc.) are permitted. If it is required to open/close the thrust reverser cowl, use an alternate (manual or sling) procedure per:\\n\\nB737NG: AMM 78-31-00-010-801-F00 & 78-31-00-010-804-F00\\nB757: AMM 78-31-00-912-017- P03\\nB767-300 (PW): AMM 78-31-00-000-801-N00 & 78-31-00-400-801-N00\\nB767-300 (GE): AMM 78-31-00-000-801-H00 & 78-31-00-400-801-H00\\nB767-400: AMM 78-31-00-000-801-H00 & 78-31-00-400-801-H00\\nA330 (PW): AMM 78-30-00-010-801-A & 78-30-00-410-801-A\\nA350: A350-A-78-3X-XX-04001-398A-A & A350-A-78-3X-XX-05001-398A- A\\n\\nNOT FOR A220 \\u001A USE MEL 78-32-01\\nNOT FOR A319/320/321 \\u001A USE CDL 78-00-01\\nNOT FOR A330NEO \\u001A USE CDL 78-00-10\\nNOT FOR A330CEO (GE) \\u001A No Alternate Procedures Available\\nNOT FOR B717 - (Not Applicable)"},{"n":"78-31-04","d":"Thrust Reverser Manual Lock Handle Broken/Missing (B757 only)","o":"Maintenance unlock handle to unlock the thrust reverser on the locking actuator.","r":"May be in broken provided the reverser operates normally and the handle is not needed for locking out the thrust reverser or thrust reverser maintenance."},{"n":"78-32-01","d":"Thrust Reverser Manual Drive Assembly Worn (A330 only)","o":"","r":""},{"n":"79-19-01","d":"Engine Oil Service Cap Lanyard Broken/Missing","o":"","r":"Remove and discard any remaining lanyard section(s) when applying this NEF."},{"n":"79-30-01","d":"Oil Line Temperature Tabs Worn","o":"","r":"Ref applicable AMM for other requirements"},{"n":"80-19-01","d":"Engine Starter Dust Cap Damaged/Missing","o":"","r":""}];
const tbody=document.getElementById('tbody');
const search=document.getElementById('search');
const countEl=document.getElementById('count');
const noresults=document.getElementById('noresults');
document.getElementById('fcount').textContent=DATA.length;

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hl(s,q){ s=esc(s); if(!q) return s;
  const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
  return s.replace(re,'<mark>$1</mark>'); }

function noteCell(txt,q,label){
  if(!txt) return '<td data-label="'+label+'"><span class="notes empty">&mdash;</span></td>';
  return '<td data-label="'+label+'"><div class="cellwrap" onclick="this.classList.toggle(\'open\')">'+
         '<div class="notes clamp">'+hl(txt,q)+'</div></div></td>';
}

function render(q){
  q=(q||'').trim();
  const ql=q.toLowerCase();
  let rows='',shown=0;
  for(const it of DATA){
    if(ql){
      const hay=(it.n+' '+it.d+' '+it.o+' '+it.r).toLowerCase();
      if(!hay.includes(ql)) continue;
    }
    shown++;
    rows+='<tr>'+
      '<td class="col-code" data-label="Deferral Item #"><span class="code">'+hl(it.n,q)+'</span></td>'+
      '<td class="col-desc desc" data-label="Description">'+hl(it.d,q)+'</td>'+
      noteCell(it.o,q,'NEF Item Notes')+
      noteCell(it.r,q,'Deferral Remarks')+
      '</tr>';
  }
  tbody.innerHTML=rows;
  noresults.style.display = shown? 'none':'block';
  countEl.textContent = shown+' / '+DATA.length+' items shown';
}

let t;
search.addEventListener('input',e=>{clearTimeout(t);t=setTimeout(()=>render(e.target.value),120);});
document.getElementById('clearBtn').onclick=()=>{search.value='';render('');search.focus();};
document.getElementById('expandAll').onclick=()=>document.querySelectorAll('.cellwrap').forEach(c=>c.classList.add('open'));
document.getElementById('collapseAll').onclick=()=>document.querySelectorAll('.cellwrap').forEach(c=>c.classList.remove('open'));
render('');
</script>
</body>
</html>
